  { id: 'y11-pregnancy', year: 11, strand: 'Strand 1 · Human Growth & Development', title: 'Healthy pregnancy', icon: '👶', qs: [
    ['m', 'Which of the following is a common health risk for teenage mothers?', ['Higher risk of complications during childbirth', 'Improved immunity', 'Lower risk of anaemia', 'Increased income opportunities'], 'A teenage body is still growing, so the risks of obstructed labour, anaemia and high blood pressure are higher.'],
    ['m', 'Early childbearing can affect the baby\'s health by increasing the risk of:', ['Low birth weight', 'Advanced physical growth', 'Better school performance', 'High blood pressure in infancy'], 'Babies of teen mothers are more likely to be premature and underweight.'],
    ['m', 'Which action may threaten a healthy pregnancy?', ['Use of illegal drugs', 'Regular antenatal visits', 'Taking folic acid supplements', 'Daily physical activity approved by a doctor'], 'Drugs, alcohol and smoking harm the developing baby.'],
    ['m', 'Folic acid is taken during pregnancy to:', ['Prevent birth defects of the baby\'s brain and spine', 'Increase the mother\'s weight', 'Stop morning sickness', 'Make the baby bigger'], 'Folic acid prevents neural tube defects such as spina bifida.'],
    ['m', 'What is prenatal (antenatal) care?', ['Health care a pregnant woman receives before the baby is born', 'Care after the baby is born', 'Caring for elderly people', 'Vaccinating toddlers'], 'Includes check-ups, blood tests, vitamins and advice.'],
    ['m', 'Child spacing means:', ['Planning a gap of at least 2 years between births', 'Having children as close together as possible', 'Separating twins', 'Adopting children'], 'Spacing lets the mother\'s body recover and gives each child more care.'],
    ['t', 'Teen mothers are more likely to experience pregnancy-related health issues than adult women.', true, 'Their bodies are not fully developed.'],
    ['t', 'Closely spaced pregnancies can increase the risk of low birth weight and preterm birth.', true, 'The mother\'s body has not recovered its nutrient stores.'],
    ['t', 'Smoking and alcohol consumption during pregnancy cannot harm the baby\'s development.', false, 'They can cause low birth weight, miscarriage and Foetal Alcohol Syndrome.'],
    ['t', 'Attending regular antenatal check-ups is unnecessary if the mother feels healthy.', false, 'Many problems (high blood pressure, anaemia, infections) have no symptoms at first.'],
    ['s', 'Define: (a) premature birth, (b) child spacing, (c) prenatal care.', '(a) Premature birth – a baby born before 37 weeks of pregnancy.\n(b) Child spacing – planning the time between pregnancies, usually at least 2 years, using family planning.\n(c) Prenatal care – regular health check-ups and care for a pregnant woman and her unborn baby before birth.', 3],
    ['s', 'List TWO health risks that can result from early childbearing.', 'Any two: complications during childbirth (obstructed labour), anaemia, high blood pressure (pre-eclampsia), premature birth, low birth weight baby, death of mother or baby, depression; also dropping out of school.', 2],
    ['s', 'Describe the benefits of delaying pregnancy for young women.', 'Her body is fully developed, so birth is safer; she can finish school and get a job; she is emotionally ready; she can plan with a stable partner and income; the baby is healthier.', 2],
    ['s', 'List TWO support services in Kiribati that pregnant teens can access.', 'Any two: hospital antenatal clinic (e.g. Tungaru Central Hospital); island health centre / nurse; KFHA (Kiribati Family Health Association); school counsellor; church or youth groups; Ministry of Health and Medical Services clinics.', 2],
    ['s', 'Explain how regular prenatal care supports the health of both the mother and the unborn child.', 'Regular check-ups find problems early (high blood pressure, anaemia, infections, wrong baby position) so they can be treated. The mother gets iron and folic acid, vaccinations and advice on diet, rest and avoiding alcohol and smoking. This lowers the risk of complications, premature birth and low birth weight, so both mother and baby are healthier and birth is safer.', 3],
    ['s', 'Define "spacing pregnancy" and give one example.', 'Definition: leaving a planned gap between one birth and the next pregnancy (at least 2 years) so the mother recovers.\nExample: a couple uses the contraceptive injection or condoms after their first child and waits until the child is 2–3 years old before having another.', 2],
    ['s', 'Define prenatal care and state ONE benefit and ONE risk.', 'Definition: health care given to a pregnant woman before birth.\nBenefit: problems like anaemia or high blood pressure are found and treated early.\nRisk: travel costs or time (e.g. from outer islands); rarely, side effects of medicines or tests. (Accept a reasonable risk.)', 3],
    ['m', 'Which vitamin or mineral helps prevent anaemia in pregnancy?', ['Iron', 'Vitamin C only', 'Calcium only', 'Sodium'], 'Iron is needed to make red blood cells.'],
    ['m', 'A baby born before 37 weeks is called:', ['Premature (preterm)', 'Overdue', 'Full term', 'A foetus'], 'Premature babies may have breathing and feeding problems.'],
  ]},
  { id: 'y11-support', year: 11, strand: 'Strand 1 · Human Growth & Development', title: 'Supporting a healthy pregnancy', icon: '👨‍👩‍👧', qs: [
    ['m', 'How can a partner best support a healthy pregnancy?', ['Provide emotional support and attend antenatal visits', 'Ignore health advice', 'Encourage alcohol use to relax', 'Leave all decisions to the mother'], 'A healthy pregnancy is not only the mother\'s responsibility.'],
    ['m', 'Which is a way the FAMILY can support a pregnant woman?', ['Helping with heavy household work so she can rest', 'Asking her to lift heavy water containers', 'Smoking around her', 'Keeping her from the clinic'], 'Families can share chores and provide healthy food.'],
    ['m', 'How can the COMMUNITY support healthy pregnancies?', ['Providing clinics, transport and health education', 'Selling alcohol to pregnant women', 'Blaming teenage mothers', 'Closing health centres'], 'Churches, councils and health workers all play a part.'],
    ['t', 'Ensuring a healthy pregnancy is the responsibility of the mother only.', false, 'Fathers, families and communities all share the responsibility.'],
    ['s', 'Give THREE characteristics of a healthy pregnancy.', 'Any three: regular antenatal check-ups; a balanced diet with iron and folic acid; no alcohol, smoking or drugs; enough rest and gentle exercise; normal weight gain and blood pressure; emotional support; the baby grows and moves normally.', 3],
    ['s', 'Discuss FOUR ways a father can support a pregnant partner.', '1. Go with her to antenatal visits.\n2. Give emotional support – listen, be patient, reduce stress.\n3. Help with household chores so she can rest.\n4. Make sure she eats healthy food, and do not smoke or drink around her.\n5. Save money and plan for the birth and transport to the hospital.', 4],
    ['s', 'Explain the role of the father, family and community in supporting a healthy pregnancy.', 'Father: gives emotional and financial support, attends antenatal visits, avoids smoking/alcohol near her, shares chores.\nFamily: provides nutritious food, helps with heavy work, encourages clinic visits, respects her need to rest.\nCommunity: provides accessible health services and transport, health education, and does not stigmatise young mothers. Together they reduce stress and risks for mother and baby.', 3],
    ['s', 'Develop a simple plan for supporting a healthy pregnancy.', 'Example plan:\n• Month 1–3: confirm the pregnancy at the clinic; start folic acid and iron; stop alcohol and smoking.\n• Every month: attend an antenatal check-up with the partner.\n• Daily: eat fish, green leaves and fruit; drink clean water; rest; walk gently.\n• Family: share chores; save money for the birth.\n• Final month: arrange transport and hospital bag; learn the danger signs.', 4],
    ['m', 'Which is a way the father can support a pregnant partner?', ['Going with her to antenatal clinic visits', 'Smoking in the house', 'Leaving her to do all the heavy work', 'Spending money on alcohol'], 'Fathers share the responsibility.'],
    ['m', 'Why should a pregnant woman avoid lifting very heavy loads?', ['It can strain her body and harm the pregnancy', 'It makes the baby grow faster', 'It is good exercise', 'It has no effect'], 'Family members can help with heavy work.'],
    ['m', 'Which is a DANGER SIGN in pregnancy that needs a nurse straight away?', ['Heavy bleeding or severe headache', 'Feeling the baby move', 'Mild tiredness', 'Wanting to eat more'], 'Bleeding, severe headache, swelling and fever are danger signs.'],
    ['m', 'A birth plan helps a family to:', ['Prepare transport, money and a place for a safe delivery', 'Choose the baby\'s school', 'Avoid the clinic', 'Delay the birth'], 'Planning reduces risks on the day.'],
    ['m', 'How can the church or community support young pregnant mothers?', ['By giving care and support without judging them', 'By shaming them', 'By telling them to leave school', 'By keeping them from clinics'], 'Support helps both mother and baby stay healthy.'],
  ]},
  { id: 'y11-bodyimage', year: 11, strand: 'Strand 1 · Human Growth & Development', title: 'Body image & beauty standards', icon: '💄', qs: [
    ['m', 'Which statement about attractiveness is TRUE?', ['What people find attractive differs between cultures and changes with age', 'Everyone in the world has the same idea of beauty', 'Beauty standards never change', 'Only thin bodies are attractive'], 'In the past, a larger body was a sign of wealth and beauty in many Pacific cultures.'],
    ['m', 'Gendered beauty standards can drive people to:', ['Use harmful practices like skin-bleaching or extreme dieting', 'Feel confident in all body types', 'Eat balanced meals', 'Exercise safely'], 'Unrealistic standards cause people to harm their bodies.'],
    ['m', 'A healthy response to media beauty standards is to:', ['Remember that many images are edited and value your body for what it can do', 'Copy celebrities at any cost', 'Stop eating', 'Compare yourself all day'], 'Media literacy protects body image.'],
    ['t', 'Beauty standards for men can also cause pressure, such as wanting big muscles.', true, 'Some young men misuse steroids or supplements.'],
    ['s', 'Critically assess how gendered standards of beauty can drive people to change their appearance.', 'The media, advertisers and social media show women as thin with light skin and men as tall and muscular. These standards are narrow and often edited. People who do not match them may feel ashamed and try to change their bodies through crash diets, skin-lightening creams, steroids or surgery, which can damage health and mental well-being. The standards are made by culture and business, not by health, so we should question them and value diverse bodies.', 4],
    ['s', 'Discuss how what people find attractive differs with age and culture.', 'Culture: in traditional Kiribati and Pacific cultures, a larger body showed health and status, while Western media prefer thin bodies. Some cultures value tattoos, long hair or darker skin.\nAge: young people may focus on looks and fashion, while older people may value kindness, health and maturity. Ideas of beauty also change over time.', 3],
    ['m', 'Why do many photos in advertisements look "perfect"?', ['They are often edited and use lighting and make-up', 'Everyone looks like that', 'They are always natural', 'Cameras cannot change images'], 'Being media-literate protects body image.'],
    ['m', 'Which is a harmful practice caused by pressure to look a certain way?', ['Using skin-lightening creams', 'Eating balanced meals', 'Playing sport', 'Getting enough sleep'], 'Some creams contain harmful chemicals such as mercury.'],
    ['m', 'Which is a positive message about body image?', ['Healthy bodies come in many shapes and sizes', 'Only thin people are healthy', 'Muscles make you a better person', 'Your worth depends on your looks'], 'Health is more than appearance.'],
    ['m', 'Standards of beauty are shaped mainly by:', ['Culture, media and time period', 'Chromosomes only', 'Blood type', 'Nothing – they are fixed'], 'That is why they differ between places and change over time.'],
    ['m', 'Which could be a result of a very negative body image?', ['Eating disorders and low self-esteem', 'Better sleep', 'More confidence', 'Improved fitness'], 'Poor body image harms mental health.'],
  ]},
  { id: 'y11-cardio', year: 11, strand: 'Strand 4 · Sport Science', title: 'Heart, blood & lungs', icon: '🫀', qs: [
    ['m', 'Which organ pumps blood around the body during exercise?', ['Heart', 'Lung', 'Liver', 'Kidney'], 'The heart is a muscular pump with four chambers.'],
    ['m', 'Which blood cells carry oxygen around the body?', ['Red blood cells', 'White blood cells', 'Platelets', 'Plasma'], 'Red blood cells contain haemoglobin, which carries oxygen.'],
    ['m', 'Which blood vessels carry blood AWAY from the heart?', ['Arteries', 'Veins', 'Capillaries', 'Valves'], 'Arteries = Away. Veins return blood to the heart.'],
    ['m', 'Where does gas exchange happen in the lungs?', ['Alveoli', 'Trachea', 'Bronchi', 'Diaphragm'], 'Alveoli are tiny air sacs surrounded by capillaries.'],
    ['m', 'Gas exchange is needed to supply ____ to cells and remove ____.', ['oxygen; carbon dioxide', 'carbon dioxide; oxygen', 'oxygen; food', 'carbon dioxide; water'], 'Oxygen in, carbon dioxide out.'],
    ['m', 'What is the function of white blood cells?', ['Fight infection', 'Carry oxygen', 'Clot blood', 'Carry nutrients'], 'Platelets clot blood; plasma carries nutrients.'],
    ['m', 'What happens to the diaphragm when you breathe IN?', ['It contracts and flattens (moves down)', 'It relaxes and moves up', 'It does not move', 'It pushes air out'], 'The chest gets bigger, pressure drops and air rushes in.'],
    ['m', 'Veins contain ___ to stop blood flowing backwards.', ['Valves', 'Alveoli', 'Platelets', 'Muscles only'], 'Valves keep blood moving towards the heart.'],
    ['M', 'Match the structure: ALVEOLI', ['Pumps blood around the body', 'Transfers oxygen to muscles', 'Gas exchange between lungs and blood', 'Contracts and relaxes to control breathing'], 2, 'Alveoli are the site of gas exchange.'],
    ['M', 'Match the structure: DIAPHRAGM', ['Pumps blood around the body', 'Gas exchange between lungs and blood', 'Contracts and relaxes to control breathing', 'Helps regulate body temperature'], 2, 'The diaphragm is the main breathing muscle.'],
    ['t', 'Capillaries are responsible for exchanging oxygen and carbon dioxide between the blood and muscles.', true, 'Capillary walls are one cell thick, so gases pass through easily.'],
    ['t', 'During exercise the heart rate and breathing rate both increase.', true, 'Muscles need more oxygen and must remove more carbon dioxide.'],
    ['s', 'Where is the diaphragm located, and what happens when you exhale?', 'Location: a dome-shaped sheet of muscle under the lungs, separating the chest (thoracic) cavity from the abdomen.\nExhaling: the diaphragm RELAXES and moves UP into a dome; the ribs move down and in; chest volume decreases, air pressure in the lungs increases, and air is pushed out.', 3],
    ['s', 'Explain how the cardiovascular and respiratory systems work together during sport.', 'The respiratory system breathes in air, and oxygen diffuses from the alveoli into the capillaries. The heart pumps the oxygen-rich blood through arteries to the working muscles. In the muscle capillaries, oxygen enters the muscle and carbon dioxide leaves. Veins return the blood to the heart and lungs, where CO₂ is breathed out. During exercise, heart rate, stroke volume and breathing rate all increase to meet the muscles\' demand.', 4],
  ]},
  { id: 'y11-muscles', year: 11, strand: 'Strand 4 · Sport Science', title: 'Muscles, joints & movement', icon: '💪', qs: [
    ['m', 'Which muscle is the prime mover (agonist) during elbow flexion?', ['Biceps', 'Triceps', 'Deltoid', 'Gluteals'], 'Biceps contract to bend the elbow; triceps relax (antagonist).'],
    ['m', 'Which muscle extends (straightens) the elbow?', ['Triceps', 'Biceps', 'Hamstrings', 'Pectorals'], 'Triceps are at the back of the upper arm.'],
    ['m', 'Which muscle group extends the knee (kicking a ball)?', ['Quadriceps', 'Hamstrings', 'Gastrocnemius', 'Biceps'], 'Quadriceps are at the front of the thigh.'],
    ['m', 'Which synovial joint allows movement in all directions, including rotation?', ['Ball and socket joint', 'Pivot joint', 'Hinge joint', 'Gliding joint'], 'Examples: shoulder and hip.'],
    ['m', 'If you throw a ball you rotate your shoulder. The shoulder is a:', ['Ball and socket joint', 'Hinge joint', 'Pivot joint', 'Slightly movable joint'], 'Ball-and-socket joints allow the widest range of movement.'],
    ['m', 'The knee and elbow are examples of:', ['Hinge joints', 'Pivot joints', 'Ball and socket joints', 'Fixed joints'], 'Hinge joints allow flexion and extension only.'],
    ['m', 'The joint between the top two vertebrae that lets you turn your head is a:', ['Pivot joint', 'Hinge joint', 'Gliding joint', 'Saddle joint'], 'The atlas rotates around the axis.'],
    ['m', 'Bending a joint so the angle gets SMALLER is called:', ['Flexion', 'Extension', 'Abduction', 'Rotation'], 'Extension increases the angle.'],
    ['m', 'Moving a limb AWAY from the midline of the body is:', ['Abduction', 'Adduction', 'Flexion', 'Rotation'], 'Adduction = add back towards the body.'],
    ['m', 'Which muscle raises the arm sideways (shoulder abduction)?', ['Deltoid', 'Biceps', 'Abdominals', 'Hamstrings'], 'The deltoid covers the shoulder.'],
    ['t', 'The hamstrings are responsible for knee extension.', false, 'Hamstrings FLEX the knee. Quadriceps extend it.'],
    ['t', 'Muscles work in pairs: when one contracts the other relaxes.', true, 'Agonist (prime mover) and antagonist.'],
    ['s', 'List TWO types of cartilaginous joints.', '• Symphysis – e.g. pubic symphysis, intervertebral discs.\n• Synchondrosis – e.g. growth plates, first rib joined to the sternum.\n(Accept examples: joints between vertebrae, pubic symphysis.)', 2],
    ['s', 'Discuss the function of the quadriceps muscle and give ONE example in sport.', 'Function: the quadriceps are four muscles at the front of the thigh. They extend (straighten) the knee and help flex the hip. They are the agonist in kicking, jumping and running, and work with the hamstrings (antagonist).\nExample: kicking a soccer ball – the quadriceps contract strongly to straighten the knee and drive the foot through the ball. Also jumping for a volleyball spike.', 3],
    ['s', 'Analyse the movement in a push-up by naming the prime muscles and joint actions.', 'Going down: elbow flexion – the triceps work eccentrically (lengthen under control).\nPushing up: elbow extension – triceps are the prime mover; pectorals (chest) and deltoids (shoulder) push the arms forward (shoulder horizontal flexion). Abdominals keep the body straight.', 3],
  ]},
  { id: 'y11-energy', year: 11, strand: 'Strand 4 · Sport Science', title: 'Energy systems & nervous system', icon: '⚡', qs: [
    ['m', 'What is physiology?', ['The study of how the body works (its functions)', 'The study of body structure only', 'The study of the mind', 'The study of plants'], 'Exercise physiology studies how the body responds to exercise.'],
    ['m', 'What is the predominant energy system in a 400 m race?', ['Lactic acid (anaerobic glycolysis)', 'Aerobic', 'ATP-PC', 'Phosphate'], 'A 400 m race lasts about 45–90 seconds at high intensity.'],
    ['m', 'What are the waste products of the aerobic energy system?', ['Carbon dioxide, heat and water', 'Lactate, heat and water', 'Lactate, oxygen and creatine', 'Carbon dioxide, oxygen and creatine'], 'Aerobic respiration: glucose + oxygen → energy + CO₂ + water + heat.'],
    ['m', 'Which energy system is used for a 100 m sprint or a shot put?', ['ATP-PC (phosphocreatine)', 'Aerobic', 'Lactic acid', 'Fat system'], 'ATP-PC gives very fast energy for up to about 10 seconds.'],
    ['m', 'Which energy system is the main one in a marathon?', ['Aerobic', 'ATP-PC', 'Lactic acid', 'Anaerobic alactic'], 'Aerobic uses oxygen and can last for hours.'],
    ['m', 'Which energy systems do NOT need oxygen?', ['ATP-PC and lactic acid', 'Aerobic only', 'All three', 'None'], 'Anaerobic = without oxygen.'],
    ['m', 'Which part of the nervous system is made up of the brain and spinal cord?', ['Central Nervous System (CNS)', 'Peripheral Nervous System (PNS)', 'Autonomic system only', 'Sensory organs'], 'The PNS is all the nerves outside the brain and spinal cord.'],
    ['m', 'Nerves that carry messages FROM the brain TO the muscles are:', ['Motor neurons', 'Sensory neurons', 'Relay only', 'Blood vessels'], 'Sensory neurons carry information to the CNS; motor neurons carry commands to muscles.'],
    ['t', 'The ATP-PC system is the fastest way to produce energy but lasts only about 10 seconds.', true, 'Creatine phosphate stores run out quickly.'],
    ['t', 'The lactic acid system produces lactate, which causes muscle fatigue.', true, 'Lactate/hydrogen ions build up and cause a burning feeling.'],
    ['s', 'Outline ONE advantage and ONE disadvantage of the anaerobic lactic energy system.', 'Advantage: produces energy quickly without oxygen for high-intensity efforts lasting about 10 seconds to 2 minutes (e.g. 400 m).\nDisadvantage: produces lactic acid, which builds up and causes muscle fatigue and pain, so the intensity cannot be kept up for long.', 2],
    ['s', 'Discuss the three energy systems: duration, whether oxygen is needed, and one sport for each.', '1. ATP-PC – 0 to about 10 seconds; no oxygen (anaerobic); e.g. 100 m sprint, shot put, high jump.\n2. Anaerobic lactic (lactic acid) – about 10 seconds to 2 minutes; no oxygen; produces lactic acid; e.g. 400 m race, 100 m swim.\n3. Aerobic – longer than 2 minutes, can last for hours; needs oxygen; waste is CO₂, water and heat; e.g. marathon, long-distance swimming, a full soccer match.', 3],
    ['s', 'State ONE part of the nervous system and its function in relation to exercise.', 'Example: the brain (CNS) – decides and sends messages to muscles to start movement and controls balance and co-ordination.\nOR motor nerves (PNS) – carry signals from the spinal cord to the muscles to make them contract.\nOR the cerebellum – controls balance and co-ordination of movements.', 2],
    ['s', 'A basketball player sees the ball coming and reacts quickly to catch it. Explain how the CNS and PNS work together.', '1. The eyes (sense organs) detect the ball; sensory neurons of the PNS carry the message to the brain (CNS).\n2. The brain processes the information – judges speed and direction – and decides to catch.\n3. The brain sends signals down the spinal cord and out through motor neurons (PNS) to the arm and hand muscles.\n4. The muscles contract to move the hands into position and catch the ball. Feedback from the senses lets the brain adjust the movement.', 3],
    ['s', 'Explain how the nervous system adapts and responds to exercise. Include three mechanisms.', '1. Faster reaction time – with training, nerve pathways become more efficient, so signals travel faster.\n2. Better co-ordination – the brain recruits the right motor units at the right time, so movements become smooth and automatic (muscle memory).\n3. More motor units recruited – more muscle fibres contract together for more strength and power.\n4. The autonomic nervous system raises heart rate and breathing rate during exercise.', 4],
  ]},
  { id: 'y11-sexbehav', year: 11, strand: 'Strand 2 · Holistic Sexuality', title: 'Sexual behaviour, communication & negotiation', icon: '💬', qs: [
    ['m', 'Which is a healthy choice to reduce the risk of unintended pregnancy and STIs?', ['Using condoms consistently and correctly', 'Avoiding conversations about consent', 'Ignoring sexual health information', 'Having multiple partners without protection'], 'Condoms protect against both.'],
    ['m', 'What is one way to support your life goals while being sexually responsible?', ['Practising abstinence or delaying sexual activity', 'Engaging in risky behaviours', 'Disregarding personal values', 'Avoiding communication with your partner'], 'Delaying sex helps you finish school and reach your goals.'],
    ['m', 'Which method is the most effective in preventing BOTH pregnancy and STIs?', ['Male and female condoms', 'Withdrawal', 'Birth control pills', 'Emergency contraception'], 'Pills and emergency contraception do not stop STIs.'],
    ['m', 'What is a key element of effective communication in a relationship?', ['Clear and respectful conversation', 'Passive silence', 'Making assumptions', 'Avoiding difficult topics'], 'Speak clearly, listen actively and respect each other.'],
    ['m', 'Which is an "I" statement?', ['"I feel uncomfortable and I want to stop."', '"You always pressure me."', '"You never listen."', '"Everyone does it."'], '"I" statements express feelings without blaming.'],
    ['m', 'Transactional sex means:', ['Exchanging sex for money, gifts or favours', 'Sex within marriage', 'Talking about sex', 'Abstinence'], 'It is high-risk because of power inequality.'],
    ['m', 'Which can WEAKEN a person\'s negotiation skills in a relationship?', ['Power inequality and low self-confidence', 'Mutual respect', 'Good communication', 'Equal decision-making'], 'Social norms, power gaps and low confidence make it harder to say no.'],
    ['t', 'Open communication with a partner about sexual boundaries is an important part of healthy relationships.', true, 'Talking about boundaries builds trust and respect.'],
    ['t', 'Choosing abstinence is a valid personal decision to avoid the risks of sexual behaviour.', true, 'Abstinence is a choice anyone can make at any time.'],
    ['t', 'Avoiding conversations about sexual health can strengthen a relationship.', false, 'Avoiding these talks leads to misunderstandings and risks.'],
    ['t', 'Using "I" statements is a helpful way to communicate your sexual needs and boundaries.', true, 'They are assertive but not aggressive.'],
    ['t', 'Mutual consent requires clear communication from both partners.', true, 'Consent must be clear, freely given and ongoing.'],
    ['s', 'List TWO ways to practise good communication with a partner.', 'Any two: use "I" statements; listen actively without interrupting; be honest; talk at a calm time; respect the other person\'s boundaries; check you understood; use clear, assertive body language.', 2],
    ['s', 'Describe TWO reasons why negotiation skills are important.', 'Any two: they help you say no to pressure and protect your values; they let partners agree on safe sex (e.g. using condoms); they solve conflicts without violence; they build equal and respectful relationships; they help make decisions that support your life goals.', 2],

    ['s', 'Why is good communication important in sexual relationships? Give TWO reasons.', '1. It makes sure both partners give consent and respect each other\'s limits.\n2. It lets partners agree on protection (condoms or contraception) to prevent STIs and pregnancy.\n3. It builds trust and prevents misunderstandings.', 2],
    ['s', 'Explain how making responsible sexual choices can minimise risks and support long-term life plans.', 'Responsible choices such as abstinence, delaying sex, being faithful to one partner and using condoms correctly reduce the risk of STIs, HIV and unplanned pregnancy. This lets a young person stay healthy, finish school, train for a job and plan when to have a family. Avoiding these risks also protects mental health and relationships, so their future goals are not disrupted.', 3],

'y10-repro': `
## Key words
- **Reproduction** – making new life when a sperm fertilises an egg.
- **Gamete** – a sex cell: sperm (male) or ovum/egg (female).
- **Hormone** – a chemical messenger carried in the blood.
## Female reproductive organs
- **Ovaries** – produce eggs and the hormones oestrogen and progesterone.
- **Fallopian tubes (oviducts)** – carry the egg to the uterus; fertilisation happens here.
- **Uterus (womb)** – where the baby grows.
- **Cervix** – the neck of the uterus.
- **Vagina** – the birth canal.
## Male reproductive organs
- **Testes** – produce sperm and testosterone.
- **Epididymis** – stores sperm while it matures.
- **Vas deferens (sperm duct)** – carries sperm to the urethra.
- **Prostate gland and seminal vesicles** – add fluid to make semen.
- **Urethra and penis** – carry semen out of the body.
## Reproductive hormones
- **Pituitary gland** (the "master gland" in the brain) releases **FSH** and **LH**.
- **FSH** – matures eggs (female) and helps sperm production (male).
- **LH** – triggers ovulation; stimulates oestrogen and testosterone.
- **Oestrogen** – female puberty changes: breasts, wider hips, periods.
- **Progesterone** – thickens the uterus lining and maintains pregnancy.
- **Testosterone** – male puberty changes: deep voice, body hair, muscles, sperm.
## Menstrual cycle (about 28 days)
- Days 1–5: period (the uterus lining is shed).
- Around day 14: ovulation (an egg is released).
- If the egg is not fertilised, progesterone falls and the next period starts.
`,
'y10-sexgender': `
## Definitions (learn these exactly)
- **Sex** – our physical characteristics, genes and hormones that make us male, female or intersex. It is **biological**.
- **Gender** – your sense of who you are as a guy, girl or something else, and the roles society expects. It is **social and cultural**.
- **Reproduction** – when a male gamete fuses with a female gamete to form a fertilised egg (zygote).
- **Sexual orientation** – a person's sexual interest in and attraction to others.
## Biological aspects (sex)
- Chromosomes: XX (female), XY (male).
- Hormones: oestrogen and progesterone, or testosterone.
- Reproductive organs: ovaries or testes.
## Social aspects (gender)
- Roles, behaviour and expectations learned from family, church, school and media.
- Kiribati example: men traditionally fish, cut toddy and speak in the maneaba; women care for the home and children.
- Gender roles differ between cultures and **can change** over time.
## Cultural views
- In many Kiribati families, talking about sex is seen as taboo.
- Men are often seen as heads of the family and main decision makers.

'y11-cardio': `
## Cardiovascular system
- **Heart** – a muscular pump with 4 chambers.
- **Arteries** carry blood **away** from the heart.
- **Veins** carry blood back to the heart and have **valves**.
- **Capillaries** are tiny vessels where gases and nutrients are exchanged with the muscles.
## Blood
- **Red blood cells** carry oxygen (haemoglobin).
- **White blood cells** fight infection.
- **Platelets** clot blood.
- **Plasma** carries nutrients, hormones and CO₂.
## Respiratory system
- Air travels: nose/mouth → trachea → bronchi → bronchioles → **alveoli**.
- **Alveoli** – gas exchange between the lungs and the blood.
- **Diaphragm** – a dome-shaped muscle under the lungs that controls breathing.
## Mechanics of breathing
- **Inhale** – the diaphragm contracts and flattens, the ribs move up and out, the chest gets bigger, and air rushes in.
- **Exhale** – the diaphragm relaxes and moves up, the chest gets smaller, and air is pushed out.
## During exercise
- Heart rate, stroke volume and breathing rate all increase to deliver more oxygen and remove CO₂.

'y11-muscles': `

'y11-energy': `
## Key words
- **Physiology** – how the body works. **Exercise** – planned physical activity.
- **ATP** – the energy molecule used by muscles.
## The three energy systems
- **ATP-PC (phosphocreatine)** – 0 to about 10 seconds; no oxygen; fastest energy. Examples: 100 m sprint, shot put, high jump.
- **Anaerobic lactic (lactic acid)** – about 10 seconds to 2 minutes; no oxygen; produces lactic acid, which causes fatigue. Example: 400 m race.
- **Aerobic** – longer than 2 minutes, up to hours; needs oxygen; waste products are CO₂, water and heat. Examples: marathon, long swim, a full soccer match.
## Lactic system
- **Advantage** – quick energy without oxygen.
- **Disadvantage** – lactic acid build-up causes pain and fatigue.
## Nervous system
- **CNS** – the brain and spinal cord. It decides and sends commands.
- **PNS** – all the nerves outside the CNS.
- **Sensory neurons** carry information to the CNS. **Motor neurons** carry commands to the muscles.
- **Cerebellum** – balance and co-ordination.
## Example: catching a ball
- Eyes see the ball → sensory nerves (PNS) → brain decides (CNS) → spinal cord → motor nerves (PNS) → muscles contract.
## Adaptations to training
- Faster reaction time, better co-ordination (skills become automatic), and more motor units recruited.
`,

'y11-fitness': `

'y11-injury': `
## Key words
- **Sprain** – an injury to a **ligament** (e.g. a twisted ankle).
- **Strain** – an injury to a **muscle or tendon** (e.g. a pulled hamstring).
- **Rehabilitation** – gradually restoring movement and strength after injury.
## PRICE treatment
- **P – Protection** – stop playing and protect the injury from more harm.
- **R – Rest** – do not use it for 24–72 hours.
- **I – Ice** – 15–20 minutes, wrapped in a cloth, to reduce swelling and pain.
- **C – Compression** – a firm elastic bandage to limit swelling (not too tight).
- **E – Elevation** – raise it above the heart.

- Apply heat to a new swelling, massage hard, or keep playing.
## Rehabilitation
- Gentle movement, then stretching, then strengthening, then a slow return to sport.

'y11-disease': `

- **Not** spread between people. Usually long-term (diabetes, heart disease, cancer, stroke).
- **Main causes** – unhealthy diet, physical inactivity, smoking, alcohol, obesity.

- **Prevention** – abstinence, faithfulness, condoms, testing, education.

// ───────── Data ─────────
// Flatten the bank into one list of normalised questions with stable keys (used for progress tracking).
const ALL = [];
const BY_TOPIC = {};
function norm(raw, key, src, year) {
  const [k] = raw;
  if (k === 'm') return { key, type: 'mc', q: raw[1], opts: raw[2], ans: 0, expl: raw[3], shuffle: true, src, year };
  if (k === 'M') return { key, type: 'mc', q: raw[1], opts: raw[2], ans: raw[3], expl: raw[4], shuffle: false, src, year };
  if (k === 't') return { key, type: 'tf', q: raw[1], ans: raw[2], expl: raw[3], src, year };
  return { key, type: 'sa', q: raw[1], expl: raw[2], marks: raw[3] || 1, src, year };
}
TOPICS.forEach(t => {
  BY_TOPIC[t.id] = t.qs.map((raw, i) => norm(raw, t.id + ':' + i, 'Year ' + t.year + ' · ' + t.title, t.year));

});
PAPERS.forEach(p => p.sections.forEach((s, si) => {

const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
const LETTERS = 'ABCDEFGH';
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 1600); }
function ask(msg, yesLabel, onYes) {
  const d = document.createElement('div');
  d.className = 'modal';
  d.innerHTML = `<div class="card"><p style="margin-top:0">${esc(msg)}</p><div class="btns">
    <button class="btn ghost" id="askNo">Cancel</button><button class="btn bad" id="askYes">${esc(yesLabel)}</button></div></div>`;
  document.body.appendChild(d);
  d.querySelector('#askNo').onclick = () => d.remove();
  d.querySelector('#askYes').onclick = () => { d.remove(); onYes(); };
}
function setNav(html) { $nav.innerHTML = html ? '<div class="navbar"><div class="in">' + html + '</div></div>' : ''; }
function setTitle(t) { document.getElementById('hdrTitle').textContent = t; document.title = t === 'HPE Revision' ? 'St Louis HPE Revision' : t + ' · St Louis HPE Revision'; }
function pillFor(p) {
  if (p == null) return '<span class="pill">New</span>';
  return '<span class="pill ' + (p >= 80 ? 'ok' : p >= 50 ? 'warn' : 'bad') + '">' + p + '%</span>';
}
function typeLabel(q) { return q.type === 'mc' ? 'Multiple choice' : q.type === 'tf' ? 'True or false' : 'Written answer' + (q.marks ? ' · ' + q.marks + ' mark' + (q.marks > 1 ? 's' : '') : ''); }
function answerText(q, order) {
  if (q.type === 'mc') return LETTERS[order ? order.indexOf(q.ans) : q.ans] + '. ' + q.opts[q.ans] + (q.expl ? '\n\n' + q.expl : '');
  if (q.type === 'tf') return (q.ans ? 'TRUE' : 'FALSE') + (q.expl ? ' – ' + q.expl : '');
  return q.expl;
}

// Quizzes use multiple-choice questions only. Past papers are shown as worked solutions.
const MCQ = ALL.filter(q => q.type === 'mc' && q.year !== 'paper');
const mcqOf = id => BY_TOPIC[id].filter(q => q.type === 'mc');

// Turn the simple note format in notes.js into HTML.
function notesHTML(src) {
  let html = '', inList = false;
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  src.trim().split('\n').forEach(line => {
    line = line.trim();
    const bullet = line.startsWith('- ');
    if (!bullet && inList) { html += '</ul>'; inList = false; }
    if (!line) return;
    if (line.startsWith('## ')) html += '<h3>' + inline(line.slice(3)) + '</h3>';
    else if (bullet) { if (!inList) { html += '<ul>'; inList = true; } html += '<li>' + inline(line.slice(2)) + '</li>'; }
    else html += '<p>' + inline(line) + '</p>';
  });
  return html + (inList ? '</ul>' : '');
}

// ───────── Router ─────────
// Screens are kept in an in-memory stack so the app also works inside embedded frames.
let quiz = null, timerId = null;
const stack = ['/'];
function go(path) { if (path === '/') stack.length = 1; else stack.push(path); route(); }
function goBack() { if (stack.length > 1) { stack.pop(); route(); } }
function route() {
  clearInterval(timerId); window.scrollTo(0, 0);
  const parts = stack[stack.length - 1].replace(/^\//, '').split('/');
  document.getElementById('backBtn').style.visibility = parts[0] ? 'visible' : 'hidden';
  setNav('');
  switch (parts[0]) {
    case 'year': return viewYear(+parts[1]);
    case 'topic': return viewTopic(parts[1]);
    case 'notes': return viewNotes(parts[1]);
    case 'papers': return viewPapers();
    case 'paper': return viewPaper(parts[1]);
    case 'quiz': return quiz ? (quiz.done ? viewResults() : viewQuestion()) : go('/');
    case 'search': return viewSearch();
    case 'progress': return viewProgress();
    case 'help': return viewHelp();
    default: return viewHome();
  }
}

// ───────── Year & topic ─────────
function viewYear(y) {
  setTitle('Year ' + y);
  let html = `<h1>Year ${y} topics</h1><p class="sub">Read the notes, then take the multiple-choice quiz.</p>
    <div class="btns one"><button class="btn gold" onclick="startYearQuiz(${y})">⚡ Mixed Year ${y} quiz (20 questions)</button></div>`;
  let last = '';
  TOPICS.filter(t => t.year === y).forEach(t => {
    if (t.strand !== last) { html += `<div class="strand">${esc(t.strand)}</div>`; last = t.strand; }
    const b = save.best[t.id];
    html += `<button class="row" onclick="go('/topic/${t.id}')" style="margin-bottom:10px">
      <span class="ic">${t.icon}</span>
      <span class="mid"><b>${esc(t.title)}</b><small>Notes · ${mcqOf(t.id).length} quiz questions</small>
        <span class="bar"><i style="width:${b || 0}%"></i></span></span>
      ${pillFor(b)}</button>`;
  });
  $app.innerHTML = html;
}
function startYearQuiz(y) { startQuiz(shuffle(MCQ.filter(q => q.year === y)).slice(0, 20), 'Year ' + y + ' quiz', 'practice'); }

function viewTopic(id) {
  const t = TOPICS.find(t => t.id === id); if (!t) return go('/');
  setTitle(t.title);
  const b = save.best[id], mc = mcqOf(id);
  $app.innerHTML = `
    <div class="center"><div style="font-size:52px">${t.icon}</div>
    <h1>${esc(t.title)}</h1><p class="sub">Year ${t.year} · ${esc(t.strand)}</p>
    <p class="muted">Best quiz score: <b>${b == null ? 'not tried yet' : b + '%'}</b></p></div>
    <div class="btns one"><button class="btn" onclick="go('/notes/${id}')">📖 Read the notes</button></div>
    <div class="btns">
      <button class="btn gold" onclick="startTopic('${id}', 'practice')">▶️ Quiz (${mc.length})</button>
      <button class="btn ghost" onclick="startTopic('${id}', 'exam')">⏱️ Timed test</button>
    </div>
    <h2>✅ Quiz answers</h2>
    <div class="list">${mc.map((q, i) => qaHTML(q, i)).join('')}</div>`;
}
function startTopic(id, mode) {
  const t = TOPICS.find(t => t.id === id);
  startQuiz(shuffle(mcqOf(id)), t.title, mode, id);
}
function viewNotes(id) {
  const t = TOPICS.find(t => t.id === id); if (!t) return go('/');
  setTitle(t.title + ' notes');
  const exam = BY_TOPIC[id].filter(q => q.type === 'sa');
  $app.innerHTML = `
    <p class="sub" style="margin-top:4px">Year ${t.year} · ${esc(t.strand)}</p>
    <h1>${t.icon} ${esc(t.title)}</h1>
    <article class="card notes">${notesHTML(NOTES[id] || 'Notes coming soon.')}</article>
    ${exam.length ? `<h2>✍️ Exam-style questions</h2><p class="sub">Try to answer each one yourself, then tap it to see the model answer.</p>
    <div class="list">${exam.map((q, i) => qaHTML(q, i)).join('')}</div>` : ''}`;
  setNav(`<button class="btn gold" onclick="startTopic('${id}', 'practice')">▶️ Take the quiz</button>`);
}
function qaHTML(q, i) {
  return `<details class="qa"><summary>${i != null ? (i + 1) + '. ' : ''}${esc(q.q)}${q.type === 'tf' ? ' (True or false?)' : ''}${q.type === 'sa' && q.marks ? ' <span class="muted">[' + q.marks + ']</span>' : ''}</summary>
    ${q.type === 'mc' ? '<div class="muted" style="margin-top:8px">' + q.opts.map((o, j) => LETTERS[j] + '. ' + esc(o)).join('<br>') + '</div>' : ''}
    <div class="sol"><b class="h">✔ ${q.type === 'sa' ? 'Model answer' : 'Answer'}</b>${esc(answerText(q))}</div>
    <div class="from">${esc(q.src)}</div></details>`;
}

// ───────── Past papers (worked solutions) ─────────
function viewPapers() {
  setTitle('Past Papers');
  $app.innerHTML = `<h1>KCSE past papers</h1><p class="sub">Every question from the real exams with its answer. Try each question first, then check the answer.</p>
    <div class="list">${PAPERS.map(p => `<button class="row" onclick="go('/paper/${p.id}')"><span class="ic">📝</span>
      <span class="mid"><b>${esc(p.title)}</b><small>${esc(p.subtitle)} · ${p.sections.reduce((a, s) => a + s.norm.length, 0)} questions</small></span><span class="pill ok">Solutions</span></button>`).join('')}</div>`;
}
function paperQ(q, n) {
  let body = '';
  if (q.type === 'mc') body = '<div class="opts">' + q.opts.map((o, j) => `<div class="opt${j === q.ans ? ' key' : ''}"><span class="l">${LETTERS[j]}</span><span>${esc(o)}</span></div>`).join('') + '</div>';
  if (q.type === 'tf') body = '<p class="muted" style="margin:0">Write T (true) or F (false).</p>';
  const ans = q.type === 'mc' ? LETTERS[q.ans] + '. ' + q.opts[q.ans] + (q.expl ? '\n' + q.expl : '') : answerText(q);
  return `<div class="card pq">
    <div class="qhead" style="margin:0 0 6px"><b style="color:var(--navy-2)">Question ${n}</b><span class="tag">${typeLabel(q)}</span></div>
    <div class="qtext" style="font-size:16px;margin-bottom:10px">${esc(q.q)}</div>
    ${body}
    <button class="btn ghost reveal" onclick="this.parentElement.classList.toggle('open');this.textContent=this.parentElement.classList.contains('open')?'🙈 Hide answer':'👁️ Show answer'">👁️ Show answer</button>
    <div class="sol ans"><b class="h">✔ ${q.type === 'sa' ? 'Model answer' : 'Answer'}</b>${esc(ans)}</div>
  </div>`;
}
function viewPaper(id) {
  const p = PAPERS.find(p => p.id === id); if (!p) return go('/papers');
  setTitle(p.title);
  let html = `<h1>${esc(p.title)}</h1><p class="sub">${esc(p.subtitle)}</p>
    <div class="chips">${p.sections.map((s, si) => `<button class="chip" onclick="document.getElementById('sec${si}').scrollIntoView({behavior:'smooth'})">Section ${si + 1}</button>`).join('')}</div>`;
  p.sections.forEach((s, si) => {
    html += `<h2 id="sec${si}" style="scroll-margin-top:70px">${esc(s.title)}</h2><div class="list">${s.norm.map((q, i) => paperQ(q, i + 1)).join('')}</div>`;
  });
  $app.innerHTML = html;
  setNav(`<button class="btn gold" id="allBtn" onclick="toggleAllAnswers()">👁️ Show all answers</button>`);
}
function toggleAllAnswers() {
  const btn = document.getElementById('allBtn'), show = !btn.dataset.on;
  btn.dataset.on = show ? '1' : '';
  document.querySelectorAll('.pq').forEach(c => {
    c.classList.toggle('open', show);
    c.querySelector('.reveal').textContent = show ? '🙈 Hide answer' : '👁️ Show answer';
  });
  btn.textContent = show ? '🙈 Hide all answers' : '👁️ Show all answers';
}

// ───────── Quiz engine (multiple choice) ─────────
// mode "practice": feedback after each question. mode "exam": answers hidden until the end, with a timer.
function startQuiz(qs, title, mode, bestKey) {
  qs = qs.filter(q => q.type === 'mc');
  if (!qs.length) { toast('No questions here yet'); return; }
  quiz = {
    title, mode, bestKey, i: 0, done: false, start: Date.now(),
    items: qs.map(q => ({ q, order: q.shuffle ? shuffle(q.opts.map((_, j) => j)) : q.opts.map((_, j) => j), pick: null, score: null })),
  };
  stack[stack.length - 1] === '/quiz' ? route() : go('/quiz');
}
function startQuick() { startQuiz(shuffle(MCQ).slice(0, 10), 'Quick Quiz', 'practice'); }
function startExam() { startQuiz(shuffle(MCQ).slice(0, 40), 'Mock Exam', 'exam'); }
function startMistakes() {
  const qs = Object.keys(save.wrong).map(k => BY_KEY[k]).filter(q => q && q.type === 'mc');
  if (!qs.length) { toast('No mistakes saved – well done! 🎉'); return; }
  startQuiz(shuffle(qs), 'My Mistakes', 'practice');
}

function viewQuestion() {
  const it = quiz.items[quiz.i], q = it.q, n = quiz.items.length;
  const locked = quiz.mode === 'practice' && it.score !== null;
  setTitle(quiz.title);
  let body = '<div class="opts">' + it.order.map((j, pos) => {
    let cls = it.pick === j ? ' sel' : '';
    if (locked) cls = j === q.ans ? ' right' : it.pick === j ? ' wrong' : '';
    return `<button class="opt${cls}" ${locked ? 'disabled' : ''} onclick="pick(${j})"><span class="l">${LETTERS[pos]}</span><span>${esc(q.opts[j])}</span></button>`;
  }).join('') + '</div>';
  if (locked) {
    const good = it.score === 1;
    body += `<div class="sol ${good ? '' : 'bad'}"><b class="h">${good ? '🎉 Correct!' : '❌ Not quite'}</b>${esc(answerText(q, it.order))}</div>`;
  }
  const answeredCount = quiz.items.filter(x => x.pick !== null).length;
  $app.innerHTML = `
    <div class="qhead"><span>Question ${quiz.i + 1} of ${n}</span>
      ${quiz.mode === 'exam' ? '<span class="timer" id="timer"></span>' : `<span>Score: ${scoreOf()}</span>`}</div>
    <div class="progress"><i style="width:${pct(quiz.i + (locked ? 1 : 0), n)}%"></i></div>
    <div class="card">
      <span class="tag">Multiple choice</span>
      <div class="qtext">${esc(q.q)}</div>
      ${body}
      <div class="from muted" style="font-size:12px;margin-top:12px">${esc(q.src)}</div>
    </div>
    ${quiz.mode === 'exam' ? `<p class="center muted">${answeredCount} of ${n} answered · <a href="#" onclick="finish();return false" style="color:var(--navy-2)">Finish &amp; mark now</a></p>` : ''}`;
  const last = quiz.i === n - 1;
  let nav = `<button class="btn ghost" ${quiz.i === 0 ? 'disabled' : ''} onclick="move(-1)">◀ Back</button>`;
  if (quiz.mode === 'practice' && !locked) {
    nav += `<button class="btn ghost" onclick="skip()">Skip</button><button class="btn" ${it.pick === null ? 'disabled' : ''} onclick="check()">Check ✔</button>`;
  } else {
    nav += `<button class="btn ${last ? 'gold' : ''}" onclick="${last ? 'finish()' : 'move(1)'}">${last ? 'Finish 🏁' : 'Next ▶'}</button>`;
  }
  setNav(nav);
  if (quiz.mode === 'exam') { tick(); timerId = setInterval(tick, 1000); }
}
function tick() {
  const el = document.getElementById('timer'); if (!el || !quiz) return;
  const s = Math.floor((Date.now() - quiz.start) / 1000);
  el.textContent = '⏱ ' + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}
function scoreOf() { return quiz.items.reduce((a, x) => a + (x.score || 0), 0); }
function pick(v) {
  const it = quiz.items[quiz.i];
  it.pick = v;
  if (quiz.mode === 'exam') it.score = v === it.q.ans ? 1 : 0;
  viewQuestion();
}
function record(q, ok) {
  save.seen[q.key] = 1; save.answered++;
  if (ok) { save.correct++; delete save.wrong[q.key]; } else save.wrong[q.key] = 1;
  persist();
}
function check() {
  const it = quiz.items[quiz.i];
  it.score = it.pick === it.q.ans ? 1 : 0;
  record(it.q, it.score === 1);
  viewQuestion();
}
function skip() { quiz.i === quiz.items.length - 1 ? finish() : move(1); }
function move(d) {
  const ni = quiz.i + d;
  if (ni < 0 || ni >= quiz.items.length) return;
  quiz.i = ni; clearInterval(timerId); viewQuestion(); window.scrollTo(0, 0);
}
function finish(sure) {
  if (quiz.mode === 'exam' && !sure) {
    const blank = quiz.items.filter(x => x.pick === null).length;
    if (blank) return ask(blank + ' question(s) are not answered yet and will count as wrong. Finish anyway?', 'Finish', () => finish(true));
  }
  clearInterval(timerId);
  if (quiz.mode === 'exam') quiz.items.forEach(x => { if (x.pick !== null) record(x.q, x.score === 1); });
  quiz.done = true; quiz.time = Math.floor((Date.now() - quiz.start) / 1000);
  const p = pct(scoreOf(), quiz.items.length);
  if (quiz.bestKey && (save.best[quiz.bestKey] == null || p > save.best[quiz.bestKey])) { save.best[quiz.bestKey] = p; quiz.newBest = true; }
  persist();
  viewResults();
}
function viewResults() {
  const n = quiz.items.length, s = scoreOf(), p = pct(s, n);
  const msg = p >= 80 ? 'Excellent work! 🌟' : p >= 60 ? 'Good job – keep going! 👍' : p >= 40 ? 'Getting there – read the notes and retry 💪' : 'Keep practising – read the notes first 📖';
  setTitle('Results');
  $app.innerHTML = `
    <div class="card center">
      <div style="font-size:44px">${p >= 80 ? '🏆' : p >= 50 ? '🎯' : '📚'}</div>
      <div class="big">${p}%</div>
      <p><b>${s}</b> out of <b>${n}</b> · ${esc(quiz.title)}</p>
      <p class="muted">${msg}${quiz.newBest ? '<br>⭐ New best score!' : ''}<br>Time: ${Math.floor(quiz.time / 60)} min ${quiz.time % 60} s</p>
    </div>
    <div class="btns">
      <button class="btn" onclick="retry(false)">🔄 Try again</button>
      <button class="btn bad" ${quiz.items.some(x => x.score !== 1) ? '' : 'disabled'} onclick="retry(true)">🔁 Redo wrong ones</button>
    </div>
    <h2>Review your answers</h2>
    <div class="list">${quiz.items.map((x, i) => {
      const q = x.q, mark = x.score === 1 ? '✅' : x.pick === null ? '⏭️' : '❌';
      const yours = x.pick !== null ? 'Your answer: ' + LETTERS[x.order.indexOf(x.pick)] + '. ' + q.opts[x.pick] : 'Not answered';
      return `<details class="qa" ${x.score === 1 ? '' : 'open'}><summary>${mark} ${i + 1}. ${esc(q.q)}</summary>
        <div class="muted" style="margin-top:8px">${esc(yours)}</div>
        <div class="sol"><b class="h">✔ Answer</b>${esc(answerText(q, x.order))}</div></details>`;
    }).join('')}</div>`;
  setNav(`<button class="btn ghost" onclick="go('/')">🏠 Home</button><button class="btn gold" onclick="startQuick()">⚡ New quick quiz</button>`);
}
function retry(onlyWrong) {
  const qs = quiz.items.filter(x => !onlyWrong || x.score !== 1).map(x => x.q);
  startQuiz(shuffle(qs), quiz.title.replace(/ – retry$/, '') + (onlyWrong ? ' – retry' : ''), quiz.mode, onlyWrong ? null : quiz.bestKey);
}

// ───────── Search ─────────
let searchText = '';
function viewSearch() {
  setTitle('Search');
  $app.innerHTML = `<h1>🔍 Search</h1><p class="sub">Search the notes, quiz questions and past-paper answers.</p>
    <input class="search" id="find" type="search" placeholder="e.g. BMI, condom, diaphragm, PRICE…" value="${esc(searchText)}">
    <p class="muted" id="find-n"></p><div class="list" id="find-list"></div>`;
  const inp = document.getElementById('find');
  inp.addEventListener('input', () => { searchText = inp.value; renderSearch(); });
  renderSearch();
}
function renderSearch() {
  const s = searchText.trim().toLowerCase();
  const out = document.getElementById('find-list'), count = document.getElementById('find-n');
  if (s.length < 2) { count.textContent = 'Type at least 2 letters.'; out.innerHTML = ''; return; }
  const noteHits = TOPICS.filter(t => (t.title + ' ' + (NOTES[t.id] || '')).toLowerCase().includes(s));
  const qHits = ALL.filter(q => q.type !== 'tf' && (q.q + ' ' + answerText(q) + ' ' + (q.opts || []).join(' ')).toLowerCase().includes(s));
  count.textContent = noteHits.length + ' topic note' + (noteHits.length === 1 ? '' : 's') + ' · ' + qHits.length + ' question' + (qHits.length === 1 ? '' : 's');
  out.innerHTML = noteHits.map(t => `<button class="row" onclick="go('/notes/${t.id}')"><span class="ic">📖</span>
      <span class="mid"><b>${esc(t.title)} notes</b><small>Year ${t.year}</small></span></button>`).join('')
    + qHits.slice(0, 50).map(q => qaHTML(q)).join('');
}

// ───────── Progress ─────────
function viewProgress() {
  setTitle('My Progress');
  const row = t => `<div class="row" style="cursor:default"><span class="ic">${t.icon}</span>
    <span class="mid"><b>${esc(t.title)}</b><small>${mcqOf(t.id).length} quiz questions</small><span class="bar"><i style="width:${save.best[t.id] || 0}%"></i></span></span>${pillFor(save.best[t.id])}</div>`;
  $app.innerHTML = `<h1>📊 My progress</h1><p class="sub">Best quiz scores are saved on this phone.</p>
    <div class="stats">
      <div class="stat"><b>${Object.keys(save.seen).length}/${MCQ.length}</b><span>Questions tried</span></div>
      <div class="stat"><b>${save.answered}</b><span>Answers given</span></div>
      <div class="stat"><b>${pct(save.correct, save.answered)}%</b><span>Accuracy</span></div>
    </div>
    ${[10, 11].map(y => `<div class="strand">Year ${y}</div><div class="list">${TOPICS.filter(t => t.year === y).map(row).join('')}</div>`).join('')}
    <div class="btns one" style="margin-top:20px"><button class="btn ghost" onclick="resetProgress()">🗑️ Reset my progress</button></div>`;
}
function resetProgress() {
  ask('Delete all saved scores and mistakes on this phone?', 'Delete', () => {
    save = { best: {}, seen: {}, wrong: {}, answered: 0, correct: 0, theme: save.theme }; persist(); viewProgress(); toast('Progress reset');
  });
}
