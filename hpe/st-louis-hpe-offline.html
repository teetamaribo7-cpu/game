<style>
:root {
  --bg: #eef2fb; --card: #ffffff; --ink: #14203d; --muted: #5b6785; --line: #d9e0ef;
  --navy: #16307a; --navy-2: #2447a8; --gold: #f2c230; --gold-ink: #3b2c00;
  --ok: #178a4c; --ok-bg: #e2f6ea; --bad: #c0392b; --bad-bg: #fbe6e3; --warn: #b7791f; --warn-bg: #fdf1dc;
  --shadow: 0 2px 10px rgba(20, 32, 61, .08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1426; --card: #172241; --ink: #e8edf9; --muted: #9aa7c7; --line: #2a3760;
    --navy: #3b5fd0; --navy-2: #5a7ce6; --ok: #4fd08a; --ok-bg: #123524; --bad: #ff7b6b; --bad-bg: #3d1a17;
    --warn: #f0b44c; --warn-bg: #3a2c12; --shadow: 0 2px 10px rgba(0,0,0,.35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1426; --card: #172241; --ink: #e8edf9; --muted: #9aa7c7; --line: #2a3760;
  --navy: #3b5fd0; --navy-2: #5a7ce6; --ok: #4fd08a; --ok-bg: #123524; --bad: #ff7b6b; --bad-bg: #3d1a17;
  --warn: #f0b44c; --warn-bg: #3a2c12; --shadow: 0 2px 10px rgba(0,0,0,.35); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-tap-highlight-color: transparent;
}
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: #16307a; color: #fff;
  display: flex; align-items: center; gap: 10px; padding: 10px 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,.2);
}
header.top img { width: 34px; height: 40px; object-fit: contain; }
header.top .t { flex: 1; min-width: 0; }
header.top .t b { display: block; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header.top .t small { color: #f2c230; font-size: 12px; }
.iconbtn { background: rgba(255,255,255,.12); border: 0; color: #fff; width: 40px; height: 40px; border-radius: 10px; font-size: 20px; cursor: pointer; }
main { max-width: 760px; margin: 0 auto; padding: 16px 16px 90px; }
h1 { font-size: 22px; margin: 8px 0 4px; }
h2 { font-size: 18px; margin: 20px 0 8px; }
p.sub { color: var(--muted); margin: 0 0 14px; }
.hero { text-align: center; padding: 8px 0 4px; }
.hero img { width: 96px; height: 115px; object-fit: contain; }
.hero h1 { margin-top: 6px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
.stat { background: var(--card); border-radius: 12px; padding: 10px; text-align: center; box-shadow: var(--shadow); }
.stat b { display: block; font-size: 22px; color: var(--navy-2); }
.stat span { font-size: 12px; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.tile {
  background: var(--card); border: 0; border-radius: 14px; padding: 16px 12px; text-align: left; cursor: pointer;
  color: var(--ink); box-shadow: var(--shadow); font: inherit; display: flex; flex-direction: column; gap: 4px; min-height: 96px;
  border-bottom: 4px solid var(--navy-2); transition: transform .08s;
}
.tile:active { transform: scale(.97); }
.tile .ic { font-size: 26px; }
.tile b { font-size: 15px; }
.tile small { color: var(--muted); font-size: 12px; }
.tile.gold { border-bottom-color: var(--gold); }
.tile.green { border-bottom-color: var(--ok); }
.tile.red { border-bottom-color: var(--bad); }
.list { display: flex; flex-direction: column; gap: 10px; }
.row {
  background: var(--card); border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow);
  display: flex; align-items: center; gap: 12px; cursor: pointer; border: 0; width: 100%; text-align: left; font: inherit; color: var(--ink);
}
.row .ic { font-size: 26px; width: 36px; text-align: center; flex: none; }
.row .mid { flex: 1; min-width: 0; }
.row .mid b { display: block; }
.row .mid small { color: var(--muted); font-size: 12px; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; background: var(--ok); border-radius: 3px; }
.pill { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 99px; background: var(--line); color: var(--muted); flex: none; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.strand { font-size: 12px; font-weight: 700; color: var(--navy-2); text-transform: uppercase; letter-spacing: .04em; margin: 18px 0 8px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 12px; padding: 13px 16px;
  font: 600 15px system-ui, sans-serif; cursor: pointer; background: var(--navy-2); color: #fff; min-height: 48px;
}
.btn.gold { background: var(--gold); color: var(--gold-ink); }
.btn.ghost { background: var(--card); color: var(--ink); box-shadow: inset 0 0 0 2px var(--line); }
.btn.ok { background: var(--ok); color: #fff; }
.btn.bad { background: var(--bad); color: #fff; }
.btn.warn { background: var(--warn); color: #fff; }
.btn:disabled { opacity: .45; cursor: default; }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
.btns.three { grid-template-columns: 1fr 1fr 1fr; }
.btns.one { grid-template-columns: 1fr; }
.card { background: var(--card); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); }
.qhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.progress { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin-bottom: 14px; }
.progress i { display: block; height: 100%; background: var(--gold); transition: width .25s; }
.qtext { font-size: 18px; font-weight: 600; margin: 4px 0 14px; white-space: pre-line; }
.tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--line); color: var(--muted); text-transform: uppercase; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt {
  display: flex; gap: 10px; align-items: flex-start; text-align: left; font: inherit; color: var(--ink); background: var(--bg);
  border: 2px solid var(--line); border-radius: 12px; padding: 12px; cursor: pointer; min-height: 48px;
}
.opt .l { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--card); border: 2px solid var(--line); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.opt.sel { border-color: var(--navy-2); }
.opt.sel .l { background: var(--navy-2); color: #fff; border-color: var(--navy-2); }
.opt.right { border-color: var(--ok); background: var(--ok-bg); }
.opt.right .l { background: var(--ok); border-color: var(--ok); color: #fff; }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt.wrong .l { background: var(--bad); border-color: var(--bad); color: #fff; }
.opt:disabled { cursor: default; }
textarea {
  width: 100%; min-height: 90px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); color: var(--ink);
  font: inherit; padding: 10px; resize: vertical;
}
.sol { margin-top: 14px; border-radius: 12px; padding: 12px 14px; background: var(--ok-bg); border-left: 5px solid var(--ok); white-space: pre-line; }
.sol.bad { background: var(--bad-bg); border-left-color: var(--bad); }
.sol.info { background: var(--warn-bg); border-left-color: var(--warn); }
.sol b.h { display: block; margin-bottom: 4px; }
.navbar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); box-shadow: 0 -2px 10px rgba(0,0,0,.12); padding: 10px 16px; padding-bottom: max(10px, env(safe-area-inset-bottom)); z-index: 4; }
.navbar .in { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; }
.navbar .btn { flex: 1; }
.search { width: 100%; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); color: var(--ink); font: inherit; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
.chip { border: 2px solid var(--line); background: var(--card); color: var(--ink); border-radius: 99px; padding: 6px 14px; font: 600 14px system-ui, sans-serif; cursor: pointer; }
.chip.on { background: var(--navy-2); border-color: var(--navy-2); color: #fff; }
details.qa { background: var(--card); border-radius: 12px; box-shadow: var(--shadow); padding: 12px 14px; }
details.qa summary { cursor: pointer; font-weight: 600; list-style: none; white-space: pre-line; }
details.qa summary::-webkit-details-marker { display: none; }
details.qa summary::before { content: "▸ "; color: var(--navy-2); }
details.qa[open] summary::before { content: "▾ "; }
details.qa .from { font-size: 12px; color: var(--muted); margin-top: 4px; }
.big { font-size: 48px; font-weight: 800; color: var(--navy-2); text-align: center; margin: 6px 0 0; }
.center { text-align: center; }
.muted { color: var(--muted); }
.timer { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--navy-2); }
.notes h3 { font-size: 16px; color: var(--navy-2); margin: 18px 0 6px; }
.notes h3:first-child { margin-top: 0; }
.notes ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 5px; }
.notes p { margin: 6px 0; }
.notes b { color: var(--ink); }
.pq .opt { cursor: default; }
.pq .reveal { width: 100%; margin-top: 12px; min-height: 42px; }
.pq .ans { display: none; }
.pq.open .ans { display: block; }
.pq.open .opt.key { border-color: var(--ok); background: var(--ok-bg); }
.pq.open .opt.key .l { background: var(--ok); border-color: var(--ok); color: #fff; }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: grid; place-items: center; padding: 16px; z-index: 20; }
.modal .card { max-width: 420px; width: 100%; }
.toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: #14203d; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 9; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.on { opacity: 1; }
@media (min-width: 620px) { .grid { grid-template-columns: repeat(3, 1fr); } }
</style>

<script>
// Question bank for KCSE Health and Physical Education, Years 10 and 11.
// Topics follow the Kiribati Year 10 and 11 HPE syllabus (2022). The 2024 and 2025 KCSE papers are included in full.
//
// Question formats:
//   ['m', question, [correct, wrong, wrong, wrong], explanation]  multiple choice; options are shuffled on screen
//   ['M', question, [A, B, C, D], answerIndex, explanation]       multiple choice with fixed order (past papers)
//   ['t', statement, true|false, explanation]                     true or false
//   ['s', question, modelAnswer, marks]                           written answer; the student reveals the solution and marks themself

const TOPICS = [
  // ───────────────────────── YEAR 10 ─────────────────────────
  { id: 'y10-repro', year: 10, strand: 'Strand 1 · Human Growth & Development', title: 'Human reproduction', icon: '🧬', qs: [
    ['m', 'Which organ produces the female egg (ovum)?', ['Ovary', 'Uterus', 'Cervix', 'Vagina'], 'The two ovaries produce eggs and the hormones oestrogen and progesterone.'],
    ['m', 'Which organ produces sperm?', ['Testes', 'Prostate gland', 'Urethra', 'Bladder'], 'The testes (testicles) produce sperm and the hormone testosterone.'],
    ['m', 'Where does a fertilised egg implant and grow into a baby?', ['Uterus (womb)', 'Ovary', 'Fallopian tube', 'Cervix'], 'The fertilised egg travels down the fallopian tube and implants in the lining of the uterus.'],
    ['m', 'Where does fertilisation usually happen?', ['Fallopian tube', 'Uterus', 'Vagina', 'Ovary'], 'Sperm usually meets the egg in the fallopian tube (oviduct).'],
    ['m', 'Which tube carries sperm from the testes towards the urethra?', ['Vas deferens (sperm duct)', 'Fallopian tube', 'Ureter', 'Cervix'], 'The vas deferens carries sperm from the epididymis to the urethra.'],
    ['m', 'Which is the main male sex hormone?', ['Testosterone', 'Oestrogen', 'Progesterone', 'Insulin'], 'Testosterone causes male puberty changes: deeper voice, facial hair, muscle growth and sperm production.'],
    ['m', 'Which hormone thickens the lining of the uterus and maintains pregnancy?', ['Progesterone', 'Testosterone', 'Adrenaline', 'Growth hormone'], 'Progesterone keeps the uterus lining thick so a fertilised egg can implant and grow.'],
    ['m', 'What is the main role of Luteinizing Hormone (LH)?', ['It triggers ovulation and stimulates the release of oestrogen and testosterone', 'It digests food', 'It controls breathing', 'It makes red blood cells'], 'LH comes from the pituitary gland. In females it triggers ovulation; in males it stimulates testosterone production.'],
    ['m', 'Which gland in the brain controls the release of FSH and LH?', ['Pituitary gland', 'Thyroid gland', 'Adrenal gland', 'Pancreas'], 'The pituitary gland is called the "master gland" because it controls other glands, including the ovaries and testes.'],
    ['t', 'Oestrogen causes female puberty changes such as breast growth and widening of the hips.', true, 'Oestrogen is the main female sex hormone and controls female secondary sex characteristics.'],
    ['t', 'Follicle Stimulating Hormone (FSH) is only found in males.', false, 'FSH is found in both sexes. In females it helps eggs mature; in males it helps sperm production.'],
    ['t', 'Menstruation happens when the lining of the uterus breaks down because the egg was not fertilised.', true, 'If no fertilisation happens, progesterone levels fall and the uterus lining is shed as the period.'],
    ['s', 'Name TWO female reproductive hormones.', '• Oestrogen\n• Progesterone\n(Also accepted: FSH, LH)', 2],
    ['s', 'Name TWO male reproductive hormones.', '• Testosterone\n• FSH (Follicle Stimulating Hormone)\n• LH (Luteinizing Hormone)\nAny two.', 2],
    ['s', 'Describe the role hormones play in growth and development during puberty.', 'Hormones are chemical messengers carried in the blood. At puberty the pituitary gland releases FSH and LH, which tell the ovaries and testes to make sex hormones.\n• Oestrogen and progesterone in girls: breasts grow, hips widen, periods start.\n• Testosterone in boys: voice deepens, facial and body hair grow, muscles develop, sperm production starts.\n• Growth hormone causes the growth spurt in height and weight.', 3],
    ['m', 'Where is sperm stored while it matures?', ['Epididymis', 'Bladder', 'Uterus', 'Ovary'], 'The epididymis is a coiled tube on the back of each testis.'],
    ['m', 'About how often is an egg released during a typical menstrual cycle?', ['Once about every 28 days', 'Every day', 'Once a year', 'Every 3 months'], 'Ovulation usually happens about day 14 of a 28-day cycle.'],
  ]},
  { id: 'y10-sexgender', year: 10, strand: 'Strand 1 · Human Growth & Development', title: 'Sex, gender & reproduction', icon: '⚧', qs: [
    ['m', 'What does the term "sex" refer to?', ['Biological characteristics such as genes, hormones and body parts that make someone male, female or intersex', 'The roles society expects men and women to play', 'A person\'s sense of who they are', 'A person\'s attraction to others'], 'Sex is biological. Gender is social and cultural.'],
    ['m', 'What does the term "gender" refer to?', ['Your sense of who you are as a guy, girl or something else, and the roles society links to it', 'Your chromosomes', 'The joining of sperm and egg', 'Your blood group'], 'Gender is shaped by culture, society and personal identity.'],
    ['m', 'What is "reproduction"?', ['When a male gamete fuses with a female gamete to form a fertilised egg that grows into new life', 'Your sense of identity', 'Physical attraction to others', 'The roles of men and women in society'], 'Reproduction is the biological process of producing offspring.'],
    ['m', 'Which is an example of a social (not biological) aspect of gender?', ['Expecting only women to cook and care for children', 'Having XY chromosomes', 'Producing sperm', 'Having ovaries'], 'Roles such as who cooks or fishes are set by culture and can change. Biology does not decide them.'],
    ['m', 'Male gametes are called:', ['Sperm', 'Eggs', 'Zygotes', 'Embryos'], 'Male gamete = sperm, female gamete = ovum (egg).'],
    ['t', 'Gender roles can differ between cultures and can change over time.', true, 'Gender roles are learned from family, culture and society, so they are not fixed.'],
    ['t', 'Sex and gender mean exactly the same thing.', false, 'Sex is biological; gender is social and cultural identity and roles.'],
    ['t', 'A fertilised egg is called a zygote.', true, 'Sperm + egg = zygote, which divides to become an embryo.'],
    ['s', 'Describe the biological and social aspects of sex and gender.', 'Biological aspects (sex): chromosomes (XX or XY), hormones (oestrogen or testosterone), reproductive organs (ovaries or testes), body features.\nSocial aspects (gender): the roles, behaviours and expectations society gives to males and females. In Kiribati culture, for example, men traditionally fish and cut toddy while women care for the home. These roles are learned and can change.', 3],
    ['s', 'Identify a cultural view about sex and gender in Kiribati.', 'Example: traditionally men are seen as heads of the family and decision makers in the maneaba, while women are expected to care for the home and children. Talking openly about sex is often seen as taboo. (Any reasonable cultural view explained.)', 2],
    ['m', 'Which is a BIOLOGICAL aspect of sex?', ['Chromosomes (XX or XY)', 'Who cooks the family meal', 'Who speaks in the maneaba', 'Clothing style'], 'Chromosomes, hormones and reproductive organs are biological.'],
    ['m', 'Female gametes are called:', ['Eggs (ova)', 'Sperm', 'Zygotes', 'Foetuses'], 'The ovum is the female gamete.'],
    ['m', 'A person\'s sexual interest in and attraction to others is called:', ['Sexual orientation', 'Reproduction', 'Biological sex', 'Fertilisation'], 'This matched option A in the 2024 paper and was not one of the three answers.'],
    ['m', 'Why can gender roles change over time?', ['Because they are learned from culture and society', 'Because chromosomes change', 'Because hormones stop working', 'They can never change'], 'Gender roles are social, so education and culture change them.'],
  ]},
  { id: 'y10-bodyimage', year: 10, strand: 'Strand 1 · Human Growth & Development', title: 'Body image & heredity', icon: '🪞', qs: [
    ['m', 'Which of the following factors can influence your body image?', ['Heredity', 'Stability', 'Mobility', 'Circulation'], 'Heredity (genes from parents) affects height, skin colour and body shape, which all shape how you see your body.'],
    ['m', 'Why is it important to have a healthy lifestyle?', ['To maintain physical and mental health', 'To make everyone praise you', 'To promote a harmful appearance', 'To support a negative body image'], 'A healthy lifestyle protects your body and mind.'],
    ['m', 'What is "body image"?', ['How a person sees, thinks and feels about their own body', 'Your exact weight', 'A photo of your body', 'Your blood type'], 'Body image can be positive or negative and affects self-esteem and behaviour.'],
    ['m', 'Which is a HEALTHY habit?', ['Eating local fruit and vegetables and exercising daily', 'Skipping meals to lose weight fast', 'Drinking sugary drinks every day', 'Sleeping 4 hours a night'], 'Healthy habits include a balanced diet, regular exercise, enough sleep and good hygiene.'],
    ['m', 'Which physical feature is mainly controlled by heredity?', ['Eye colour', 'A suntan', 'A scar', 'Hairstyle'], 'Eye colour is passed on through genes. The others are caused by the environment or by choice.'],
    ['m', 'Which of these is an ENVIRONMENTAL factor that affects physical appearance?', ['Diet and exercise', 'Blood group', 'Natural eye colour', 'Chromosomes'], 'Environmental factors (diet, exercise, sun, illness) change appearance; hereditary factors come from genes.'],
    ['t', 'Social media and advertisements can affect how young people feel about their bodies.', true, 'Edited images often show unrealistic bodies, which can lead to a negative body image.'],
    ['t', 'A negative body image can lead to unhealthy behaviour such as extreme dieting.', true, 'Poor body image is linked to eating disorders, low self-esteem and depression.'],
    ['s', 'Give TWO physical features that are influenced by heredity.', 'Any two of: height, eye colour, skin colour, hair colour/texture, body shape/build, facial features, blood group.', 2],
    ['s', 'List THREE healthy habits a person can have.', 'Any three: eat a balanced diet, exercise regularly, sleep 8–10 hours, drink clean water, keep good hygiene, avoid smoking/alcohol/drugs, manage stress.', 3],
    ['s', 'Describe how heredity influences physical appearance.', 'Heredity is the passing of genes from parents to children. Genes carry instructions for features such as height, eye colour, skin colour, hair type and body shape. That is why children often look like their parents or grandparents. Heredity sets the possible range; diet and exercise (environment) can change things such as weight and fitness.', 3],
    ['m', 'Which is a sign of a POSITIVE body image?', ['Accepting and caring for your body as it is', 'Hiding your body because of shame', 'Skipping meals to look thin', 'Constantly comparing yourself to celebrities'], 'Positive body image means being comfortable with your body.'],
    ['m', 'Heredity means:', ['Passing features from parents to children through genes', 'Changing your looks with make-up', 'Growing taller from exercise', 'Getting a suntan'], 'Genes are inherited from both parents.'],
  ]},
  { id: 'y10-body', year: 10, strand: 'Strand 4 · Sport Science', title: 'Human body & sport (bones & muscles)', icon: '🦴', qs: [
    ['m', 'What is human anatomy?', ['The study of the structure of the human body', 'The study of disease', 'The study of food', 'The study of sport rules'], 'Anatomy = structure (what parts). Physiology = function (how they work).'],
    ['m', 'Which bone is the longest in the body (the thigh bone)?', ['Femur', 'Tibia', 'Humerus', 'Fibula'], 'The femur runs from the hip to the knee.'],
    ['m', 'Which bone is in the upper arm?', ['Humerus', 'Radius', 'Ulna', 'Femur'], 'Humerus = upper arm. Radius and ulna = forearm.'],
    ['m', 'The two bones of the forearm are:', ['Radius and ulna', 'Tibia and fibula', 'Femur and patella', 'Humerus and scapula'], 'The radius is on the thumb side; the ulna is on the little-finger side.'],
    ['m', 'The two bones of the lower leg are:', ['Tibia and fibula', 'Radius and ulna', 'Femur and humerus', 'Carpals and tarsals'], 'The tibia (shin bone) is the larger one; the fibula is thinner and on the outside.'],
    ['m', 'Which is an example of a FLAT bone?', ['Sternum', 'Femur', 'Carpals', 'Vertebrae'], 'Flat bones protect organs: skull, sternum, ribs, scapula, pelvis.'],
    ['m', 'Which is an example of a SHORT bone?', ['Carpals (wrist bones)', 'Femur', 'Skull', 'Ribs'], 'Short bones (carpals, tarsals) give stability and some movement.'],
    ['m', 'Which is an IRREGULAR bone?', ['Vertebrae', 'Humerus', 'Sternum', 'Carpals'], 'Irregular bones have complex shapes, like the vertebrae of the spine.'],
    ['m', 'What does the skeleton NOT do?', ['Digest food', 'Protect organs', 'Support the body', 'Make blood cells'], 'Skeleton functions: support, protection, movement, blood cell production (bone marrow), mineral storage.'],
    ['m', 'Which type of muscle is found in the walls of the heart?', ['Cardiac muscle', 'Skeletal muscle', 'Smooth muscle', 'Voluntary muscle'], 'Cardiac muscle is involuntary and never gets tired.'],
    ['t', 'Cardiac muscle is classified as a voluntary muscle.', false, 'Cardiac muscle is INVOLUNTARY – you cannot control your heartbeat by thinking.'],
    ['t', 'Smooth muscle is classified as involuntary muscle.', true, 'Smooth muscle (stomach, intestines, blood vessels) works without conscious control.'],
    ['t', 'Skeletal muscle is classified as involuntary muscle.', false, 'Skeletal muscle is VOLUNTARY – you choose to move your arms and legs.'],
    ['t', 'Tendons join muscle to bone, and ligaments join bone to bone.', true, 'Remember: Tendon = To bone (muscle→bone); Ligament = bone to bone.'],
    ['s', 'Give TWO examples of flat bones.', 'Any two: skull (cranium), sternum, ribs, scapula (shoulder blade), pelvis.', 2],
    ['s', 'Give TWO examples of gross movement and TWO examples of fine movement.', 'Gross movements use large muscle groups: running, jumping, swimming, kicking a ball, throwing.\nFine movements use small muscles for precise control: writing, threading a needle, typing, playing a guitar, throwing a dart, weaving a mat.', 4],
    ['s', 'Name the three types of muscle and state where each is found.', '• Skeletal (voluntary) – attached to bones, e.g. biceps, quadriceps.\n• Cardiac (involuntary) – walls of the heart.\n• Smooth (involuntary) – walls of the stomach, intestines, blood vessels, bladder.', 3],
    ['s', 'Describe one adaptation of the skeletal and muscular systems to regular training.', 'Skeletal: bones become denser and stronger; ligaments get stronger.\nMuscular: muscles get bigger (hypertrophy) and stronger, and gain more endurance because they get more capillaries and mitochondria.', 2],
  ]},
  { id: 'y10-fitness', year: 10, strand: 'Strand 4 · Sport Science', title: 'Components of fitness', icon: '🏃', qs: [
    ['m', 'The body\'s ability to change direction at speed is called:', ['Agility', 'Speed', 'Muscular power', 'Co-ordination'], 'Agility is key in sports like soccer, netball and basketball.'],
    ['m', 'The ability of the heart and lungs to supply oxygen to muscles over a long time is:', ['Cardiovascular (aerobic) endurance', 'Flexibility', 'Power', 'Reaction time'], 'Needed for long-distance running, swimming and soccer.'],
    ['m', 'The range of movement around a joint is called:', ['Flexibility', 'Agility', 'Balance', 'Strength'], 'Flexibility is important in gymnastics, dance and to prevent injury.'],
    ['m', 'Power is a combination of:', ['Strength and speed', 'Balance and flexibility', 'Endurance and agility', 'Reaction time and balance'], 'Power = strength × speed, e.g. long jump, shot put, spiking a volleyball.'],
    ['m', 'The time taken to respond to a signal, like a starting gun, is:', ['Reaction time', 'Speed', 'Agility', 'Co-ordination'], 'Sprinters and goalkeepers need fast reaction time.'],
    ['m', 'Which sport needs BALANCE the most?', ['Gymnastics on the beam', 'Shot put', 'Marathon', 'Tug of war'], 'Balance is keeping the body stable, either still (static) or moving (dynamic).'],
    ['m', 'Which fitness component is most important for a 100 m sprinter?', ['Speed', 'Flexibility', 'Muscular endurance', 'Balance'], 'Speed is covering a distance in the shortest time.'],
    ['t', 'Muscular endurance is the ability of muscles to work repeatedly without getting tired.', true, 'E.g. rowing a canoe, doing many push-ups.'],
    ['t', 'Co-ordination is the ability to use two or more body parts together smoothly.', true, 'E.g. hand–eye co-ordination when catching or hitting a ball.'],
    ['s', 'Apply THREE components of fitness to a sport of your choice.', 'Example – Soccer:\n• Cardiovascular endurance – to run for 90 minutes.\n• Agility – to dodge defenders.\n• Speed – to sprint to the ball.\n(Any sport with three correct components explained.)', 3],
    ['s', 'List the health-related and skill-related components of fitness.', 'Health-related: cardiovascular endurance, muscular strength, muscular endurance, flexibility, body composition.\nSkill-related: agility, balance, co-ordination, power, reaction time, speed.', 4],
    ['m', 'Which fitness component does a gymnast doing the splits show most?', ['Flexibility', 'Power', 'Reaction time', 'Cardiovascular endurance'], 'Flexibility = range of movement at a joint.'],
  ]},
  { id: 'y10-sexuality', year: 10, strand: 'Strand 2 · Sexuality & Sexual Behaviours', title: 'Sexuality & sexual behaviour', icon: '❤️', qs: [
    ['m', 'What is the meaning of the word "sexuality"?', ['A central aspect of being human that includes sex, gender, identity, pleasure, intimacy and reproduction', 'Known as a taboo in our culture', 'Only the biological differences of an individual', 'Social roles of females only'], 'Sexuality is much wider than sex: it includes feelings, values, relationships and identity.'],
    ['m', 'Which of these is an unsafe, high-risk sexual behaviour?', ['Early sexual activity, especially before age 18', 'Hugging', 'Fantasising', 'Using a condom during intercourse'], 'Early sex increases risks of STIs, unplanned pregnancy and emotional harm.'],
    ['m', 'How do people express their sexuality?', ['Body, sensuality and intimacy', 'Body, sensuality and power', 'Body, sensuality and explanation', 'Body, sensuality and reproduction'], 'People express sexuality through how they treat their body, sensuality (senses and feelings) and intimacy (closeness).'],
    ['m', 'Why is informed sexual decision-making important for your health?', ['It helps you prepare to make safe choices', 'It promotes unexpected pregnancy', 'It increases the chance of STIs and HIV', 'It lets you ignore health risks'], 'Knowing the facts helps you avoid STIs, HIV and unplanned pregnancy.'],
    ['m', 'Which is a LOW-risk behaviour?', ['Holding hands', 'Unprotected sex', 'Having many sexual partners', 'Sex under the influence of alcohol'], 'Holding hands carries no risk of STI or pregnancy.'],
    ['t', 'Everyone has the right to say "no" to any sexual activity at any time.', true, 'Consent must be freely given and can be withdrawn at any time.'],
    ['t', 'Drinking alcohol can lead to risky sexual decisions.', true, 'Alcohol lowers judgement and increases the chance of unprotected sex.'],
    ['s', 'State TWO examples of high-risk sexual behaviours.', 'Any two: unprotected sex (no condom), having multiple partners, early sexual activity, sex under the influence of alcohol/drugs, transactional sex (sex for money or gifts), sharing needles.', 2],
    ['s', 'Identify TWO characteristics of a healthy relationship.', 'Any two: respect, trust, honesty, good communication, equality, support, consent, no violence/control.', 2],
    ['s', 'Describe how informed sexual decision-making is important to health and well-being.', 'When young people know the facts about STIs, HIV, contraception and their rights, they can make safe choices such as delaying sex or using condoms. This protects them from STIs and unplanned pregnancy, lets them stay in school and reach their goals, and protects their emotional well-being by avoiding regret or pressure.', 3],
    ['m', 'Consent means:', ['Freely agreeing to something, and being able to change your mind at any time', 'Saying nothing', 'Agreeing because you are scared', 'Agreeing while very drunk'], 'Consent must be clear, free and can be withdrawn.'],
    ['m', 'Which is a RESPONSIBILITY that comes with sexuality?', ['Respecting other people\'s right to say no', 'Pressuring a partner', 'Spreading rumours', 'Ignoring STI risks'], 'Rights come with responsibilities to respect others.'],
    ['m', 'Which is a healthy way to express affection?', ['Holding hands or hugging with consent', 'Forcing a kiss', 'Sharing private photos', 'Sex under pressure'], 'Affection can be shown safely and respectfully.'],
  ]},
  { id: 'y10-pregnancy', year: 10, strand: 'Strand 2 · Sexuality & Sexual Behaviours', title: 'Pregnancy & parenting', icon: '🤰', qs: [
    ['m', 'Which is one of the FIRST signs of pregnancy?', ['A missed period', 'Hair loss', 'Losing height', 'Fever'], 'Other early signs are tender, enlarged breasts, nausea (morning sickness) and tiredness.'],
    ['m', 'How long does a normal human pregnancy last?', ['About 40 weeks (9 months)', 'About 20 weeks', 'About 12 months', 'About 6 weeks'], 'Pregnancy is divided into three trimesters of about 3 months each.'],
    ['m', 'The developing baby from week 9 until birth is called a:', ['Foetus', 'Zygote', 'Gamete', 'Embryo'], 'Zygote → embryo (up to 8 weeks) → foetus (9 weeks to birth).'],
    ['m', 'Which structure supplies the baby with oxygen and food from the mother?', ['Placenta and umbilical cord', 'Ovary', 'Fallopian tube', 'Amniotic fluid'], 'The placenta passes nutrients and oxygen from the mother\'s blood to the baby.'],
    ['m', 'Which is a responsibility of parents?', ['Providing food, shelter, love, education and protection', 'Making children leave school early to work', 'Arranging early marriage', 'Leaving children to raise themselves'], 'Parents must meet children\'s physical, emotional and educational needs.'],
    ['t', 'The first signs of pregnancy include enlarged breasts, feeling nauseous at any time of day and missing a period.', true, 'These are common early signs of pregnancy.'],
    ['t', 'The gestation period is when the foetus has all its internal organs.', false, 'The gestation period is the whole time from conception to birth (about 40 weeks).'],
    ['t', 'Children have a right to be safe, to be treated with affection, to be educated and to be protected against cruelty and abuse.', true, 'These are children\'s rights under the UN Convention on the Rights of the Child.'],
    ['t', 'Parents should support their children by allowing them to go to school and get married at an early age.', false, 'Supporting school is right, but early marriage harms children\'s health and education.'],
    ['s', 'Describe the three stages (trimesters) of foetal development.', '• 1st trimester (weeks 1–12): the zygote becomes an embryo; the heart starts beating and the main organs start to form.\n• 2nd trimester (weeks 13–26): the foetus grows fast, movement can be felt, and the sex can be seen.\n• 3rd trimester (weeks 27–40): the lungs and brain mature, the baby gains weight and turns head down ready for birth.', 3],
    ['s', 'Examine THREE responsibilities of parents.', '• Physical needs – food, clean water, shelter, clothes, health care.\n• Emotional needs – love, care, attention and a safe home free from violence.\n• Education and guidance – sending children to school, teaching values and good behaviour.\n• Protection – keeping children safe from abuse and harm.', 3],
    ['m', 'The developing baby from week 3 to week 8 is called:', ['An embryo', 'A foetus', 'A gamete', 'A placenta'], 'Zygote → embryo → foetus.'],
    ['m', 'How many trimesters are there in a pregnancy?', ['Three', 'Two', 'Four', 'Nine'], 'Each trimester is about 3 months.'],
    ['m', 'The baby\'s heart starts to beat in which trimester?', ['First trimester', 'Second trimester', 'Third trimester', 'After birth'], 'The heart begins beating at about 6 weeks.'],
    ['m', 'Morning sickness means:', ['Nausea and vomiting during early pregnancy', 'Waking up late', 'A fever after birth', 'A sign of labour'], 'It can happen at any time of the day.'],
  ]},
  { id: 'y10-contra', year: 10, strand: 'Strand 2 · Sexuality & Sexual Behaviours', title: 'Contraception', icon: '🛡️', qs: [
    ['m', 'Which contraceptive method also protects against STIs?', ['Condoms (male and female)', 'Birth control pill', 'Contraceptive injection', 'Implant'], 'Only condoms protect against both pregnancy AND STIs, including HIV.'],
    ['m', 'Whose responsibility is it to decide on using a condom or contraceptive?', ['Both partners', 'The woman only', 'The man only', 'The parents'], 'Both partners share responsibility for safe sex and preventing pregnancy.'],
    ['m', 'Which Kiribati NGO provides sexual and reproductive health services and condoms?', ['KFHA – Kiribati Family Health Association', 'Kiribati Football Federation', 'Kiribati Red Cross only for disasters', 'The Police Station'], 'KFHA (written "KHFA" in the 2024 exam) gives free advice, testing and contraceptives.'],
    ['m', 'Which is a BARRIER that stops young people getting condoms?', ['Shame and fear of being seen', 'Free condoms at clinics', 'Friendly nurses', 'Youth-friendly services'], 'Barriers include shame, cost, distance, cultural taboo and unfriendly staff.'],
    ['m', 'Which is the ONLY 100% effective way to prevent pregnancy and STIs?', ['Abstinence (not having sex)', 'Withdrawal', 'Birth control pills', 'Emergency contraception'], 'Abstinence is the only method that is 100% effective.'],
    ['t', 'In Kiribati, condoms are available at bars, kava bars, motels, clinics, hospitals and NGOs like KFHA.', true, 'Condoms are widely available and free at many places.'],
    ['t', 'The withdrawal method is a very reliable way to prevent pregnancy.', false, 'Withdrawal often fails because sperm can be released before ejaculation. It gives no STI protection.'],
    ['s', 'Fill in the blanks (2024 exam): "In Kiribati ___1___ are available at public bars, kava bars, motels and resorts, clinics & hospitals and at non-government health organisations like ___2___. The decision for which ___3___ method to use is highly dependent on both partners. It is their own responsibility to ensure they have safe sex and use ___4___ to prevent unplanned pregnancy and STIs."', '1. condoms\n2. KHFA (Kiribati Family Health Association)\n3. contraceptive\n4. contraception', 4],
    ['s', 'Identify TWO strategies to overcome barriers that stop young people getting contraceptives.', 'Any two: youth-friendly clinics with private, non-judging staff; free condoms in private places; sexual health education in schools and churches to reduce shame; peer educators; outreach clinics on outer islands; keeping information confidential.', 2],
    ['s', 'List FOUR places in Kiribati where condoms or contraceptives can be accessed.', 'Any four: hospitals (e.g. Tungaru Central Hospital), health clinics/dispensaries, KFHA, pharmacies, public bars, kava bars, motels and resorts, youth centres.', 4],
    ['m', 'Emergency contraception is used:', ['After unprotected sex to lower the chance of pregnancy', 'Every day instead of condoms', 'To cure STIs', 'During pregnancy'], 'It works best within 72 hours and does not protect against STIs.'],
    ['m', 'The contraceptive pill protects against:', ['Pregnancy only', 'Pregnancy and STIs', 'STIs only', 'Nothing'], 'The pill does not stop STIs – use condoms too.'],
    ['m', 'Contraception means:', ['Methods used to prevent pregnancy', 'Medicine for STIs', 'A type of vaccine', 'Care during pregnancy'], 'Contra = against, conception = becoming pregnant.'],
  ]},
  { id: 'y10-skills', year: 10, strand: 'Strand 5 · Sport Skills, Health & Safety', title: 'Technical skills & tactics', icon: '⚽', qs: [
    ['m', 'What is a technical skill in sport?', ['A specific movement done correctly, like passing, shooting or serving', 'A plan to beat the opponent', 'A rule of the game', 'A type of injury'], 'Technique is HOW you perform a skill correctly.'],
    ['m', 'What is a tactic?', ['A plan or strategy used to beat the opponent', 'A piece of sports equipment', 'A warm-up exercise', 'A type of muscle'], 'E.g. man-to-man marking, fast break, playing to the opponent\'s weak side.'],
    ['m', 'Which is an ATTACKING tactic in soccer?', ['Using width by passing to the wings', 'Man-to-man marking', 'Parking the bus', 'Offside trap'], 'Spreading play wide stretches the defence and creates space.'],
    ['m', 'Which is a DEFENSIVE tactic in basketball?', ['Zone defence', 'Fast break', 'Pick and roll', 'Three-point shooting'], 'In zone defence each player guards an area instead of a person.'],
    ['m', 'The volleyball skill used to receive a serve with the forearms is the:', ['Dig (bump)', 'Spike', 'Set', 'Block'], 'The dig/bump uses the flat of both forearms.'],
    ['t', 'Practising skills correctly and often helps them become automatic.', true, 'Repetition builds muscle memory.'],
    ['s', 'Define technical skills and tactics, and give an example of each from one sport.', 'Technical skill: the correct technique for a movement, e.g. the chest pass in netball.\nTactic: a plan to gain an advantage, e.g. a zone defence in netball or basketball.', 2],
    ['s', 'Identify TWO tactical skills in a selected sport.', 'Example – Volleyball: 1) Serving to the weakest receiver. 2) Using a quick set to beat the block.\nExample – Soccer: 1) Counter-attack. 2) Man-to-man marking.', 2],
    ['m', 'In netball, the pass that is thrown from the chest with two hands is the:', ['Chest pass', 'Bounce pass', 'Overhead pass', 'Shoulder pass'], 'It is fast and accurate over short distances.'],
    ['m', 'A fast break in basketball is:', ['Quickly attacking before the defence is set', 'A rest period', 'A foul', 'A time-out'], 'It is an attacking tactic.'],
    ['m', 'Which is a technical skill in soccer?', ['Dribbling', 'Zone defence', 'Counter-attack', 'Offside trap'], 'The others are tactics.'],
  ]},
  { id: 'y10-diet', year: 10, strand: 'Strand 5 · Sport Skills, Health & Safety', title: 'Healthy diet in sport', icon: '🥥', qs: [
    ['m', 'Which nutrient is the body\'s MAIN source of energy for sport?', ['Carbohydrates', 'Proteins', 'Vitamins', 'Minerals'], 'Carbohydrates (rice, breadfruit, taro, bananas) are stored as glycogen in muscles.'],
    ['m', 'Which nutrient builds and repairs muscles?', ['Protein', 'Carbohydrate', 'Fat', 'Fibre'], 'Protein sources: fish, eggs, chicken, beans, coconut crab.'],
    ['m', 'Why must athletes drink water before, during and after exercise?', ['To prevent dehydration and control body temperature', 'To build muscle', 'To gain weight', 'To slow the heart'], 'Sweat loses water; dehydration reduces performance and can cause heat illness.'],
    ['m', 'Which is the BEST pre-game meal 2–3 hours before a match?', ['Rice with fish and vegetables', 'Deep-fried chips and soft drink', 'Nothing at all', 'A large fatty meat meal just before playing'], 'Choose a meal high in carbohydrate, moderate in protein and low in fat.'],
    ['m', 'Which local food is a good source of vitamins?', ['Pawpaw', 'Soft drink', 'Instant noodles', 'Lollies'], 'Pawpaw, pandanus fruit and green leaves are rich in vitamins.'],
    ['t', 'A healthy diet helps athletes recover faster after training.', true, 'Carbohydrate refills energy stores and protein repairs muscles.'],
    ['s', 'Discuss what a healthy diet in sport includes.', 'A balanced diet with:\n• Carbohydrates for energy (rice, breadfruit, taro).\n• Protein for muscle repair (fish, eggs).\n• Some healthy fats (coconut) for long-lasting energy.\n• Vitamins and minerals from fruit and vegetables for body functions.\n• Plenty of water to stay hydrated.\nAthletes should avoid junk food, sugary drinks and alcohol.', 3],
    ['s', 'Explain the importance of being healthy in relation to sport.', 'A healthy athlete has more energy and stamina, recovers faster, gets injured less often and concentrates better. Good nutrition, sleep and hydration improve performance, while illness or poor diet lower strength and endurance.', 3],
    ['m', 'Which drink is best for most athletes during training?', ['Water', 'Soft drink', 'Alcohol', 'Energy drink with lots of caffeine'], 'Water is the best choice for hydration.'],
    ['m', 'Fats in the diet mainly provide:', ['Stored, slow-release energy', 'Muscle repair', 'Fast energy for sprints', 'Vitamins only'], 'Fat is useful for long, low-intensity activity.'],
    ['m', 'What should an athlete eat soon after training to recover?', ['Carbohydrate and protein, e.g. fish with rice', 'Nothing', 'Only lollies', 'Only water forever'], 'Refuel glycogen and repair muscle.'],
  ]},
  { id: 'y10-safety', year: 10, strand: 'Strand 5 · Sport Skills, Health & Safety', title: 'Safety in sport', icon: '⛑️', qs: [
    ['m', 'What is the main purpose of a warm-up?', ['To raise body temperature and prepare muscles to prevent injury', 'To tire players out', 'To replace training', 'To cool down the body'], 'A warm-up increases blood flow and flexibility.'],
    ['m', 'Which safety gear protects a boxer\'s teeth?', ['Mouthguard', 'Shin pads', 'Helmet', 'Gloves'], 'A mouthguard protects teeth and reduces jaw injuries.'],
    ['m', 'Soccer players wear shin pads to:', ['Protect the lower leg from kicks', 'Run faster', 'Keep warm', 'Look professional'], 'Shin pads protect the tibia.'],
    ['m', 'Which is a SAFETY precaution before a game?', ['Check the playing area for broken glass and holes', 'Play with jewellery on', 'Skip the warm-up', 'Play while injured'], 'Checking the field removes hazards.'],
    ['t', 'A cool-down helps the body return to its resting state and reduces muscle stiffness.', true, 'Light jogging and stretching after exercise helps recovery.'],
    ['t', 'Wearing jewellery during contact sports is safe.', false, 'Jewellery can cause cuts and injuries to you and others.'],
    ['s', 'Apply safety gear and precautions to a sport of your choice.', 'Example – Rugby: gear – mouthguard, headgear, proper boots. Precautions – warm-up and cool-down, check the field for hazards, learn correct tackling technique, follow the rules, have a first-aid kit ready.', 3],
    ['m', 'What should you do first if a player is injured during a game?', ['Stop play and check the player', 'Keep playing', 'Move them roughly', 'Ignore it'], 'Stop, assess and give first aid or get help.'],
    ['m', 'Which is a piece of safety gear in cricket?', ['Helmet and pads for the batter', 'Swimming goggles', 'Boxing gloves', 'Netball bib'], 'Cricket balls are hard and fast.'],
    ['m', 'Why is it important to follow the rules of a game?', ['To keep players safe and the game fair', 'To make the game slower', 'To help one team', 'Rules do not matter'], 'Many rules exist to prevent injuries.'],
    ['m', 'Why should athletes drink water in hot Kiribati weather?', ['To prevent dehydration and heat illness', 'To gain muscle', 'To make them slower', 'It is not needed'], 'Heat and humidity increase sweating.'],
  ]},
  { id: 'y10-food', year: 10, strand: 'Strand 3 · Health & Safety', title: 'Food choices & nutrition', icon: '🍲', qs: [
    ['m', 'Which statement best summarises the key components of nutrition?', ['Fats, proteins, carbohydrates and water are essential for energy and nutrients that must be replenished daily', 'Nutrition consists only of vitamins', 'Nutrition is unimportant as long as we eat enough', 'Nutrition depends only on taste'], 'All nutrients are needed every day in the right amounts.'],
    ['m', 'What is the most common result of over-nutrition (over-eating)?', ['Obesity', 'Lean', 'Slim', 'Slender'], 'Too many kilojoules/calories are stored as fat.'],
    ['m', 'Which food group gives GROWTH (body-building) foods?', ['Fish, eggs and beans', 'Rice and bread', 'Pawpaw and pumpkin', 'Butter and oil'], 'Body-building foods are proteins.'],
    ['m', 'Which is a healthier choice than imported instant noodles?', ['Local fish with breadfruit', 'Chips', 'Soft drinks', 'Lollies'], 'Local foods are fresher, with less salt and fat.'],
    ['m', 'A lack of iron in the diet can lead to:', ['Anaemia', 'Obesity', 'Diabetes', 'Scurvy'], 'Iron makes haemoglobin in red blood cells. Scurvy is caused by lack of vitamin C.'],

    ['s', 'Describe how food choices affect your own and others\' health.', 'Healthy choices (local fish, fruit, vegetables, water) give energy, help growth and prevent NCDs. Unhealthy choices (processed, sugary, salty or fatty foods) cause obesity, diabetes, high blood pressure and tooth decay. Family food choices affect children, and buying local foods supports the community.', 3],
    ['s', 'Suggest THREE ways to improve the nutritional value of meals.', 'Any three: add vegetables or fruit (pawpaw, pumpkin, cabbage) to each meal; choose fish instead of fatty tinned meat; boil or bake instead of frying; use less salt and sugar; drink water instead of soft drinks; eat brown rice or local starch such as breadfruit.', 3],
    ['m', 'Which is an ENERGY-giving food?', ['Breadfruit', 'Fish', 'Pawpaw', 'Water'], 'Starchy foods like breadfruit, rice and taro give energy.'],
    ['m', 'Which is a PROTECTIVE food rich in vitamins?', ['Pumpkin and green leaves', 'Rice', 'Butter', 'Sugar'], 'Fruit and vegetables protect against illness.'],
    ['m', 'Eating too much salt increases the risk of:', ['High blood pressure', 'Anaemia', 'Scurvy', 'Ringworm'], 'High blood pressure leads to stroke and heart disease.'],
  ]},
  { id: 'y10-drugs', year: 10, strand: 'Strand 3 · Health & Safety', title: 'Alcohol & other drugs', icon: '🚭', qs: [
    ['m', 'Which statement accurately describes the four categories of drugs?', ['Hallucinogens, narcotics, stimulants and depressants can all be addictive and cause withdrawal when stopped', 'Narcotics are the only drugs that affect the mind', 'Only hallucinogens cause withdrawal', 'Stimulants and depressants are not addictive'], 'All four categories can cause dependence and withdrawal.'],
    ['m', 'Alcohol is classified as a:', ['Depressant', 'Stimulant', 'Hallucinogen', 'Vitamin'], 'Depressants slow down the central nervous system.'],
    ['m', 'Nicotine in tobacco is a:', ['Stimulant', 'Depressant', 'Hallucinogen', 'Narcotic'], 'Stimulants speed up the central nervous system; nicotine is highly addictive.'],
    ['m', 'Which is a LONG-TERM effect of smoking?', ['Lung cancer', 'Bad breath only for one day', 'Feeling relaxed', 'Coughing once'], 'Long-term: lung cancer, heart disease, emphysema, stroke.'],
    ['m', 'Which is a SHORT-TERM effect of alcohol?', ['Poor judgement and loss of balance', 'Liver cirrhosis', 'Brain damage after years', 'Heart disease'], 'Short-term: slurred speech, risky decisions, accidents, vomiting.'],

    ['t', 'Marijuana is a type of drug that can affect memory and mental health.', true, 'Cannabis can cause memory problems, anxiety and psychosis.'],
    ['t', 'Second-hand smoke cannot harm non-smokers.', false, 'Second-hand smoke causes asthma, lung disease and cancer in others.'],
    ['s', 'Describe the short-term and long-term effects of alcohol on health.', 'Short-term: slow reactions, poor judgement, loss of balance, vomiting, violence, accidents, unsafe sex.\nLong-term: liver damage (cirrhosis), heart disease, high blood pressure, brain damage, addiction, depression, family and money problems.', 4],
    ['s', 'Describe the effects of tobacco on physical and mental health.', 'Physical: lung cancer, heart disease, stroke, coughing, reduced fitness, stained teeth.\nMental: nicotine addiction, anxiety and irritability during withdrawal, stress.', 3],
    ['m', 'Kava (sakau) mainly acts on the body as a:', ['Depressant (relaxes and slows the body)', 'Stimulant', 'Vitamin', 'Painkiller only'], 'Heavy use can cause skin problems, tiredness and poor judgement.'],
    ['m', 'Addiction means:', ['A strong need to keep using a drug even when it causes harm', 'Using medicine correctly', 'Trying something once', 'Eating healthy food'], 'Stopping may cause withdrawal symptoms.'],

  { id: 'y10-hygiene', year: 10, strand: 'Strand 3 · Health & Safety', title: 'Health, hygiene & microorganisms', icon: '🦠', qs: [
    ['m', 'Which of the following is NOT a type of microorganism?', ['Lice', 'Fungi', 'Viruses', 'Bacteria'], 'Lice are small insects you can see; microorganisms need a microscope.'],
    ['m', 'What is a microorganism?', ['A living thing too small to be seen without a microscope', 'A large animal', 'A type of plant', 'A body organ'], 'Examples: bacteria, viruses, fungi, protozoa.'],
    ['m', 'Which disease is caused by a VIRUS?', ['Influenza (flu)', 'Tuberculosis', 'Ringworm', 'Cholera'], 'TB and cholera are bacterial; ringworm is fungal.'],
    ['m', 'Ringworm is caused by a:', ['Fungus', 'Virus', 'Bacterium', 'Worm'], 'Despite the name, ringworm is a fungal skin infection.'],
    ['m', 'The BEST way to stop germs spreading is:', ['Washing hands with soap and water', 'Sharing towels', 'Eating uncovered food', 'Drinking unboiled water'], 'Handwashing removes most germs.'],
    ['t', 'Some bacteria are useful, for example those in yoghurt and in our gut.', true, 'Not all microorganisms are harmful.'],
    ['t', 'Antibiotics can cure viral infections such as the common cold.', false, 'Antibiotics kill bacteria, not viruses.'],
    ['s', 'Identify the THREE main types of microorganisms and give an example of a disease each causes.', '• Bacteria – tuberculosis, cholera, typhoid.\n• Viruses – influenza, COVID-19, HIV, dengue.\n• Fungi – ringworm, athlete\'s foot.\n(Protozoa – malaria, amoebic dysentery – also accepted.)', 3],
    ['s', 'List FOUR personal hygiene practices.', 'Any four: wash hands with soap, bathe daily, brush teeth twice a day, wash clothes, cut nails, cover coughs and sneezes, use a clean toilet, boil drinking water, cover food.', 4],
    ['m', 'Which disease is spread by mosquitoes?', ['Dengue fever', 'Ringworm', 'Tuberculosis', 'Diabetes'], 'Remove standing water to stop mosquitoes breeding.'],
    ['m', 'Why should drinking water be boiled?', ['To kill germs that cause diarrhoea', 'To make it taste sweet', 'To add vitamins', 'It is not necessary'], 'Boiling kills bacteria, viruses and parasites.'],
    ['m', 'Which microorganism is used to make bread rise?', ['Yeast (a fungus)', 'Virus', 'Tuberculosis bacteria', 'Lice'], 'Yeast is a useful fungus.'],
  ]},
  { id: 'y10-admin', year: 10, strand: 'Strand 6 · Sport Administration', title: 'Sport administration & programs', icon: '📋', qs: [
    ['m', 'What is sports administration?', ['The planning, organising and managing of sport and sporting events', 'Playing sport professionally', 'Treating sports injuries', 'Writing sports news'], 'Administrators run clubs, competitions and federations.'],
    ['m', 'Who enforces the rules during a match?', ['Referee (umpire)', 'Sports agent', 'Spectator', 'Sponsor'], 'Referees and umpires make sure the game is fair and safe.'],
    ['m', 'Who negotiates contracts for professional athletes?', ['Sports agent', 'Coach', 'Referee', 'Volunteer'], 'An agent represents the athlete in business deals.'],
    ['m', 'Who trains players and develops their skills and tactics?', ['Coach', 'Referee', 'Agent', 'Timekeeper'], 'The coach plans training and match strategy.'],
    ['m', 'Which is a STAKEHOLDER in a sports program?', ['Sponsors, players, parents and the community', 'Only the referee', 'Only the players', 'No one'], 'Stakeholders are anyone who has an interest in the program.'],
    ['m', 'What is a sports program?', ['A planned set of sporting activities, like a school competition or training schedule', 'A TV show', 'A sports injury', 'A piece of gym equipment'], 'Types: school sports, community leagues, national competitions, development programs.'],
    ['t', 'Volunteers are important in sport because they help run events for free.', true, 'Many Kiribati sports events depend on volunteers.'],
    ['s', 'Describe the role of a sports administrator, coach, referee and volunteer.', '• Administrator – plans and manages the club or event: budgets, schedules, venues, registration.\n• Coach – trains players, plans sessions, picks the team and tactics.\n• Referee/umpire – enforces the rules, keeps the game fair and safe.\n• Volunteer – helps with tasks such as scoring, first aid, food, setting up.', 4],
    ['s', 'Describe the benefits of sport to the community.', 'Sport improves health and fitness, reduces NCDs, builds teamwork and friendships, keeps youth away from drugs and alcohol, brings pride and unity (e.g. inter-island games), and creates jobs and income through events.', 3],
    ['s', 'Describe how to organise a sports program.', '1. Plan – set goals, choose the sport, date, venue, budget.\n2. Organise – form a committee, get equipment, officials, sponsors, first aid.\n3. Promote – advertise and register teams.\n4. Run the event – draw, schedule, officiating, safety.\n5. Evaluate – review results and feedback afterwards.', 4],
    ['m', 'Which is a type of sports program?', ['An inter-school athletics competition', 'A hospital', 'A shop', 'A church service'], 'Programs include school sports, club leagues and national games.'],
    ['m', 'Who helps at sports events without being paid?', ['Volunteers', 'Agents', 'Professional players', 'Sponsors'], 'Volunteers are vital to community sport.'],
  ]},
