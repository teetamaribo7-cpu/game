    Q('Adding Na₂SO₄ to saturated CaSO₄ (CaSO₄(s) ⇌ Ca²⁺ + SO₄²⁻) will', ['shift the equilibrium left and decrease the solubility of CaSO₄ (common ion effect)', 'shift the equilibrium right and dissolve more CaSO₄', 'have no effect', 'increase Ksp'], 'Extra SO₄²⁻ is a common ion; the system removes it by forming more solid. Used to remove unwanted ions in water treatment.', '2025 Q3.2b'),
    Q('At 25 °C, 359 g of NaCl dissolves in 1 L of water. This property is', ['solubility', 'pH', 'density', 'conductivity'], 'The maximum mass dissolved in a given volume of solvent at a given temperature.', '2024 Q3.2a'),
    Q('Ksp of BaF₂ = 1.84 × 10⁻⁷. Its molar solubility is', ['3.6 × 10⁻³ mol/L', '4.3 × 10⁻⁴ mol/L', '4.6 × 10⁻⁸ mol/L', '5.7 × 10⁻³ mol/L'], 'BaF₂ ⇌ Ba²⁺ + 2F⁻; Ksp = s(2s)² = 4s³ → s = ∛(4.6×10⁻⁸) = 3.6×10⁻³ mol/L.', '2024 Q3.2b'),
    Q('The graph shows that KCl solubility increases with temperature. This indicates that dissolving KCl is', ['endothermic – heating shifts the equilibrium towards dissolved ions', 'exothermic – heating shifts it towards the solid', 'neither endothermic nor exothermic', 'a chemical reaction producing gas'], 'By Le Chatelier, adding heat favours the endothermic direction (dissolving).', '2024 Q3.2c', D.kclCurve()),
    Q('Which two changes decrease the solubility of a gas in a liquid?', ['Increasing the temperature and decreasing the pressure', 'Decreasing the temperature and increasing the pressure', 'Stirring and adding more gas', 'Increasing pressure and adding salt'], 'Gas dissolving is exothermic; higher T drives gas out. Lower pressure also lets gas escape.', '2023 Q3.2a'),
    Q('PbI₂(s) ⇌ Pb²⁺ + 2I⁻. In which solution is PbI₂ LESS soluble?', ['Pb(NO₃)₂(aq), because Pb²⁺ is a common ion that shifts the equilibrium left', 'Ba(NO₃)₂(aq), because Ba²⁺ is a common ion', 'Both the same', 'Pure water'], 'Pb²⁺ already present pushes the equilibrium back towards solid PbI₂.', '2023 Q3.2b'),
    Q('10.0 mL of 2.0×10⁻⁴ M Na₂SO₄ is added to 100.0 mL of 3.2×10⁻⁴ M BaCl₂ (Ksp BaSO₄ = 1.08×10⁻¹⁰). Will BaSO₄ precipitate?', ['Yes – IP ≈ 5.3 × 10⁻⁹ is greater than Ksp', 'No – IP is smaller than Ksp', 'Yes – IP ≈ 6.4 × 10⁻⁸', 'No – IP equals Ksp'], '[Ba²⁺] = 2.91×10⁻⁴, [SO₄²⁻] = 1.82×10⁻⁵ after mixing (110 mL). IP = 5.3×10⁻⁹ > 1.08×10⁻¹⁰ → precipitate.', '2023 Q3.2c'),
    Q('Solubility is defined as', ['the maximum amount of solute that dissolves in a given amount of solvent at a given temperature', 'the rate at which a solid dissolves', 'the amount of solvent needed to dissolve 1 g of solute', 'the ability of a solution to conduct'], 'It describes a saturated solution.', '2022 Q3.2a'),
    Q('Ksp of CaSO₄ = 2.4 × 10⁻⁵. Its molar solubility at 25 °C is', ['4.9 × 10⁻³ mol/L', '2.4 × 10⁻⁵ mol/L', '1.2 × 10⁻⁵ mol/L', '1.8 × 10⁻² mol/L'], 'Ksp = s² → s = √(2.4×10⁻⁵) = 4.9×10⁻³ mol/L.', '2022 Q3.2b'),
    Q('Adding Na₂SO₄ to a saturated CaSO₄ solution makes the solubility of CaSO₄', ['decrease', 'increase', 'stay the same', 'double'], 'Common ion effect.', '2022 Q3.2c'),
    Q('The solubility product is', ['the product of ion concentrations (raised to their coefficients) in a saturated solution of a sparingly soluble salt', 'the mass of salt that dissolves per litre', 'the product formed when a salt dissolves', 'the concentration of the solid'], 'It is the equilibrium constant for dissolving.', '2021 Q3.5a'),
    Q('The Ksp expression for Mg(OH)₂ is', ['[Mg²⁺][OH⁻]²', '[Mg²⁺][OH⁻]', '[Mg²⁺][2OH⁻]', '[Mg(OH)₂] / [Mg²⁺][OH⁻]²'], 'Mg(OH)₂(s) ⇌ Mg²⁺ + 2OH⁻. The solid is left out.', '2021 Q3.5b'),
    Q('Ks of PbCl₂ = 1.7 × 10⁻⁵. Its solubility in water is', ['1.6 × 10⁻² mol/L', '4.1 × 10⁻³ mol/L', '2.6 × 10⁻² mol/L', '8.5 × 10⁻⁶ mol/L'], 'Ks = 4s³ → s = ∛(1.7×10⁻⁵ / 4) = ∛(4.25×10⁻⁶) = 1.62×10⁻² mol/L.', '2020 Q3.4a'),
    Q('PbCl₂ is less soluble in 0.1 M NaCl than in water. This is known as', ['the common ion effect', 'the buffer effect', 'hydrolysis', 'the salting-in effect'], 'Cl⁻ is common to both; equilibrium shifts towards solid PbCl₂.', '2020 Q3.4b'),
    Q('20 mL of 0.02 M CaCl₂ is mixed with 20 mL of 0.04 M Na₂SO₄ (Ksp CaSO₄ = 2.4×10⁻⁵). The correct ionic product and conclusion are', ['IP = 0.01 × 0.02 = 2 × 10⁻⁴; IP > Ksp so a precipitate forms', 'IP = 0.01 + 0.02 = 0.03; precipitate forms', 'IP = 0.02 × 0.04 = 8 × 10⁻⁴; no precipitate', 'IP = 2 × 10⁻⁴; IP < Ksp so no precipitate'], 'After mixing, each concentration halves: [Ca²⁺] = 0.01 M, [SO₄²⁻] = 0.02 M. Multiply (not add) them: 2×10⁻⁴ > 2.4×10⁻⁵.', '2019 Q3.4'),
    Q('The common ion effect is', ['the decrease in solubility (or ionisation) of a substance when a solution already contains one of its ions', 'the increase in solubility when a common ion is added', 'the reaction between two common salts', 'the effect of temperature on solubility'], 'e.g. adding CH₃COONa to CH₃COOH reduces its ionisation; adding NaCl reduces PbCl₂ solubility.', '2018 Q3.1b'),
    Q('If IP < Ksp after mixing two solutions, then', ['no precipitate forms (solution is unsaturated)', 'a precipitate forms', 'the solution is saturated', 'Ksp increases'], 'More solid could still dissolve.', 'Syllabus 5.2'),
    Q('Which salt is least soluble? (all AB type) AgCl Ksp 1.8×10⁻¹⁰; AgBr 5.0×10⁻¹³; AgI 8.3×10⁻¹⁷; CaSO₄ 2.4×10⁻⁵', ['AgI', 'AgCl', 'AgBr', 'CaSO₄'], 'For salts of the same formula type, the smallest Ksp is least soluble.', 'Syllabus 5.2'),
    Q('Barium sulfate is safe to swallow for X-ray imaging because', ['its very low Ksp means almost no toxic Ba²⁺ dissolves', 'barium ions are not toxic', 'it is a strong electrolyte', 'it dissolves quickly and leaves the body'], 'Ksp = 1.08 × 10⁻¹⁰; [Ba²⁺] in saturated solution ≈ 1 × 10⁻⁵ M.', '2023 Q3.2c'),
    Q('Heavy metal ions (e.g. Pb²⁺) can be removed from waste water by', ['adding an anion that forms an insoluble salt so the metal precipitates', 'heating the water', 'adding more water', 'adding a soluble lead salt'], 'Precipitation as hydroxide, sulfide or carbonate (IP > Ksp), followed by filtration.', 'Syllabus 5.2')
  ]
};

/* ===================== PAST PAPER SOLUTIONS 2025–2021 ===================== */
var SOL = {};
function H(t) { return ['#', t]; }
function P(n, q, a, d) { return [n, q, a, d || '']; }
var ANS = function (t) { return '<div class="final">' + t + '</div>'; };

SOL['2025'] = [
  H('Strand 1: Atomic Structure, Bonding and Related Properties'),
  P('1.1a', 'The shape of the sulphur hexafluoride (SF₆) molecule is: A linear, B octahedral, C tetrahedral, D trigonal planar.', ANS('B – octahedral') + '<p>S has 6 bonding pairs and no lone pairs around it. Six electron pairs repel to the corners of an octahedron, with all bond angles 90°.</p>', D.sf6()),
  P('1.1b', 'Name the type of intermolecular attraction present between hydrogen fluoride (HF) molecules.', ANS('Hydrogen bonding') + '<p>H is bonded directly to F, a small, highly electronegative atom with lone pairs, so the δ+ H of one molecule is attracted to a lone pair on the F of another molecule. (London dispersion forces are also present but hydrogen bonding is the main attraction.)</p>'),
  P('1.1c', 'NH₃ has a trigonal pyramidal shape. Describe the polarity of the ammonia molecule, using the concept of electronegativity and dipole moment.', '<ul><li>N (3.0) is more electronegative than H (2.1), so each N–H bond is polar: N is δ−, H is δ+.</li><li>N has one lone pair, giving a trigonal pyramidal (not symmetrical) shape.</li><li>The three bond dipoles therefore do <b>not cancel</b>; they add together to give a <b>net dipole moment</b> pointing towards the N (lone pair) end.</li></ul>' + ANS('NH₃ is a polar molecule.'), D.nh3()),
  P('1.1d', 'Discuss the trend in the 1st ionisation energy of the Group 1 elements. Include atomic radius, nuclear charge and electron shielding.', '<p><b>Trend:</b> first ionisation energy <b>decreases down Group 1</b> (Li 520 → Na 496 → K 419 → Rb 403 → Cs 376 kJ/mol).</p><ul><li><b>Atomic radius:</b> each element down the group has an extra occupied shell, so the single outer s electron is further from the nucleus.</li><li><b>Shielding:</b> more inner shells of electrons shield (screen) the outer electron from the nucleus.</li><li><b>Nuclear charge:</b> increases down the group, but this is outweighed by the larger distance and extra shielding, so the effective attraction on the outer electron decreases.</li></ul><p>Therefore less energy is needed to remove the outer electron, and reactivity of Group 1 metals increases down the group.</p>', D.ieGroup1()),
  P('1.2a', 'Which of the following best describes a fission reaction?', ANS('D – A heavy nucleus splits into smaller nuclei, releasing energy and neutrons.') + '<p>(C describes fusion; A describes beta decay.)</p>'),
  P('1.2b', 'List at least two properties of beta particles.', '<ul><li>They are fast-moving electrons (⁰₋₁e) with a charge of −1.</li><li>Negligible mass (about 1/1840 of a proton).</li><li>Medium penetrating power – pass through paper but stopped by a few mm of aluminium.</li><li>Medium ionising power (less than α, more than γ).</li><li>Deflected towards the positive plate in an electric field.</li></ul>'),
  P('1.3a', 'Fe is [Ar]3d⁶4s². Write the electronic configuration of Fe²⁺ and Fe³⁺.', ANS('Fe²⁺ = [Ar] 3d⁶ &nbsp;&nbsp; Fe³⁺ = [Ar] 3d⁵') + '<p>Transition metals lose their 4s electrons first, then 3d electrons. (In full: Fe²⁺ 1s²2s²2p⁶3s²3p⁶3d⁶; Fe³⁺ 1s²2s²2p⁶3s²3p⁶3d⁵.)</p>'),
  P('1.3b', 'Explain why the complex ion [Cu(H₂O)₆]²⁺ appears light blue in aqueous solution.', '<ul><li>Cu²⁺ has the configuration [Ar]3d⁹ – a <b>partially filled d sub-shell</b>.</li><li>The six water ligands bond to Cu²⁺ (dative bonds) and <b>split the five 3d orbitals</b> into two groups with different energies.</li><li>When white light passes through, a d electron absorbs light energy equal to the energy gap (ΔE = hf) and is promoted to a higher d orbital. The complex absorbs light in the <b>red–orange</b> region.</li><li>The remaining wavelengths are transmitted; we see the <b>complementary colour, light blue</b>.</li></ul>', D.dsplit()),
  P('1.3c', 'Discuss why transition metals like iron are suitable as catalysts in reactions such as the Haber process.', '<ul><li>Transition metals have <b>partially filled d orbitals</b> that can form weak temporary bonds to reactant molecules, so N₂ and H₂ are <b>adsorbed onto the iron surface</b>.</li><li>Adsorption <b>weakens the strong N≡N and H–H bonds</b> and holds the molecules close together in a favourable orientation.</li><li>N and H atoms combine on the surface to form NH₃, which then <b>desorbs</b>, freeing the active site for more reactants.</li><li>Their <b>variable oxidation states</b> allow them to gain and lose electrons easily during the reaction.</li><li>Overall the catalyst provides an <b>alternative pathway with lower activation energy</b>, so the reaction is faster at a lower temperature; it is not used up and does not change the position of equilibrium. This saves energy and money in fertiliser production.</li></ul>', D.haber()),
  H('Strand 2: Thermochemistry and Chemistry in the Society'),
  P('2.1a', 'The energy needed to separate one mole of solid NaCl into its gaseous ions Na⁺(g) and Cl⁻(g) is known as the …', ANS('A – lattice energy of NaCl')),
  P('2.1b', 'Copper block 50.0 g at 80.0 °C placed in 100.0 g water at 20.0 °C; final temperature 22.7 °C; c(water) = 4.182 J/g°C. Calculate the specific heat capacity of copper.', '<p>Heat gained by water: q = mcΔT = 100.0 × 4.182 × (22.7 − 20.0) = 100.0 × 4.182 × 2.7 = <b>1129 J</b></p><p>Heat lost by copper = heat gained by water (no heat loss):<br>50.0 × c × (80.0 − 22.7) = 1129<br>50.0 × c × 57.3 = 1129 → 2865 c = 1129</p>' + ANS('c(Cu) = 0.394 J g⁻¹ °C⁻¹')),
  P('2.1c', 'Calculate ΔH° for C₂H₅OH(ℓ) + 3O₂(g) → 2CO₂(g) + 3H₂O(ℓ) using ΔfH°: C₂H₅OH −277.7, CO₂ −393.5, H₂O −285.8, O₂ 0 kJ/mol; propose a real-life application.', '<p>ΔH° = ΣΔfH°(products) − ΣΔfH°(reactants)<br>= [2(−393.5) + 3(−285.8)] − [(−277.7) + 3(0)]<br>= [−787.0 − 857.4] + 277.7 = −1644.4 + 277.7</p>' + ANS('ΔH° = −1366.7 kJ mol⁻¹ (exothermic)') + '<p><b>Application:</b> ethanol is used as a <b>fuel</b> – e.g. blended with petrol (E10) for cars, in spirit burners/camping stoves, and as a renewable biofuel made by fermenting sugar cane. The large amount of heat released on combustion is used to do work or heat food/water.</p>'),
  H('Strand 3: Aqueous Equilibrium Systems'),
  P('3.1a', 'Which best defines chemical equilibrium?', ANS('D – The forward and reverse reaction rates are equal.')),
  P('3.1b', 'Write the equilibrium constant expression (K) for 2N₂O₅(g) ⇌ 4NO₂(g) + O₂(g).', ANS('K = [NO₂]⁴ [O₂] / [N₂O₅]²')),
  P('3.1c', 'Which best defines a buffer solution?', ANS('A – A solution that resists changes in pH.')),
  P('3.1d', 'HNO₂ + H₂O ⇌ NO₂⁻ + H₃O⁺, Ka = 4.5 × 10⁻⁴. Determine the relative equilibrium concentrations of H₃O⁺ and NO₂⁻ in 0.1 M HNO₂.', '<p>Ka = [NO₂⁻][H₃O⁺] / [HNO₂]. Since [H₃O⁺] = [NO₂⁻] = x and assuming [HNO₂] ≈ 0.1 M:</p><p>x² = Ka × c = 4.5 × 10⁻⁴ × 0.1 = 4.5 × 10⁻⁵<br>x = √(4.5 × 10⁻⁵)</p>' + ANS('[H₃O⁺] = [NO₂⁻] = 6.7 × 10⁻³ mol L⁻¹; [HNO₂] ≈ 0.1 − 0.0067 ≈ 0.093 mol L⁻¹') + '<p>(pH = 2.17. Solving the quadratic exactly gives 6.5 × 10⁻³ M.)</p>'),
  P('3.1e', '100 mL buffer: 0.10 M HCOOH (Ka = 1.8 × 10⁻⁴) and 0.10 M HCOONa, diluted with 100 mL water. Calculate the new pH.', '<p>After dilution both concentrations halve: [HCOOH] = 0.050 M, [HCOO⁻] = 0.050 M.</p><p>pKa = −log(1.8 × 10⁻⁴) = 3.74<br>pH = pKa + log([HCOO⁻]/[HCOOH]) = 3.74 + log(0.050/0.050) = 3.74 + 0</p>' + ANS('pH = 3.74 (unchanged by dilution)') + '<p>Dilution changes both concentrations by the same factor, so the ratio and the pH stay the same – a property of buffers.</p>'),
  P('3.1f', 'N₂ + 3H₂ ⇌ 2NH₃, ΔH = −92.4 kJ/mol. Using Le Chatelier’s principle, discuss how concentration, pressure and temperature are used to maximise ammonia yield.', '<ul><li><b>Concentration:</b> adding more N₂ and H₂ and <b>continuously removing NH₃</b> (by cooling to liquefy it) shifts equilibrium to the right to replace the NH₃. Unreacted gases are recycled.</li><li><b>Pressure:</b> 4 mol of gas on the left, 2 mol on the right. <b>High pressure (~200 atm)</b> shifts equilibrium to the side with fewer gas molecules → more NH₃ (and faster rate). Very high pressures are too expensive and dangerous, so ~200 atm is a compromise.</li><li><b>Temperature:</b> the forward reaction is exothermic, so a <b>low temperature</b> favours NH₃ yield (and increases K). But at low temperature the rate is too slow, so a <b>compromise of ~400–450 °C</b> is used.</li><li><b>Catalyst:</b> iron speeds up the rate so equilibrium is reached quickly; it does not change the yield.</li></ul><p>Combining high pressure, moderate temperature, removal of NH₃ and an iron catalyst gives an economic yield (~15% per pass, ~98% overall with recycling).</p>'),
  P('3.2a', 'List at least two factors that affect the solubility of an ionic solid in water.', '<ul><li>Temperature</li><li>Presence of a common ion (common ion effect)</li><li>pH of the solution</li><li>Nature of solute/solvent – size and charge of the ions (lattice energy vs hydration energy)</li></ul>'),
  P('3.2b', 'CaSO₄(s) ⇌ Ca²⁺ + SO₄²⁻. Predict the effect of adding Na₂SO₄, and propose a real-life application.', '<p>Na₂SO₄ is soluble and adds extra SO₄²⁻ – a <b>common ion</b>. By Le Chatelier’s principle the equilibrium shifts to the <b>left</b> to remove the extra SO₄²⁻, so more solid CaSO₄ precipitates and the <b>solubility of CaSO₄ decreases</b>. (Ksp stays the same; [Ca²⁺] decreases.)</p><p><b>Application:</b> removing unwanted ions from water – e.g. precipitating Ca²⁺ (water hardness) or toxic metal ions in water/waste-water treatment by adding a salt with a common ion; also salting-out products in industry.</p>'),
  H('Strand 4: Oxidation–Reduction Processes'),
  P('4.1a', 'Cu in Cu(NO₃)₂ and Ag in AgNO₃ joined with a NaNO₃ salt bridge. Cu → Cu²⁺ + 2e⁻; Ag⁺ + e⁻ → Ag. Write the IUPAC cell notation.', ANS('Cu(s) | Cu²⁺(aq) ‖ Ag⁺(aq) | Ag(s)') + '<p>Anode (oxidation) on the left, cathode (reduction) on the right; ‖ represents the salt bridge.</p>'),
  P('4.1b', 'Sketch the cell; label anode, cathode, salt bridge and directions of ion and electron movement.', '<ul><li><b>Anode (−):</b> Cu electrode in Cu(NO₃)₂(aq) – Cu is oxidised.</li><li><b>Cathode (+):</b> Ag electrode in AgNO₃(aq) – Ag⁺ is reduced, silver deposits.</li><li><b>Electrons</b> flow through the external wire from Cu to Ag.</li><li><b>Salt bridge (NaNO₃):</b> NO₃⁻ anions move towards the Cu (anode) beaker; Na⁺ cations move towards the Ag (cathode) beaker.</li></ul><p>E°cell = 0.80 − 0.34 = +0.46 V.</p>', D.cell({ L: { m: 'Cu', s: 'Cu(NO₃)₂(aq)' }, R: { m: 'Ag', s: 'AgNO₃(aq)' }, bridge: 'NaNO₃ salt bridge' })),
  H('Strand 5: Organic Chemistry'),
  P('5.1a', 'The name of the organic compound shown (CH₃CH₂CH₂CONH₂) is: A butanal, B butanone, C butanamine, D butanamide.', ANS('D – butanamide'), S.butanamide),
  P('5.1b', 'Pentan-1-ol (A) HO–CH₂CH₂CH₂CH₂CH₃ and B HO–CH₂–CH(CH₃)–CH₂–CH₃. Explain the type of isomerism shown.', '<p>Both compounds have the <b>same molecular formula, C₅H₁₂O</b>, and the same functional group (–OH on C1), but a <b>different carbon chain</b>: A has a straight 5-carbon chain; B has a 4-carbon chain with a methyl branch on C2 (2-methylbutan-1-ol).</p>' + ANS('This is structural isomerism – specifically chain isomerism.'), S.pentanol + S.mebutanol),
  P('5.1c', 'Draw the structures of 1,3-dibromobenzene and 1,4-dibromobenzene.', '<p>1,3-: Br atoms on ring carbons 1 and 3 (one carbon between them). 1,4-: Br atoms opposite each other.</p>', D.benz({ 1: 'Br', 3: 'Br' }, '1,3-dibromobenzene') + D.benz({ 1: 'Br', 4: 'Br' }, '1,4-dibromobenzene')),
  P('5.2a', 'What type of reaction is occurring? CH₃Cl + OH⁻ → CH₃OH + Cl⁻', ANS('B – substitution (nucleophilic substitution)')),
  P('5.2b', 'Tollens’ reagent added to an unknown carbonyl compound and warmed: a silver mirror forms. Deduce whether it is an aldehyde or ketone.', ANS('Aldehyde') + '<p>Tollens’ reagent contains [Ag(NH₃)₂]⁺. Aldehydes are easily oxidised (to carboxylic acids/carboxylate ions) and act as reducing agents, reducing Ag⁺ to silver metal, which coats the tube as a <b>silver mirror</b>. Ketones cannot be oxidised easily, so they give no silver mirror. RCHO + 2[Ag(NH₃)₂]⁺ + 3OH⁻ → RCOO⁻ + 2Ag + 4NH₃ + 2H₂O.</p>'),
  P('5.2c', 'Determine the products A and B of the reaction between ethanoyl chloride and propanol.', ANS('A = propyl ethanoate, CH₃COOCH₂CH₂CH₃ &nbsp; B = HCl') + '<p>CH₃COCl + CH₃CH₂CH₂OH → CH₃COOCH₂CH₂CH₃ + HCl (esterification at room temperature).</p>', S.propylEthanoate),
  P('5.2d', 'The compound shown (CH₃CHBrCH₃) is a …', ANS('B – secondary (2°) haloalkane') + '<p>The C bonded to Br is attached to two other carbons.</p>', S.bromopropane2),
  P('5.2e', 'Monomers benzene-1,4-dicarboxylic acid and ethane-1,2-diol: predict the polymerisation type, polymer type, and draw the repeating unit.', '<ul><li><b>Type of reaction:</b> condensation polymerisation – each –COOH reacts with an –OH and a molecule of <b>water is eliminated</b> at each link.</li><li><b>Polymer:</b> a <b>polyester</b> (PET / Terylene) containing ester links –COO–.</li><li>n HOOC–C₆H₄–COOH + n HOCH₂CH₂OH → –[OC–C₆H₄–COO–CH₂CH₂–O]ₙ– + 2n H₂O</li></ul><p>Uses: plastic drink bottles, polyester clothing fibres. It can be hydrolysed at the ester links, so it is more degradable than poly(alkenes).</p>', S.pet)
];

SOL['2024'] = [
  H('Strand 1: Atomic Structure, Bonding and Related Properties'),
  P('1.1a', 'The principal quantum number (n) for the 2s¹ electron is …', ANS('n = 2 (option A)') + '<p>n is the shell number. For 2s¹: n = 2, l = 0, mₗ = 0, mₛ = +½.</p>'),
  P('1.1b', 'Complete the ground state electron configuration of Ca (Z = 20): 1s²2s²2p⁶3s² …', ANS('1s² 2s² 2p⁶ 3s² 3p⁶ 4s²')),
  P('1.1c', 'Draw the Lewis structure of SCl₄, showing all bonding and lone pairs.', '<p>Valence electrons: S 6 + 4 × Cl 7 = 34 e⁻ (17 pairs). S is central with four S–Cl single bonds (4 pairs); each Cl has 3 lone pairs (12 pairs); the remaining <b>1 lone pair is on S</b>. S has an expanded octet (10 electrons). Shape: see-saw.</p>', D.sf(['. . :Cl:', '. . |', ':Cl: - S: - :Cl:', '. . |', '. . :Cl:'])),
  P('1.1d', 'Discuss the boiling points of butane (−1 °C) and butan-1-ol (118 °C): polarity, type and strength of IMFs, effect on boiling point.', '<ul><li><b>Polarity:</b> butane contains only C–C and C–H bonds (very small EN difference) – it is <b>non-polar</b>. Butan-1-ol contains a highly polar <b>O–H</b> group (and C–O) – it is <b>polar</b>.</li><li><b>IMFs:</b> butane molecules are held only by weak <b>London dispersion forces</b>. Butan-1-ol has dispersion forces of similar size (similar chain length) <b>plus hydrogen bonds</b> between the δ+ H of the O–H in one molecule and a lone pair on O of another.</li><li><b>Boiling point:</b> hydrogen bonds are much stronger than dispersion forces, so much more energy is needed to separate butan-1-ol molecules into a gas. Hence butan-1-ol boils at 118 °C while butane boils at −1 °C (a gas at room temperature).</li></ul>'),
  P('1.2a', 'Which of the following denotes an alpha particle? A γ, B β, C α, D λ', ANS('C – α')),
  P('1.2b', 'Account for the contribution of radioactivity in the medical field: an example, the radiation type, detection and conclusion.', '<ul><li><b>Example:</b> radioactive tracers for diagnosis – e.g. technetium-99m injected to image bones, heart or kidneys; iodine-131 for the thyroid. (Also radiotherapy using Co-60 to kill cancer cells.)</li><li><b>Radiation:</b> a <b>gamma</b> emitter is used because γ rays penetrate the body and can be detected outside, and are weakly ionising, causing little damage. Tc-99m has a short half-life (6 h) so the dose is low.</li><li><b>Detection:</b> a <b>gamma camera</b> outside the body detects the radiation; a computer builds an image showing where the tracer collected (hot/cold spots).</li><li><b>Conclusion:</b> doctors can locate tumours, blockages or organ problems without surgery – radioactivity greatly benefits early diagnosis and treatment, provided doses are kept low to limit the risk of cell/DNA damage.</li></ul>'),
  P('1.3a', 'Write a balanced chemical equation for the formation of tetraamminezinc(II), [Zn(NH₃)₄]²⁺.', ANS('Zn²⁺(aq) + 4NH₃(aq) → [Zn(NH₃)₄]²⁺(aq)') + '<p>(Or from the precipitate: Zn(OH)₂(s) + 4NH₃(aq) → [Zn(NH₃)₄]²⁺(aq) + 2OH⁻(aq).)</p>'),
  P('1.3b', 'Cu²⁺ forms a deep blue complex with ammonia. Explain the ability of Cu²⁺ ions to form coloured complexes.', '<ul><li>Cu²⁺ = [Ar]3d⁹ – it has a <b>partially filled 3d sub-shell</b> (one unpaired electron).</li><li>When ligands such as NH₃ form dative bonds, they <b>split the 3d orbitals</b> into lower and higher energy levels.</li><li>An electron in a lower d orbital <b>absorbs visible light</b> of energy equal to ΔE and jumps to a higher d orbital (d–d transition).</li><li>The remaining light is transmitted – the <b>complementary colour</b> is seen. [Cu(NH₃)₄]²⁺ absorbs orange/yellow light → appears deep blue. Different ligands give different splitting, so different colours.</li></ul>', D.dsplit()),
  H('Strand 2: Thermochemistry and Chemistry in the Society'),
  P('2.1a', 'CH₄(g) + 2O₂(g) → CO₂(g) + 2H₂O(ℓ), ΔH = −890.3 kJ/mol: (i) type of reaction, (ii) exothermic or endothermic?', ANS('(i) Combustion (also a redox reaction) &nbsp; (ii) Exothermic – ΔH is negative, heat is released.')),
  P('2.1b', 'Decomposition of MgCO₃ absorbs 118 kJ per mole. Write a balanced thermochemical equation.', ANS('MgCO₃(s) → MgO(s) + CO₂(g) &nbsp; ΔH = +118 kJ mol⁻¹')),
  P('2.1c', 'Given C + O₂ → CO₂ (−393.50); H₂ + ½O₂ → H₂O (−285.83); CH₄ + 2O₂ → CO₂ + 2H₂O (−890.36 kJ). Calculate ΔfH° of CH₄: C(s) + 2H₂(g) → CH₄(g).', '<p>Keep eq 1: C + O₂ → CO₂ &nbsp; −393.50<br>Eq 2 × 2: 2H₂ + O₂ → 2H₂O &nbsp; −571.66<br>Reverse eq 3: CO₂ + 2H₂O → CH₄ + 2O₂ &nbsp; +890.36<br>Add: C + 2H₂ → CH₄ (O₂, CO₂, H₂O cancel)</p><p>ΔfH° = −393.50 − 571.66 + 890.36</p>' + ANS('ΔfH°(CH₄) = −74.80 kJ mol⁻¹')),
  H('Strand 3: Aqueous Equilibrium Systems'),
  P('3.1a', 'Which is Kc for S(g) + O₂(g) ⇌ SO₂(g)?', ANS('A – Kc = [SO₂] / [S][O₂]')),
  P('3.1b', 'In HCl + H₂O → Cl⁻ + H₃O⁺, HCl acts as …', ANS('B – an acid (proton donor)')),
  P('3.1c', 'Calculate the pH of 0.534 M formic acid (Ka = 1.8 × 10⁻⁴).', '<p>[H₃O⁺] = √(Ka × c) = √(1.8 × 10⁻⁴ × 0.534) = √(9.61 × 10⁻⁵) = 9.80 × 10⁻³ M</p><p>pH = −log(9.80 × 10⁻³)</p>' + ANS('pH = 2.01')),
  P('3.1d', 'Select an indicator for (i) strong acid–strong base (equivalence pH 7) and (ii) strong acid–weak base (equivalence pH < 7).', ANS('(i) Bromothymol blue (6.0–7.6) – or phenol red &nbsp; (ii) Methyl orange (3.2–4.4)') + '<p>The indicator’s colour-change range must fall within the steep part of the curve around the equivalence point.</p>'),
  P('3.1e', 'Buffer: 0.25 M CH₃COOH and 0.15 M CH₃COONa, Ka = 1.8 × 10⁻⁵. Calculate the pH.', '<p>pKa = −log(1.8 × 10⁻⁵) = 4.74<br>pH = pKa + log([CH₃COO⁻]/[CH₃COOH]) = 4.74 + log(0.15/0.25) = 4.74 + (−0.22)</p>' + ANS('pH = 4.52')),
  P('3.1f', 'Titration curve of 25.00 mL 0.100 M CH₃COOH with 0.100 M NaOH. Discuss the curve with respect to buffering capacity before and at the equivalence point.', '<ul><li><b>Start:</b> pH ≈ 2.9 (weak acid, partly ionised).</li><li><b>Before equivalence (≈ 3–22 mL):</b> NaOH converts some CH₃COOH into CH₃COO⁻, so the flask contains a <b>weak acid and its conjugate base – a buffer</b>. Added OH⁻ is removed (CH₃COOH + OH⁻ → CH₃COO⁻ + H₂O), so pH rises only slowly – the curve is fairly <b>flat</b>. Buffering capacity is greatest at the half-equivalence point (12.5 mL) where [CH₃COOH] = [CH₃COO⁻] and pH = pKa = 4.74.</li><li><b>At equivalence (25.00 mL):</b> all CH₃COOH has been used up, so there is <b>no buffering capacity</b>. A tiny excess of NaOH causes a <b>steep jump</b> in pH. The equivalence pH is about <b>8.7 (basic)</b> because CH₃COO⁻ is a weak base: CH₃COO⁻ + H₂O ⇌ CH₃COOH + OH⁻. Phenolphthalein is a suitable indicator.</li></ul>', D.curveWeak(true)),
  P('3.2a', '359 g of NaCl dissolves in 1 L of water at 25 °C. This property is …', ANS('C – solubility')),
  P('3.2b', 'Ksp of BaF₂ at 25 °C is 1.84 × 10⁻⁷. Calculate the solubility of BaF₂.', '<p>BaF₂(s) ⇌ Ba²⁺(aq) + 2F⁻(aq); let solubility = s → [Ba²⁺] = s, [F⁻] = 2s</p><p>Ksp = [Ba²⁺][F⁻]² = s(2s)² = 4s³ = 1.84 × 10⁻⁷<br>s³ = 4.6 × 10⁻⁸ → s = ∛(4.6 × 10⁻⁸)</p>' + ANS('s = 3.58 × 10⁻³ mol L⁻¹ (≈ 0.63 g/L, using M = 175.3 g/mol)')),
  P('3.2c', 'With reference to the graph, explain how temperature influences the dissolution of KCl and its energy aspects.', '<ul><li>The graph shows the solubility of KCl <b>increases as temperature increases</b> (≈ 28 g/100 g at 0 °C to ≈ 56 g/100 g at 100 °C).</li><li>This means dissolving KCl is <b>endothermic</b>: KCl(s) + heat ⇌ K⁺(aq) + Cl⁻(aq), ΔH > 0. More energy is needed to break the lattice than is released when the ions are hydrated.</li><li>By Le Chatelier’s principle, raising the temperature (adding heat) shifts the equilibrium to the right (the endothermic direction), so more solid dissolves.</li></ul>', D.kclCurve()),
  H('Strand 4: Oxidation–Reduction Processes'),
  P('4.1a', 'For the Zn–Cu galvanic cell, which is true?', ANS('B – The zinc electrode is used up.') + '<p>Zn is the anode and is oxidised: Zn → Zn²⁺ + 2e⁻, so it loses mass.</p>', D.cell({ L: { m: 'Zn', s: 'ZnSO₄(aq)' }, R: { m: 'Cu', s: 'CuSO₄(aq)' } })),
  P('4.1b', 'The symbol E°cell represents …', ANS('A – standard cell potential')),
  P('4.1c', 'For Zn + Cu²⁺ → Zn²⁺ + Cu, explain how chemical energy is converted into electrical energy. Include half-equations.', '<ul><li><b>Anode (oxidation):</b> Zn(s) → Zn²⁺(aq) + 2e⁻ – zinc atoms lose electrons and enter solution as ions.</li><li><b>Cathode (reduction):</b> Cu²⁺(aq) + 2e⁻ → Cu(s) – copper ions gain electrons and copper metal is deposited.</li><li>Because the two half-reactions are separated, the electrons released at the zinc anode must travel through the <b>external wire</b> to the copper cathode – this flow of electrons is an <b>electric current</b> that can do work (light a bulb).</li><li>The <b>salt bridge</b> lets ions move (anions to the Zn side, cations to the Cu side) to keep both solutions electrically neutral and complete the circuit.</li><li>E°cell = 0.34 − (−0.76) = <b>+1.10 V</b>; positive so the reaction is spontaneous – chemical energy stored in the reactants is converted to electrical energy.</li></ul>'),
  H('Strand 5: Organic Chemistry'),
  P('5.1a', 'For the compound shown (CH₃CH₂CH₂NH₂), the circled functional group is an …', ANS('B – amine'), S.propanamine),
  P('5.1b', 'The enantiomers of lactic acid are shown. This type of isomerism is …', ANS('B – optical isomerism'), D.enant('COOH', 'CH3', 'H', '', 'OH')),
  P('5.1c', 'Draw the structural formula of 3-methylpentan-1-ol.', '<p>5-carbon chain, –OH on C1, –CH₃ on C3: HO–CH₂–CH₂–CH(CH₃)–CH₂–CH₃</p>', D.sf(['. . H . H . H . H . H', '. . | . | . | . | . |', 'H - C - C - C - C - C - OH', '. . | . | . | . | . |', '. . H . H . CH3 . H . H'])),
  P('5.2a', 'Write the structures of the major products A (propanoic acid + SOCl₂) and B (propanoic acid + propanol, H⁺).', ANS('A = propanoyl chloride, CH₃CH₂COCl &nbsp;&nbsp; B = propyl propanoate, CH₃CH₂COOCH₂CH₂CH₃') + '<p>A: CH₃CH₂COOH + SOCl₂ → CH₃CH₂COCl + SO₂ + HCl<br>B: CH₃CH₂COOH + CH₃CH₂CH₂OH ⇌ CH₃CH₂COOCH₂CH₂CH₃ + H₂O</p>', D.sf(['. . . . O', '. . . . ‖', 'CH3 - CH2 - C - Cl']) + D.sf(['. . . . O', '. . . . ‖', 'CH3 - CH2 - C - O - CH2CH2CH3'])),
  P('5.2b', 'Write the product X (ethanal reduced by NaBH₄) or Y (propanone reduced by NaBH₄).', ANS('X = ethanol, CH₃CH₂OH (primary alcohol) &nbsp;&nbsp; Y = propan-2-ol, CH₃CH(OH)CH₃ (secondary alcohol)'), S.ethanol + S.propan2ol),
  P('5.2c', 'Discuss a chemical test that distinguishes ethanol (primary) and propan-2-ol (secondary): reagent, observations, conclusion.', '<ul><li><b>Step 1:</b> warm each alcohol with <b>acidified potassium dichromate</b> (K₂Cr₂O₇/H⁺) and distil off the product as it forms. Both turn the solution from orange to green (both are oxidised).</li><li><b>Step 2:</b> test each distillate with <b>Tollens’ reagent</b> (or Fehling’s solution), warming gently.</li><li><b>Observations:</b> the product from ethanol (ethanal, an aldehyde) gives a <b>silver mirror</b> (or brick-red precipitate with Fehling’s). The product from propan-2-ol (propanone, a ketone) gives <b>no change</b>.</li><li><b>Conclusion:</b> the alcohol that gives a positive aldehyde test is the primary alcohol (ethanol); the other is the secondary alcohol. (A tertiary alcohol would not turn dichromate green at all.)</li></ul>'),
  P('5.2d', 'Two glycine molecules react together. Discuss: type of reaction, product, and a real-life application.', '<ul><li><b>Type:</b> <b>condensation</b> reaction – the –COOH group of one glycine reacts with the –NH₂ group of the other and a molecule of <b>water is eliminated</b>.</li><li><b>Product:</b> a <b>dipeptide</b> (glycylglycine, H₂NCH₂CONHCH₂COOH) containing a <b>peptide (amide) bond</b> –CO–NH–.</li><li><b>Application:</b> this is how cells build <b>proteins</b> (enzymes, muscle, hair, haemoglobin) – thousands of amino acids are joined by peptide bonds in condensation polymerisation on ribosomes. The reverse (hydrolysis of peptide bonds) is how we digest protein foods into amino acids.</li></ul>', S.dipeptide)
];

SOL['2023'] = [
  H('Strand 1: Atomic Structure, Bonding and Related Properties'),
  P('1.1a', 'Which rule/principle states that an atomic orbital can hold a maximum of two electrons with opposite spins?', ANS('D – Pauli exclusion principle')),
  P('1.1b', 'Identify the atoms or ions: (i) 1s²2s²2p⁶3s²3p⁶4s¹ (ii) 1s²2s²2p⁶3s²3p⁶3d¹⁰', ANS('(i) K (potassium atom, 19 e⁻) &nbsp; (ii) Zn²⁺ (or Cu⁺, Ga³⁺) – 28 e⁻ with no 4s electrons')),
  P('1.1c', 'Using EN values H 2.1, C 2.5, N 3.0, O 3.5, arrange C–H, C–N, C–O, N–H, O–H in order of increasing polarity.', '<p>ΔEN: C–H = 0.4; C–N = 0.5; N–H = 0.9; C–O = 1.0; O–H = 1.4</p>' + ANS('C–H < C–N < N–H < C–O < O–H')),
  P('1.1d', 'Suggest why ice is less dense than water and a positive use of this property for the environment, referring to the arrangement of molecules.', '<ul><li>In <b>liquid water</b>, hydrogen bonds constantly break and re-form, so molecules can move close together.</li><li>In <b>ice</b>, each H₂O molecule forms <b>four hydrogen bonds</b> in a rigid, <b>open hexagonal lattice</b>. This holds the molecules further apart, leaving empty space, so ice has a lower density (0.92 g/cm³) than water (1.00 g/cm³) and floats.</li><li><b>Environmental benefit:</b> ice forms on the surface of lakes and seas and acts as an <b>insulating layer</b>, so the water underneath does not freeze solid – fish and other aquatic life survive the winter.</li></ul>'),
  P('1.2a', 'The half-life of carbon-14 is 5730 years. Define half-life.', ANS('Half-life is the time taken for half of the radioactive nuclei (atoms) in a sample to decay, i.e. for the mass or activity to fall to half its initial value.'), D.decay(5730, 'years')),
  P('1.2b', 'Compare and contrast fusion and fission in terms of safety and ability to achieve as practical energy sources.', '<table><tr><th></th><th>Fission</th><th>Fusion</th></tr><tr><td>Process</td><td>heavy nucleus (U-235) splits</td><td>light nuclei (²H, ³H) join</td></tr><tr><td>Practicality</td><td><b>Achieved</b> – used in nuclear power stations worldwide; controlled chain reaction</td><td><b>Not yet practical</b> – needs ~100 million °C and huge pressure; experimental reactors use more energy than they produce</td></tr><tr><td>Safety</td><td>Risk of <b>meltdown</b> (Chernobyl, Fukushima); produces <b>long-lived radioactive waste</b>; fuel can be used for weapons</td><td><b>Safer</b> – reaction stops if conditions fail (no runaway chain reaction); product is mainly helium, little long-lived waste</td></tr><tr><td>Fuel</td><td>uranium – limited</td><td>deuterium from seawater – almost unlimited</td></tr></table><p><b>Similarities:</b> both release very large amounts of energy from a small mass (E = mc²) and produce no CO₂.</p>'),
  P('1.3a', 'State the general trend in atomic radii of the first-row transition metals across the period.', ANS('The atomic radii decrease only slightly / remain fairly constant from Sc to Zn (slight increase at Cu and Zn).') + '<p>Extra electrons enter the inner 3d sub-shell, which shields the outer 4s electrons from the increasing nuclear charge, so the radius changes very little.</p>'),
  P('1.3b', 'For [Zn(OH)₄]²⁻: (i) state the coordination number, (ii) identify the ligand.', ANS('(i) 4 &nbsp;&nbsp; (ii) hydroxide ion, OH⁻')),
  P('1.3c', 'Account for the oxygen-carrying ability of haemoglobin, referring to the structure of the haem group and O₂ and the bonding involved.', '<ul><li>The haem group has an <b>Fe²⁺ ion</b> at the centre of a flat porphyrin ring. Fe²⁺ is bonded to <b>four N atoms</b> of the ring by <b>dative (coordinate) bonds</b>; a fifth bond is to an N of the protein (histidine).</li><li>The <b>sixth coordination position is free</b>. O₂ has lone pairs on its O atoms, so it acts as a <b>ligand</b> and donates a lone pair to Fe²⁺, forming a dative bond (oxyhaemoglobin, octahedral complex).</li><li>This bond is <b>weak and reversible</b>: in the lungs (high O₂) O₂ binds; in the tissues (low O₂) it is released. This is possible because Fe is a transition metal with vacant d orbitals and can form complex ions.</li><li>Carbon monoxide binds to the same site much more strongly, blocking O₂ transport – CO poisoning.</li></ul>'),
  H('Strand 2: Thermochemistry and Chemistry in the Society'),
  P('2.1a', 'Which is true about the entropy of 2N₂O₅(g) → 4NO₂(g) + O₂(g)?', ANS('B – The entropy increases.') + '<p>2 mol of gas → 5 mol of gas: more particles, more disorder (ΔS > 0).</p>'),
  P('2.1b', '100.0 mL 0.500 M HCl + 100.0 mL 0.500 M NaOH, T from 22.50 to 25.86 °C; density 1.00 g/mL, c = 4.184 J/g°C. Calculate ΔH in kJ/mol.', '<p>Mass of solution = 200.0 mL × 1.00 g/mL = 200.0 g; ΔT = 25.86 − 22.50 = 3.36 °C</p><p>q = mcΔT = 200.0 × 4.184 × 3.36 = 2812 J = 2.812 kJ</p><p>n(H₂O formed) = n(HCl) = 0.1000 L × 0.500 mol/L = 0.0500 mol</p><p>ΔH = −q / n = −2.812 / 0.0500</p>' + ANS('ΔH = −56.2 kJ mol⁻¹ (exothermic)')),
  P('2.1c', 'Construct a labelled Born–Haber cycle for NaI(s) and calculate its lattice energy. Data: ΔfH −406, ΔatH(Na) +107, IE(Na) +494, ΔatH(I) +106, EA(I) −313 kJ/mol.', '<p>By Hess’s law: ΔfH = ΔatH(Na) + ΔatH(I) + IE(Na) + EA(I) + ΔlattH</p><p>−406 = 107 + 106 + 494 + (−313) + ΔlattH<br>−406 = 394 + ΔlattH</p>' + ANS('ΔlattH (formation of lattice) = −800 kJ mol⁻¹') + '<p>(As lattice dissociation energy, NaI(s) → Na⁺(g) + I⁻(g), the value is +800 kJ mol⁻¹.)</p>', D.bornHaber()),
  H('Strand 3: Aqueous Equilibrium Systems'),
  P('3.1a', 'NH₄Cl(s) ⇌ NH₃(g) + HCl(g). What aspect of the equation indicates that the reaction is reversible?', ANS('C – The ⇌ symbol between the reactant and products.')),
  P('3.1b', 'Glucose dissolves in water but the solution does not conduct electricity. Glucose is a …', ANS('A – non-electrolyte')),
  P('3.1c', '25.00 mL of 0.100 M HCl titrated with 0.100 M NaOH. Calculate the pH after 12.50 mL NaOH is added.', '<p>n(HCl) = 0.02500 × 0.100 = 2.500 × 10⁻³ mol<br>n(NaOH) = 0.01250 × 0.100 = 1.250 × 10⁻³ mol<br>Excess H⁺ = 1.250 × 10⁻³ mol; total volume = 37.50 mL = 0.03750 L</p><p>[H⁺] = 1.250 × 10⁻³ / 0.03750 = 0.0333 M → pH = −log(0.0333)</p>' + ANS('pH = 1.48'), D.curveStrong()),
  P('3.1d', 'pKa: CH₃COOH 4.76, HCN 9.40, HOCl 7.53. Rank in increasing acid strength and explain.', ANS('HCN < HOCl < CH₃COOH') + '<p>pKa = −log Ka, so a <b>smaller pKa means a larger Ka</b>. A larger Ka means the acid <b>dissociates (ionises) more</b> in water, producing more H₃O⁺, so it is a stronger acid. CH₃COOH (smallest pKa) dissociates most; HCN (largest pKa) dissociates least. All three are weak acids.</p>'),
  P('3.1e', 'Account for the ability of the H₂CO₃ / HCO₃⁻ buffer to keep blood at pH ≈ 7.4, with equations, and its importance to health.', '<p>Equilibrium: H₂CO₃(aq) + H₂O(ℓ) ⇌ HCO₃⁻(aq) + H₃O⁺(aq) (H₂CO₃ forms from CO₂ + H₂O)</p><ul><li><b>Acid added</b> (e.g. lactic acid during exercise): the base HCO₃⁻ removes H₃O⁺: HCO₃⁻ + H₃O⁺ → H₂CO₃ + H₂O. Equilibrium shifts left; excess H₂CO₃ breaks down to CO₂, which is breathed out.</li><li><b>Base added:</b> the weak acid H₂CO₃ neutralises OH⁻: H₂CO₃ + OH⁻ → HCO₃⁻ + H₂O.</li><li>Because both the acid and its conjugate base are present in large amounts, [H₃O⁺] hardly changes, keeping pH within 7.35–7.45.</li><li><b>Importance:</b> enzymes and proteins only work in this narrow range. A pH below 7.35 (acidosis) or above 7.45 (alkalosis) causes illness, coma and can be fatal.</li></ul>'),
  P('3.2a', 'List two ways through which the solubility of a gas can be decreased in a liquid.', '<ul><li>Increase the temperature of the liquid.</li><li>Decrease the pressure of the gas above the liquid.</li></ul>'),
  P('3.2b', 'PbI₂(s) ⇌ Pb²⁺ + 2I⁻. In which solution is PbI₂ less soluble: Ba(NO₃)₂(aq) or Pb(NO₃)₂(aq)? Explain using Le Châtelier’s principle.', ANS('Pb(NO₃)₂(aq)') + '<p>Pb(NO₃)₂ supplies <b>Pb²⁺, a common ion</b>. Increasing [Pb²⁺] disturbs the equilibrium; by Le Châtelier’s principle the system shifts to the <b>left</b> to use up the extra Pb²⁺, forming more solid PbI₂. So less PbI₂ dissolves (common ion effect). Ba(NO₃)₂ has no ion in common with PbI₂, so it has little effect.</p>'),
  P('3.2c', 'Will BaSO₄ precipitate if 10.0 mL of 2.0 × 10⁻⁴ M Na₂SO₄ is added to 100.0 mL of 3.2 × 10⁻⁴ M BaCl₂? Ksp = 1.08 × 10⁻¹⁰.', '<p>BaSO₄(s) ⇌ Ba²⁺(aq) + SO₄²⁻(aq); Ksp = [Ba²⁺][SO₄²⁻]</p><p>Total volume = 110.0 mL<br>[Ba²⁺] = 3.2 × 10⁻⁴ × 100.0/110.0 = 2.91 × 10⁻⁴ M<br>[SO₄²⁻] = 2.0 × 10⁻⁴ × 10.0/110.0 = 1.82 × 10⁻⁵ M</p><p>Ionic product IP = (2.91 × 10⁻⁴)(1.82 × 10⁻⁵) = 5.3 × 10⁻⁹</p>' + ANS('IP (5.3 × 10⁻⁹) > Ksp (1.08 × 10⁻¹⁰), so BaSO₄ WILL precipitate.')),
  H('Strand 4: Oxidation–Reduction Processes'),
  P('4.1a', 'Ag/AgNO₃ and Pb/Pb(NO₃)₂ galvanic cell; electrons flow from Pb to Ag. Indicate (i) the cathode, (ii) the direction anions flow.', ANS('(i) The silver (Ag) electrode is the cathode. &nbsp; (ii) Anions (NO₃⁻) in the salt bridge flow towards the lead (Pb) half-cell (the anode).') + '<p>Electrons arrive at the cathode where Ag⁺ + e⁻ → Ag. At the anode Pb → Pb²⁺ + 2e⁻ adds positive ions, so anions move there to balance the charge.</p>', D.cell({ L: { m: 'Pb', s: 'Pb(NO₃)₂(aq)' }, R: { m: 'Ag', s: 'AgNO₃(aq)' } })),
  P('4.1b', 'Mg in 1.0 M Mg(NO₃)₂ and Ag in 1.0 M AgNO₃. Write the cell reaction and calculate E°cell. Ag⁺/Ag +0.80 V; Mg²⁺/Mg −2.37 V.', '<p>Ag⁺ has the more positive E° → reduced (cathode). Mg is oxidised (anode).<br>Anode: Mg → Mg²⁺ + 2e⁻ &nbsp; Cathode: 2Ag⁺ + 2e⁻ → 2Ag</p>' + ANS('Cell reaction: Mg(s) + 2Ag⁺(aq) → Mg²⁺(aq) + 2Ag(s)<br>E°cell = E°cathode − E°anode = 0.80 − (−2.37) = +3.17 V') + '<p>(E° values are not multiplied by 2.)</p>'),
  H('Strand 5: Organic Chemistry'),
  P('5.1a', 'Identify the functional group in CH₃CH₂C(=O)CH₂CH(CH₃)CH₃.', ANS('Ketone (carbonyl group, C=O, within the chain)') + '<p>The compound is 5-methylhexan-3-one.</p>', S.ketone23),
  P('5.1b', 'Given 1,2-dichlorobenzene, draw its other possible isomers and name them.', ANS('1,3-dichlorobenzene and 1,4-dichlorobenzene'), D.benz({ 1: 'Cl', 3: 'Cl' }, '1,3-dichlorobenzene') + D.benz({ 1: 'Cl', 4: 'Cl' }, '1,4-dichlorobenzene')),
  P('5.2a', 'In CH₃CH₂Br + OH⁻ → CH₃CH₂OH + Br⁻, the OH⁻ ion is acting as …', ANS('C – a nucleophile')),
  P('5.2b', 'Draw any two possible products of the dehydration of butan-2-ol (conc. H₂SO₄).', ANS('but-1-ene, CH₂=CHCH₂CH₃ &nbsp; and &nbsp; but-2-ene, CH₃CH=CHCH₃ (cis or trans)') + '<p>Water is eliminated using the OH on C2 and an H from either C1 or C3.</p>', D.sf(['CH2 = CH - CH2 - CH3']) + D.sf(['CH3 - CH = CH - CH3'])),
  P('5.2c', 'Benzene + Br₂ (anhydrous FeBr₃) → X + HBr; benzene + Y (AlCl₃) → methylbenzene + HCl. Draw X and name Y.', ANS('X = bromobenzene, C₆H₅Br &nbsp;&nbsp; Y = chloromethane, CH₃Cl') + '<p>Both are electrophilic substitution reactions (halogenation and Friedel–Crafts alkylation).</p>', D.benz({ 1: 'Br' }, 'X: bromobenzene')),
  P('5.2d', 'Define the term biodegradable polymer.', ANS('A biodegradable polymer is a polymer that can be broken down by microorganisms (bacteria, fungi) and natural processes into small, harmless substances such as CO₂, water and biomass.') + '<p>e.g. poly(lactic acid) – its ester links can be hydrolysed.</p>', S.pla),
  P('5.2e', 'Compare and contrast hydrolysis of an ester (ethyl ethanoate) under reflux with (i) excess water + strong-acid catalyst, (ii) base (aq NaOH).', '<table><tr><th></th><th>(i) Acid hydrolysis</th><th>(ii) Base hydrolysis</th></tr><tr><td>Conditions</td><td>heat under reflux with excess water and dilute H₂SO₄ (H⁺ catalyst)</td><td>heat under reflux with aqueous NaOH (reactant, not catalyst)</td></tr><tr><td>Equation</td><td>CH₃COOC₂H₅ + H₂O ⇌ CH₃COOH + C₂H₅OH</td><td>CH₃COOC₂H₅ + NaOH → CH₃COO⁻Na⁺ + C₂H₅OH</td></tr><tr><td>Products</td><td>carboxylic acid (ethanoic acid) + alcohol (ethanol)</td><td>carboxylate salt (sodium ethanoate) + alcohol (ethanol)</td></tr><tr><td>Extent</td><td><b>reversible</b> – equilibrium, incomplete (excess water pushes it right)</td><td><b>irreversible</b> – goes to completion</td></tr></table><p><b>Similarities:</b> both break the ester link, both need heat under reflux and both produce ethanol. Base hydrolysis of fats is saponification (soap making).</p>'),
  P('5.2f', 'Account for the exceptional strength of Kevlar by referring to its structure and bonding.', '<ul><li>Kevlar is a <b>polyamide</b> made from benzene-1,4-dicarboxylic acid and benzene-1,4-diamine; the chain contains rigid <b>benzene rings</b> linked by amide groups –CO–NH–.</li><li>The para (1,4) links and flat rings make the chains <b>long, straight and rigid</b>, so they line up <b>parallel</b> and pack closely (highly crystalline).</li><li><b>Strong hydrogen bonds</b> form between the C=O of one chain and the N–H of the neighbouring chain, holding chains together in strong sheets; the sheets are also attracted by π–π stacking of the rings.</li><li>The <b>strong covalent bonds along the chain</b> plus many intermolecular hydrogen bonds make it very strong (5× stronger than steel by weight) and heat resistant – used in bullet-proof vests, cut-resistant gloves, tyres and fire-proof clothing.</li></ul>', S.kevlar)
];

SOL['2022'] = [

  P('1.1b', 'According to VSEPR, which is correct about repulsion of electron pairs?', ANS('A – Lone pair–lone pair is greater than lone pair–bond pair')),
  P('1.1c', 'Explain how the polarity of ammonia is determined by its shape.', '<ul><li>Each N–H bond is polar because N is more electronegative than H (N δ−, H δ+).</li><li>NH₃ has 3 bonding pairs and 1 lone pair → <b>trigonal pyramidal</b> shape, which is not symmetrical.</li><li>The bond dipoles all point partly towards N and <b>do not cancel</b>, so there is a <b>net dipole</b> towards the N/lone pair: NH₃ is polar. (Compare BF₃, trigonal planar and symmetrical, where the dipoles cancel → non-polar.)</li></ul>', D.nh3()),
  P('1.1d', 'Explain the trend in boiling points of HF, HCl, HBr and HI with molecular mass, referring to IMFs.', '<ul><li><b>HCl → HBr → HI:</b> boiling point increases as molar mass increases. The molecules have more electrons and are larger, so <b>London dispersion forces become stronger</b> (permanent dipole–dipole forces are also present but decrease slightly). More energy is needed to separate the molecules.</li><li><b>HF</b> has the lowest molar mass but the <b>highest boiling point (19.5 °C)</b>. F is very small and highly electronegative, so HF molecules form strong <b>hydrogen bonds</b>, which are much stronger than the dispersion/dipole forces in the other hydrogen halides.</li></ul>', D.hxBoil()),
  P('1.2a', 'Define fusion reaction.', ANS('A nuclear reaction in which two light nuclei join (fuse) together to form a heavier nucleus, releasing a large amount of energy.') + '<p>e.g. ²H + ³H → ⁴He + ¹n, in the Sun.</p>'),
  P('1.2b', 'Complete the beta decay of carbon-14: ¹⁴₆C → ? + ⁰₋₁e', ANS('¹⁴₆C → ¹⁴₇N + ⁰₋₁e') + '<p>Mass number: 14 = 14 + 0. Atomic number: 6 = 7 + (−1).</p>'),
  P('1.2c', 'Evaluate alpha, beta and gamma radiation in terms of penetration and real-life application.', '<ul><li><b>Alpha (⁴₂He, +2):</b> least penetrating – stopped by paper or skin, travels a few cm in air; most ionising. Use: <b>smoke detectors</b> (Am-241) – the α particles ionise air to carry a current, smoke blocks them and triggers the alarm. Safe outside the body but very dangerous if swallowed/inhaled.</li><li><b>Beta (⁰₋₁e, −1):</b> medium penetration – stopped by a few mm of aluminium. Use: <b>thickness gauges</b> for paper, plastic and metal foil (the amount of β passing through depends on thickness); tracers; treating some cancers.</li><li><b>Gamma (γ, no mass or charge):</b> most penetrating – only reduced by thick lead or concrete; least ionising. Uses: <b>radiotherapy</b> (Co-60) to kill cancer cells, <b>sterilising</b> medical equipment and food, medical tracers (Tc-99m) and detecting pipe leaks.</li></ul><p><b>Evaluation:</b> the choice of radiation depends on how far it must travel and how much ionisation is needed; all must be used with shielding and minimum exposure.</p>', D.penetration()),
  P('1.3a', 'Name [CuCl₄]²⁻ using IUPAC nomenclature.', ANS('Tetrachlorocuprate(II) ion (tetrachloridocuprate(II))')),
  P('1.3b', 'List two factors that enable Cu to form coloured complexes.', '<ul><li>Cu²⁺ has a <b>partially filled d sub-shell</b> (3d⁹).</li><li><b>Ligands split the d orbitals</b> into different energy levels, so electrons can absorb visible light and jump between them (d–d transitions).</li></ul>'),
  P('1.3c', 'Drops of conc. NH₃ added to CuSO₄(aq): a light blue precipitate forms; with more NH₃ a clear deep blue solution forms. Explain using balanced equations.', '<p><b>Light blue precipitate:</b> ammonia is a weak base and produces OH⁻ ions: NH₃ + H₂O ⇌ NH₄⁺ + OH⁻. These precipitate copper(II) hydroxide:<br>Cu²⁺(aq) + 2OH⁻(aq) → Cu(OH)₂(s)</p><p><b>Deep blue solution:</b> in excess ammonia, NH₃ molecules act as ligands and the precipitate dissolves to form the soluble complex ion tetraamminecopper(II):<br>Cu(OH)₂(s) + 4NH₃(aq) → [Cu(NH₃)₄]²⁺(aq) + 2OH⁻(aq)</p><p>(Overall ligand exchange: [Cu(H₂O)₆]²⁺ + 4NH₃ → [Cu(NH₃)₄(H₂O)₂]²⁺ + 4H₂O.)</p>'),

  P('2.1e', 'Using Hess’s law, calculate ΔcH of Mg (Mg + ½O₂ → MgO) from: MgO + 2HCl → MgCl₂ + H₂O (−74.66); Mg + 2HCl → MgCl₂ + H₂ (−427.99); H₂ + ½O₂ → H₂O (−285.50 kJ).', '<p>Keep eq 2: Mg + 2HCl → MgCl₂ + H₂ &nbsp; −427.99<br>Keep eq 3: H₂ + ½O₂ → H₂O &nbsp; −285.50<br>Reverse eq 1: MgCl₂ + H₂O → MgO + 2HCl &nbsp; +74.66<br>Sum: Mg + ½O₂ → MgO (2HCl, MgCl₂, H₂ and H₂O cancel)</p><p>ΔcH = −427.99 − 285.50 + 74.66</p>' + ANS('ΔcH(Mg) = −638.83 kJ mol⁻¹')),
  H('Strand 3: Aqueous Equilibrium Systems'),
  P('3.1a', 'A buffer is a solution that …', ANS('C – resists a change in pH upon the addition of an acid or base')),
  P('3.1b', 'A basic buffer is made from NH₃ and NH₄Cl. Describe the action of this buffer when HCl is added.', '<p>Equilibrium: NH₃(aq) + H₂O(ℓ) ⇌ NH₄⁺(aq) + OH⁻(aq). The buffer contains large amounts of the weak base NH₃ and its conjugate acid NH₄⁺.</p><p>When HCl is added, the H⁺ (H₃O⁺) ions are removed by the weak base:<br><b>NH₃(aq) + H⁺(aq) → NH₄⁺(aq)</b></p><p>The added H⁺ is converted into the weak acid NH₄⁺, so [H⁺] (and pH) hardly changes. (Equivalently, H⁺ neutralises OH⁻ and the equilibrium shifts right to replace it.)</p>'),

  P('3.1e', 'In a titration of HCl with NaOH (both strong electrolytes), what is the pH at the equivalence point?', ANS('pH = 7') + '<p>The products NaCl and water are neutral; neither ion reacts with water.</p>'),
  P('3.1f', 'CO + Cl₂ ⇌ COCl₂ at 395 °C; [CO] = 0.012, [Cl₂] = 0.025 mol/L; Kc = 1.23 × 10³. Calculate [COCl₂].', '<p>Kc = [COCl₂] / ([CO][Cl₂]) → [COCl₂] = Kc × [CO] × [Cl₂]<br>= 1.23 × 10³ × 0.012 × 0.025</p>' + ANS('[COCl₂] = 0.369 mol L⁻¹ (0.37 M)')),

  P('3.2c', 'State the effect of adding Na₂SO₄ to the CaSO₄ equilibrium on the solubility of CaSO₄.', ANS('The solubility of CaSO₄ decreases (equilibrium shifts left – common ion effect from the added SO₄²⁻).')),
  H('Strand 4: Oxidation–Reduction Reactions'),

  P('4.1b', 'List examples of everyday applications of (i) a galvanic cell, (ii) an electrolytic cell.', '<p><b>(i) Galvanic:</b> dry-cell torch/radio batteries, alkaline batteries, lithium-ion phone batteries (while in use), car lead–acid battery (when starting the car), fuel cells, pacemaker batteries.</p><p><b>(ii) Electrolytic:</b> electroplating (silver/chrome plating, galvanising), refining copper, extracting aluminium and sodium, recharging batteries, electrolysis of brine to make chlorine and NaOH.</p>'),
  H('Strand 5: Organic Chemistry'),
  P('5.1a', 'Name Compound A, CH₃CH₂CH(CH₃)CH₂OH, showing the steps.', '<ol><li>Functional group: –OH → alcohol, suffix “-ol”.</li><li>Longest chain containing the C bonded to –OH: 4 carbons → “butan”.</li><li>Number from the end nearest the –OH: OH on C1 → “butan-1-ol”.</li><li>Substituent: –CH₃ on C2 → “2-methyl”.</li></ol>' + ANS('2-methylbutan-1-ol'), S.compA22),
  P('5.1b', 'Define the term isomer.', ANS('Isomers are compounds that have the same molecular formula but a different arrangement of atoms (different structural formula or spatial arrangement).')),
  P('5.1c', 'Draw the structures of any two isomers of Compound A (C₅H₁₂O).', '<p>Any two of: pentan-1-ol CH₃CH₂CH₂CH₂CH₂OH; pentan-2-ol CH₃CH(OH)CH₂CH₂CH₃; pentan-3-ol CH₃CH₂CH(OH)CH₂CH₃; 3-methylbutan-1-ol (CH₃)₂CHCH₂CH₂OH; 2-methylbutan-2-ol; 2,2-dimethylpropan-1-ol; or an ether such as 1-methoxybutane CH₃OCH₂CH₂CH₂CH₃ (functional group isomer).</p>', S.pentanol + D.sf(['CH3 - CH - CH2 - CH2 - CH3', '. . | ', '. . OH'])),

  P('5.2b', 'State another suitable reagent to replace Cr₂O₇²⁻/H⁺.', ANS('Acidified potassium permanganate, KMnO₄/H⁺ (MnO₄⁻/H⁺)')),
  P('5.2c', 'Compound B is converted to an acyl chloride. Give a suitable reagent and the structure of the acyl chloride.', ANS('Reagent: SOCl₂ (thionyl chloride) – or PCl₅/PCl₃<br>Product: 2-methylbutanoyl chloride, CH₃CH₂CH(CH₃)COCl') + '<p>CH₃CH₂CH(CH₃)COOH + SOCl₂ → CH₃CH₂CH(CH₃)COCl + SO₂ + HCl</p>', D.sf(['. . . . . . O', '. . . . . . ‖', 'CH3 - CH2 - CH - C - Cl', '. . . . |', '. . . . CH3'])),
  P('5.2d', 'Methylamine reaction map: Reactant A gives [CH₃NH₃]⁺Cl⁻; Reactant B gives CH₃NHCH₂CH₃ + HBr. Determine A and B.', ANS('Reactant A = hydrogen chloride / hydrochloric acid, HCl<br>Reactant B = bromoethane, CH₃CH₂Br') + '<p>A: CH₃NH₂ + HCl → CH₃NH₃⁺Cl⁻ (amine acting as a base). B: CH₃NH₂ + CH₃CH₂Br → CH₃NHCH₂CH₃ + HBr (nucleophilic substitution forming a secondary amine).</p>'),
  P('5.2e', 'Methylamine + ethanoic acid → Product C + H₂O; methylamine + propanoyl chloride → CH₃NHCOCH₂CH₃ + Product D. Determine C and D.', ANS('Product C = N-methylethanamide, CH₃CONHCH₃<br>Product D = hydrogen chloride, HCl') + '<p>Both reactions form an amide link –CO–NH–.</p>'),
  P('5.2f', 'Describe a laboratory test to distinguish between an aldehyde and a ketone: reagent and observations.', '<ul><li><b>Tollens’ reagent</b> (ammoniacal silver nitrate), warm in a water bath: aldehyde → <b>silver mirror</b> forms on the inside of the test tube; ketone → no change (stays colourless).</li><li>OR <b>Fehling’s/Benedict’s solution</b>, warm: aldehyde → blue solution gives a <b>brick-red precipitate</b> of Cu₂O; ketone → stays blue.</li><li>OR acidified K₂Cr₂O₇, warm: aldehyde → orange to green; ketone → stays orange.</li></ul>'),
  P('5.2g', 'Identify the ester link in the polyester by placing a circle around it.', ANS('The ester link is the –C(=O)–O– group joining the acid part to the alcohol part of each repeating unit.'), S.polyester22),

  P('5.2i', 'Draw the two monomers that form the polyester –[OC–CH₂CH₂CH₂–CO–O–CH₂CH₂CH₂–O]ₙ–.', ANS('Pentanedioic acid, HOOC–CH₂CH₂CH₂–COOH &nbsp; and &nbsp; propane-1,3-diol, HO–CH₂CH₂CH₂–OH'), D.sf(['HOOC - CH2 - CH2 - CH2 - COOH']) + D.sf(['HO - CH2 - CH2 - CH2 - OH'])),
  P('5.2j', 'With an example, discuss aldehydes: functional group, one common reaction with reagent and main product, and an everyday application.', '<ul><li><b>Example:</b> ethanal, CH₃CHO (or methanal, HCHO).</li><li><b>Functional group:</b> the carbonyl group at the end of the chain, –CHO (C=O with an H on the carbon); named with the suffix “-al”.</li><li><b>Reaction:</b> <b>oxidation</b> with acidified K₂Cr₂O₇ (heat under reflux) → ethanoic acid, CH₃COOH (orange → green). Or <b>reduction</b> with NaBH₄ → ethanol. Or the Tollens’ test → silver mirror.</li><li><b>Application:</b> methanal (formaldehyde) solution, formalin, preserves biological specimens and is used to make resins/plastics (e.g. Bakelite, plywood glue) and disinfectants; ethanal is used to make ethanoic acid; vanillin and cinnamaldehyde are aldehydes used as flavourings.</li><li><b>Impacts:</b> methanal is toxic and a carcinogen, so it must be handled carefully with good ventilation.</li></ul>')
];

function PCL5() {
  var b = '', cx = 120, cy = 95, pts = [[0, -62], [0, 62], [-70, 0], [52, 22], [52, -22]];
  b += D.label('P', cx, cy, 18);
  pts.forEach(function (p, k) {
    var L = Math.sqrt(p[0] * p[0] + p[1] * p[1]), ux = p[0] / L, uy = p[1] / L;
    var x2 = cx + p[0] - ux * 16, y2 = cy + p[1] - uy * 12;
    b += '<line x1="' + (cx + ux * 11) + '" y1="' + (cy + uy * 11) + '" x2="' + x2 + '" y2="' + y2 + '" stroke="currentColor" stroke-width="1.6"/>';
    b += D.label(':Cl:', cx + p[0] + ux * 6, cy + p[1] + uy * 4, 15);
  });
  b += D.txt('5 bonding pairs, no lone pair on P – trigonal bipyramidal', 120, 182, 10);
  return D.svg(250, 192, b);
}

  P('1.5e', 'Name the transition metal in [FeSCN]²⁺.', ANS('Iron, in the +3 oxidation state – iron(III)')),
  H('Strand 2: Energy Changes in Chemical and Physical Processes'),
  P('2.1a', '2257 J changes 1 g of liquid water into gas at its boiling point. Name the enthalpy change.', ANS('Enthalpy of vaporisation (ΔvapH)')),
  P('2.1b', 'Write the thermochemical equation for the process.', '<p>Per mole: 2257 J g⁻¹ × 18.0 g mol⁻¹ = 40 626 J ≈ 40.6 kJ mol⁻¹</p>' + ANS('H₂O(ℓ) → H₂O(g) &nbsp; ΔvapH = +40.6 kJ mol⁻¹ (or +2257 J g⁻¹)')),
  P('2.1c', 'Explain the high enthalpy change observed for the process.', ANS('Water molecules are held together by strong hydrogen bonds (each molecule can form up to four). A lot of energy is needed to overcome all these hydrogen bonds to separate the molecules into gas.')),
  P('2.2', 'Identify the enthalpy for X(g) → Xⁿ⁺(g) + ne⁻.', ANS('Ionisation enthalpy (energy)')),
  P('2.3', 'Describe an exothermic reaction.', ANS('A reaction that releases heat energy to the surroundings, so the temperature of the surroundings rises; the products have less energy than the reactants and ΔH is negative. e.g. combustion, neutralisation, respiration.'), D.profile(true)),
  P('2.4', 'Calculate the enthalpy change when 200 g of lead cools from 30 °C to 15 °C (c = 0.129 J/g°C).', '<p>q = mcΔT = 200 × 0.129 × (15 − 30) = 200 × 0.129 × (−15)</p>' + ANS('q = −387 J (387 J of heat is released)')),
  H('Strand 3: Aqueous Equilibrium Systems'),
  P('3.1a', 'Name the acid HNO₂.', ANS('Nitrous acid')),
  P('3.1b', 'Calculate [H₃O⁺] in 0.010 M HNO₂ (Ka = 5.6 × 10⁻⁴).', '<p>[H₃O⁺] = √(Ka × c) = √(5.6 × 10⁻⁴ × 0.010) = √(5.6 × 10⁻⁶)</p>' + ANS('[H₃O⁺] ≈ 2.4 × 10⁻³ mol L⁻¹ (pH ≈ 2.6)') + '<p>Note: here x is about 24% of c, so the exact quadratic answer is 2.1 × 10⁻³ M – either is accepted with working.</p>'),
  P('3.1c', 'Explain how adding a strong acid (HCl) affects the equilibrium position.', ANS('The equilibrium shifts to the LEFT.') + '<p>HCl adds H₃O⁺, a common ion. By Le Chatelier’s principle the system removes the extra H₃O⁺ by reacting it with NO₂⁻, forming more HNO₂ – so less HNO₂ is ionised.</p>'),
  P('3.2', 'State one feature of an ammonium chloride/ammonium hydroxide buffer.', ANS('It is a basic buffer containing a weak base (NH₃/NH₄OH) and its conjugate acid (NH₄⁺) – it resists changes in pH when small amounts of acid or base are added (pH ≈ 9.25).')),
  P('3.3', 'Define solubility.', ANS('The maximum amount of solute that dissolves in a given amount of solvent at a specified temperature, forming a saturated solution.')),
  P('3.4', '20 mL of 0.02 M CaCl₂ + 20 mL of 0.04 M Na₂SO₄ at 25 °C. The student calculated Q by adding. Determine whether CaSO₄ will precipitate (Ksp = 2.4 × 10⁻⁵).', '<p>The student’s method is wrong – the ion concentrations must be <b>multiplied</b>, not added.</p><p>After mixing (total 40 mL): [Ca²⁺] = 0.02 × 20/40 = 0.01 M; [SO₄²⁻] = 0.04 × 20/40 = 0.02 M</p><p>Q = [Ca²⁺][SO₄²⁻] = 0.01 × 0.02 = 2 × 10⁻⁴</p>' + ANS('Q (2 × 10⁻⁴) > Ksp (2.4 × 10⁻⁵), so a precipitate of CaSO₄ WILL form.')),
  H('Strand 4: Oxidation–Reduction Reactions'),
  P('4.1', 'Define anion.', ANS('An anion is a negatively charged ion (an atom or group of atoms that has gained electrons), e.g. Cl⁻, SO₄²⁻. It moves towards the anode.')),
  P('4.2', 'State one feature of a voltaic cell.', ANS('It converts chemical energy to electrical energy using a spontaneous redox reaction; it has two half-cells joined by a salt bridge and an external wire; oxidation at the negative anode, reduction at the positive cathode; E°cell is positive.')),
  P('4.3', 'Zn²⁺/Zn E° = −0.76 V; Cl₂/Cl⁻ E° = +1.36 V. Explain why Cl₂ is a stronger oxidant than Zn²⁺.', ANS('Cl₂ has a much more positive standard reduction potential (+1.36 V) than Zn²⁺ (−0.76 V), so Cl₂ has a much greater tendency to gain electrons (be reduced). A species that is more easily reduced is a stronger oxidising agent.')),
  P('4.4', 'Discuss one wet cell battery: composition, characteristics and everyday application.', '<ul><li><b>Example:</b> the <b>lead–acid battery</b> (car battery).</li><li><b>Composition:</b> anode (−) = lead, Pb; cathode (+) = lead(IV) oxide, PbO₂; electrolyte = dilute sulfuric acid (liquid). Discharge: Pb + PbO₂ + 2H₂SO₄ → 2PbSO₄ + 2H₂O.</li><li><b>Characteristics:</b> each cell gives about 2 V; six cells in series = 12 V; can deliver a large current; <b>rechargeable</b> (the reaction is reversed by passing current through it – electrolytic cell); heavy; contains toxic lead and corrosive acid, so must be recycled carefully.</li><li><b>Application:</b> starting cars, trucks and boats; storing electricity from solar panels; back-up power (UPS).</li></ul>'),
  H('Strand 5: Organic Chemistry'),
  P('5.1a', 'Define addition polymer.', ANS('A polymer formed when many small unsaturated monomers (with C=C double bonds) join together, the double bonds opening, without the loss of any other molecule.'), S.pvc),
  P('5.1b', 'State one feature of the PVC polymer.', ANS('It is an addition polymer of chloroethene; its chain is a saturated C–C backbone with a Cl atom on every second carbon; repeating unit –CH₂–CHCl–; it is chemically unreactive and non-biodegradable.')),
  P('5.1c', 'Explain one property of PVC by relating to its structure and bonding.', '<p><b>Rigid, strong and harder than polythene:</b> the polar C–Cl bonds create <b>permanent dipole–dipole attractions</b> between neighbouring chains, which are stronger than the dispersion forces in poly(ethene). The chains are held more tightly, so PVC is stiffer – used for water pipes, window frames.</p><p>Also: <b>chemically unreactive/durable</b> because of strong C–C, C–H and C–Cl covalent bonds – resists water, acids and microbes (hence non-biodegradable); <b>electrical insulator</b> because it has no free electrons or ions – used for coating wires.</p>'),
  P('5.2a', 'Define constitutional isomers.', ANS('Constitutional (structural) isomers are compounds with the same molecular formula but different structural formulae (atoms bonded in a different order).')),
  P('5.2b', 'Identify Reaction X, where the –OH of butanoic acid is replaced by –Cl (SOCl₂).', ANS('Substitution (chlorination) – forming the acyl chloride butanoyl chloride') + '<p>CH₃CH₂CH₂COOH + SOCl₂ → CH₃CH₂CH₂COCl + SO₂ + HCl</p>'),
  P('5.2c', 'Describe the conditions for Reaction Z (hydrolysis of ethyl butanoate, Compound C) and name Compound B.', ANS('Conditions: heat under reflux with water and a dilute acid catalyst (e.g. dilute H₂SO₄) – or with aqueous NaOH<br>Compound B: ethanol, CH₃CH₂OH') + '<p>CH₃CH₂CH₂COOCH₂CH₃ + H₂O ⇌ CH₃CH₂CH₂COOH + CH₃CH₂OH</p>'),
  P('5.3', 'Describe the reaction condition and draw the alcohol formed when propanone is reduced.', ANS('Condition: sodium borohydride (NaBH₄) in water/methanol, then acidify (H₃O⁺) – or LiAlH₄ in dry ether<br>Product: propan-2-ol, CH₃CH(OH)CH₃'), S.propan2ol),
  P('5.4', 'Discuss one reaction of amines and its application to real life, with equations.', '<p><b>Amines as bases – reaction with acids:</b></p><ul><li>The lone pair on N accepts a proton: CH₃NH₂(aq) + HCl(aq) → CH₃NH₃⁺Cl⁻(aq) (methylammonium chloride).</li><li>Amines dissolve in water to give alkaline solutions: CH₃NH₂ + H₂O ⇌ CH₃NH₃⁺ + OH⁻.</li><li><b>Application:</b> many drugs are amines (e.g. antihistamines, local anaesthetics). They are converted into their ammonium chloride salts so they are <b>soluble in water</b> and stable, making them easier to take as tablets or injections. Lemon juice/vinegar removes fishy smells from fish because the acid converts smelly volatile amines into odourless salts.</li></ul><p>(Alternative: amine + acyl chloride → amide, used to make nylon and paracetamol.)</p>')
];

SOL['2018'] = [
  H('Strand 1: Atomic Structure and Bonding and Related Properties'),
  P('1.1a', 'Define polarity.', ANS('Polarity is the uneven distribution of electron density (charge) in a bond or molecule, caused by a difference in electronegativity, giving partial positive (δ+) and partial negative (δ−) ends (a dipole).')),
  P('1.1b', 'State the shape of trichloromethane, CHCl₃.', ANS('Tetrahedral')),
  P('1.1c', 'Identify the IMF responsible for the low boiling point of methane.', ANS('London dispersion (van der Waals / temporary induced dipole) forces – methane is non-polar.')),
  P('1.1d', 'Boiling points increase CH₄ (−161.5) → CH₃Cl (−24.2) → CH₂Cl₂ (39.8) → CHCl₃ (61.7 °C). Explain why the greatest increase is between CH₄ and CH₃Cl.', '<ul><li>CH₄ is <b>non-polar</b> – only weak dispersion forces.</li><li>Replacing one H with Cl makes CH₃Cl <b>polar</b>: the polar C–Cl bond gives the molecule a permanent dipole, so <b>permanent dipole–dipole forces</b> appear for the first time. Cl also adds many electrons, greatly increasing dispersion forces.</li><li>This change from only dispersion forces to dispersion + dipole–dipole forces needs much more energy to overcome, so the largest jump occurs here. Further Cl atoms increase dispersion forces, but the type of force does not change, so later increases are smaller.</li></ul>'),
  P('1.2', 'Na⁺, Mg²⁺ and Al³⁺ have the same number of electrons. Describe the trend in their ionic radii.', ANS('Ionic radius decreases: Na⁺ > Mg²⁺ > Al³⁺.') + '<p>They are isoelectronic (10 electrons, configuration 1s²2s²2p⁶), but the nuclear charge increases (11, 12, 13 protons), so the same electrons are pulled closer to the nucleus.</p>'),
  P('1.3a', 'Define nuclear fission.', ANS('Nuclear fission is the splitting of a heavy unstable nucleus into two smaller nuclei (usually after absorbing a neutron), releasing neutrons and a large amount of energy.')),
  P('1.3b', '²³⁸₉₂U + X → ²³⁹₉₄Pu + 2 ⁰₋₁e. Identify X.', '<p>Mass: 238 + A = 239 + 0 → A = 1. Charge: 92 + Z = 94 + 2(−1) = 92 → Z = 0.</p>' + ANS('X = a neutron, ¹₀n')),
  P('1.3c', 'State one property of high-speed electrons (beta particles).', ANS('Charge −1 and negligible mass; medium penetration (stopped by a few mm of aluminium); medium ionising power; deflected towards the positive plate in an electric field.')),
  P('1.3d', 'Discuss one everyday use of nuclear chemistry relating the properties of the radiation to the use; compare advantages and disadvantages and determine its overall value.', '<p><b>Use – radiotherapy (cancer treatment) with cobalt-60 gamma rays.</b></p><ul><li><b>Link to properties:</b> γ rays are highly penetrating, so they can reach a tumour deep in the body; their energy ionises and damages the DNA of cancer cells so they die. Beams are aimed from different angles so the tumour gets a high dose while healthy tissue gets less.</li><li><b>Advantages:</b> destroys tumours without surgery; can cure or control many cancers; painless; precise.</li><li><b>Disadvantages:</b> healthy cells near the tumour are also damaged – side effects such as tiredness, hair loss, nausea; risk of radiation exposure to staff; sources must be stored and disposed of safely; expensive equipment.</li><li><b>Overall value:</b> the benefit of saving lives far outweighs the risks when doses are carefully controlled – radiotherapy is of great value to human life.</li></ul><p>(Other acceptable uses: carbon-14 dating, smoke detectors, tracers, sterilising, nuclear power.)</p>'),
  P('1.4a', 'What are the three characteristic properties of transition elements?', '<ul><li>Variable oxidation states</li><li>Form coloured ions/compounds</li><li>Form complex ions</li></ul><p>(Also: act as catalysts.)</p>'),
  P('1.4b', 'Write the electron configuration of ⁶⁴₂₉Cu²⁺ using s, p, d notation.', ANS('Cu²⁺ = 1s² 2s² 2p⁶ 3s² 3p⁶ 3d⁹') + '<p>Cu = [Ar]3d¹⁰4s¹; remove the 4s electron and one 3d electron.</p>'),
  P('1.4c', 'State the colour of [CuCl₄]²⁻.', ANS('Yellow-green (green)')),

  P('1.4f', 'Write the balanced equation for the formation of [Ag(NH₃)₂]⁺.', ANS('Ag⁺(aq) + 2NH₃(aq) → [Ag(NH₃)₂]⁺(aq)')),
  P('1.4g', 'Describe the colour change and observations that confirm [Ag(NH₃)₂]⁺ has formed.', ANS('On adding ammonia to colourless AgNO₃(aq), a brown precipitate (Ag₂O) forms first; on adding excess ammonia the precipitate dissolves to give a clear, colourless solution of [Ag(NH₃)₂]⁺.')),
  H('Strand 2: Energy Changes in Chemical and Physical Processes'),
  P('2.1', 'Name the enthalpy change for Na(g) → Na⁺(g) + e⁻.', ANS('First ionisation enthalpy (energy) of sodium')),
  P('2.2a', 'Write the thermochemical equation for the complete combustion of propane, C₃H₈.', ANS('C₃H₈(g) + 5O₂(g) → 3CO₂(g) + 4H₂O(ℓ) &nbsp; ΔcH = −2220 kJ mol⁻¹') + '<p>(Any negative ΔcH value is accepted if no data is given; the accepted value is about −2220 kJ/mol.)</p>'),
  P('2.2b', 'Write the symbol for the enthalpy change of this reaction.', ANS('ΔcH (ΔcH°)')),
  P('2.2c', 'Describe how using propane gas for cooking is an exothermic reaction.', ANS('Burning propane releases heat energy to the surroundings (the pot and food), so the temperature of the surroundings rises. Less energy is used breaking bonds in C₃H₈ and O₂ than is released forming bonds in CO₂ and H₂O, so ΔH is negative.')),
  P('2.3', 'C₂H₅OH → C₂H₄ + H₂O. Calculate ΔH using bond enthalpies: O–H 464, C–H 414, C–C 347, C–O 352, C=C 598 kJ/mol.', '<p><b>Bonds broken</b> (in C₂H₅OH): 5 C–H + 1 C–C + 1 C–O + 1 O–H<br>= 5(414) + 347 + 352 + 464 = 2070 + 347 + 352 + 464 = 3233 kJ</p><p><b>Bonds formed</b> (C₂H₄ + H₂O): 4 C–H + 1 C=C + 2 O–H<br>= 4(414) + 598 + 2(464) = 1656 + 598 + 928 = 3182 kJ</p><p>ΔH = Σbroken − Σformed = 3233 − 3182</p>' + ANS('ΔH = +51 kJ mol⁻¹ (endothermic)')),
  P('2.4', 'Describe the energy change during bond breaking and bond formation.', ANS('Bond breaking absorbs energy (endothermic, energy taken in to overcome attraction between atoms). Bond formation releases energy (exothermic). The overall ΔH of a reaction is the difference between the two.')),
  H('Strand 3: Aqueous Equilibrium Systems'),
  P('3.1a', 'Calculate the pH of 0.017 M acetic acid, Ka = 1.74 × 10⁻⁵. Show all working.', '<p>CH₃COOH ⇌ CH₃COO⁻ + H⁺; Ka = [CH₃COO⁻][H⁺]/[CH₃COOH] ≈ x²/0.017</p><p>x² = 1.74 × 10⁻⁵ × 0.017 = 2.96 × 10⁻⁷<br>x = [H⁺] = 5.44 × 10⁻⁴ M</p>' + ANS('pH = −log(5.44 × 10⁻⁴) = 3.26')),
  P('3.1b', 'Define common ion effect.', ANS('The common ion effect is the decrease in the ionisation of a weak electrolyte (or the solubility of a sparingly soluble salt) when a strong electrolyte containing one of the same ions is added – the equilibrium shifts to remove the added ion.') + '<p>e.g. adding CH₃COONa to CH₃COOH increases [CH₃COO⁻], shifting equilibrium left, so [H⁺] falls and pH rises.</p>'),
  P('3.2a', 'Write the equilibrium constant expression for N₂ + 3H₂ ⇌ 2NH₃.', ANS('Kc = [NH₃]² / ([N₂][H₂]³)')),
  P('3.2b', 'State the effect on K if temperature is increased (ΔH = −90 kJ/mol).', ANS('K decreases.') + '<p>The forward reaction is exothermic, so increasing temperature favours the reverse (endothermic) reaction; equilibrium shifts left and K becomes smaller.</p>'),
  P('3.3', 'Discuss (i) the nature of species in solution and how it affects conductivity, and (ii) the relative concentrations of species and how they affect pH. Give examples with equations.', '<p><b>(i) Nature of species and conductivity</b></p><ul><li><b>Strong electrolytes</b> dissociate completely into ions, so solutions conduct well: NaCl(s) → Na⁺(aq) + Cl⁻(aq); HCl + H₂O → H₃O⁺ + Cl⁻.</li><li><b>Weak electrolytes</b> only partly ionise, so there are few ions and they conduct poorly: CH₃COOH + H₂O ⇌ CH₃COO⁻ + H₃O⁺; NH₃ + H₂O ⇌ NH₄⁺ + OH⁻.</li><li><b>Non-electrolytes</b> dissolve as molecules – no ions, no conduction (glucose, ethanol).</li></ul><p><b>(ii) Relative concentrations and pH</b></p><ul><li>pH depends on [H₃O⁺] (pH = −log[H₃O⁺]). In water, [H₃O⁺] = [OH⁻] = 10⁻⁷ M, pH 7 (Kw = 1 × 10⁻¹⁴).</li><li>If [H₃O⁺] > [OH⁻] the solution is acidic (pH < 7); if [OH⁻] > [H₃O⁺] it is alkaline (pH > 7).</li><li>At the same concentration (0.1 M), a strong acid such as HCl gives [H₃O⁺] = 0.1 M, pH 1; the weak acid CH₃COOH gives [H₃O⁺] ≈ 1.3 × 10⁻³ M, pH 2.9 – higher pH and lower conductivity because fewer ions are present.</li><li>Salts can change pH: CH₃COONa is basic (CH₃COO⁻ + H₂O ⇌ CH₃COOH + OH⁻); NH₄Cl is acidic (NH₄⁺ + H₂O ⇌ NH₃ + H₃O⁺).</li></ul>'),
  H('Strand 4: Oxidation–Reduction Reactions'),
  P('4.1a', 'What is a galvanic cell?', ANS('An electrochemical cell that produces electrical energy from a spontaneous redox reaction, with oxidation and reduction occurring in two separate half-cells connected by a wire and a salt bridge.')),
  P('4.1b', 'Name one feature on the diagram that identifies the set-up as a galvanic cell.', ANS('A voltmeter (or bulb) instead of a battery/power supply; a salt bridge connecting two separate half-cells, each with a different metal in a solution of its own ions.')),
  P('4.1c', 'How is this set-up different from an electrolytic cell?', ANS('An electrolytic cell has an external power supply (battery) that forces a non-spontaneous reaction to occur (electrical → chemical energy), usually in a single container of electrolyte, with the anode positive and cathode negative. The galvanic cell produces its own electricity (chemical → electrical) with a negative anode and positive cathode.')),
  P('4.1d', 'E° Cu²⁺/Cu = +0.34 V, Al³⁺/Al = −1.66 V. Write the IUPAC cell notation.', ANS('Al(s) | Al³⁺(aq) ‖ Cu²⁺(aq) | Cu(s)')),
  P('4.1e', 'Calculate E° of the cell and determine whether it is spontaneous.', '<p>E°cell = E°cathode − E°anode = 0.34 − (−1.66)</p>' + ANS('E°cell = +2.00 V – positive, so the cell reaction is spontaneous: 2Al + 3Cu²⁺ → 2Al³⁺ + 3Cu')),
  H('Strand 5: Organic Chemistry'),
  P('5.1a', 'What is an enantiomer?', ANS('One of a pair of optical isomers that are non-superimposable mirror images of each other, containing a chiral carbon atom (bonded to four different groups).')),
  P('5.1b', '(CH₃)₂CH–CHBr–CH₃ with alcoholic KOH gives two alkenes; A (3-methylbut-1-ene, drawn) is labelled major. Draw and name the minor compound B.', ANS('B = 2-methylbut-2-ene, (CH₃)₂C=CH–CH₃') + '<p>H is removed from the carbon on the other side of C–Br. (Note: by Zaitsev’s rule the more substituted alkene, 2-methylbut-2-ene, is normally the major product in practice; follow the paper’s labelling.)</p>', D.sf(['CH3 - C = CH - CH3', '. . |', '. . CH3']) + S.bromo18),
  P('5.1c', 'Identify Reaction Y (alcoholic KOH).', ANS('Elimination (dehydrohalogenation – HBr is removed)')),
  P('5.1d', 'Name Reaction X (Compound C + acidified KMnO₄) and draw the structure of Compound E.', ANS('Reaction X: oxidation<br>Compound C = 3-methylbutan-2-ol (secondary alcohol, from aqueous NaOH)<br>Compound E = 3-methylbutan-2-one, CH₃COCH(CH₃)₂ (a ketone)'), D.sf(['. . O', '. . ‖', 'CH3 - C - CH - CH3', '. . . . |', '. . . . CH3'])),
  P('5.1e', 'Give the IUPAC name for Compound D (from excess NH₃).', ANS('3-methylbutan-2-amine, CH₃CH(NH₂)CH(CH₃)₂')),
  P('5.1f', 'A structural isomer of E, C₅H₁₀O, believed to be an aldehyde, is heated with acidified KMnO₄. List two observations.', '<ul><li>The <b>purple</b> colour of KMnO₄ fades / becomes <b>colourless</b> (MnO₄⁻ reduced to Mn²⁺).</li><li>The aldehyde is oxidised to a carboxylic acid; the smell changes (sharp, vinegar-like); the mixture may warm slightly.</li></ul>'),
  P('5.2', 'Discuss one reaction of alcohols, and the reactions of their products, that account for their wide use: name of reaction, chemical names, formulae and balanced equations.', '<p><b>Esterification</b> (condensation):</p><ul><li>Alcohol + carboxylic acid ⇌ ester + water, conc. H₂SO₄ catalyst, heat under reflux.<br>CH₃CH₂OH + CH₃COOH ⇌ CH₃COOCH₂CH₃ + H₂O<br>ethanol + ethanoic acid ⇌ ethyl ethanoate + water</li><li><b>Products and uses:</b> esters have pleasant fruity smells – used as <b>flavourings and perfumes</b> (e.g. pentyl ethanoate – banana; octyl ethanoate – orange), as <b>solvents</b> (ethyl ethanoate in nail-polish remover, glues).</li><li><b>Further reactions of the products:</b> esters can be hydrolysed: CH₃COOCH₂CH₃ + NaOH → CH₃COONa + CH₃CH₂OH. Base hydrolysis of fats/oils (triglyceride esters) with NaOH gives glycerol and sodium salts of fatty acids – <b>soap (saponification)</b>. Polyesters (PET) from diols and diacids are used for bottles and clothing.</li></ul><p>(Oxidation of ethanol to ethanoic acid / vinegar, or combustion as a fuel, are also acceptable.)</p>')
];

SOL['2017'] = [

  P('1.1b', 'Write the electron configuration (s, p, d notation) of Se and Zn²⁺.', ANS('Se (34) = 1s² 2s² 2p⁶ 3s² 3p⁶ 3d¹⁰ 4s² 4p⁴<br>Zn²⁺ (28 e⁻) = 1s² 2s² 2p⁶ 3s² 3p⁶ 3d¹⁰')),
  P('1.2a', 'Describe how electronegativity changes across the period from Si to Cl.', ANS('Electronegativity increases from Si to Cl (Si 1.8 → P 2.1 → S 2.5 → Cl 3.0).') + '<p>Nuclear charge increases and atomic radius decreases, so the atom attracts the bonding pair of electrons more strongly.</p>'),
  P('1.2b', 'CH₄, NH₃ and H₂O have the same number of valence electrons. Discuss why methane has the lowest and water the highest boiling point.', '<ul><li><b>CH₄</b> (bp −162 °C): C–H bonds are almost non-polar and the molecule is a symmetrical tetrahedron, so it is <b>non-polar</b> – only weak <b>dispersion forces</b>.</li><li><b>NH₃</b> (bp −33 °C): N–H bonds are polar and the shape is trigonal pyramidal, so NH₃ is polar and forms <b>hydrogen bonds</b>. N has only one lone pair, so each molecule forms fewer H-bonds.</li><li><b>H₂O</b> (bp 100 °C): O is more electronegative than N, so the O–H bonds are more polar; the bent molecule has <b>two H atoms and two lone pairs</b>, so each molecule can form up to <b>four hydrogen bonds</b> – the strongest and most extensive IMFs.</li></ul><p>Stronger intermolecular forces need more energy to overcome, so boiling point: CH₄ < NH₃ < H₂O.</p>'),

  P('1.4a', 'State the shape of SO₂Cl₂.', ANS('Tetrahedral (four bonding regions around S, no lone pairs)')),

var STORE = (function () {
  var mem = {};
  try { var raw = window.localStorage.getItem('chem13_v1'); if (raw) mem = JSON.parse(raw) || {}; } catch (e) { }
  function save() { try { window.localStorage.setItem('chem13_v1', JSON.stringify(mem)); } catch (e) { } }
  return {
    best: function (k) { return mem['b_' + k]; },
    setBest: function (k, v) { if (mem['b_' + k] == null || v > mem['b_' + k]) { mem['b_' + k] = v; save(); } },
    reset: function () { mem = {}; save(); }
  };
})();

/* ---------- helpers ---------- */
function $(s) { return document.querySelector(s); }
function h(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function yearOf(q) { var m = /(20\d\d)/.exec(q.s); return m ? m[1] : null; }
function allQs() { var out = []; Object.keys(APP.subs).forEach(function (k) { APP.subs[k].qs.forEach(function (q) { q.sub = k; out.push(q); }); }); return out; }
function go(hash) { location.hash = hash; }
function bestBadge(k) { var b = STORE.best(k); return b == null ? '<span class="badge muted">Not tried</span>' : '<span class="badge ' + (b >= 80 ? 'good' : b >= 50 ? 'mid' : 'low') + '">Best ' + b + '%</span>'; }

function header(title, sub, back, col) {
  return '<header class="bar" style="' + (col ? '--accent:' + col : '') + '">' +
    (back ? '<button class="back" onclick="history.back()" aria-label="Back">‹</button>' : '<img class="crest-s" src="' + CREST + '" alt="">') +
    '<div class="bar-t"><div class="bar-title">' + title + '</div>' + (sub ? '<div class="bar-sub">' + sub + '</div>' : '') + '</div>' +
    (back ? '<button class="home" onclick="go(\'#/\')" aria-label="Home">⌂</button>' : '') + '</header>';
}
function footer() { return '<footer class="foot">Year 13 Chemistry Revision • SPFSC 2026 syllabus<br>Created by <b>Teramira</b> for St Louis High School</footer>'; }
