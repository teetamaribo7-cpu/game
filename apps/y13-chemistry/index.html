<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e3a8a">
<title>Year 13 Chemistry</title>
<style>:root{--bg:#f3f5fb;--card:#ffffff;--ink:#14213d;--muted:#5b6478;--line:#dfe4ee;--navy:#1e3a8a;--gold:#f5c518;--accent:#1e3a8a;--good:#16a34a;--bad:#dc2626;--soft:#eef2fb;--key:#eff6ff;--tipbg:#fffbeb;--exbg:#f0fdf4;--srcbg:#fef3c7;--srcfg:#92400e;--hl:#1e3a8a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1324;--card:#161e33;--ink:#e7ecf7;--muted:#9aa5bd;--line:#2a3550;--soft:#1c2640;--key:#13254a;--tipbg:#3a2c0b;--exbg:#0f2e1d;--srcbg:#3a2c0b;--srcfg:#fcd34d;--hl:#93c5fd;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1324;--card:#161e33;--ink:#e7ecf7;--muted:#9aa5bd;--line:#2a3550;--soft:#1c2640;--key:#13254a;--tipbg:#3a2c0b;--exbg:#0f2e1d;--srcbg:#3a2c0b;--srcfg:#fcd34d;--hl:#93c5fd;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:860px;margin:0 auto;padding:16px}
.muted{color:var(--muted)} .center{text-align:center}
/* hero */
.hero{background:linear-gradient(160deg,#1e3a8a 0%,#1d4ed8 60%,#2563eb 100%);color:#fff;text-align:center;padding:28px 16px 22px;border-bottom:5px solid var(--gold);position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 10%,rgba(245,197,24,.25),transparent 40%),radial-gradient(circle at 10% 90%,rgba(255,255,255,.12),transparent 40%)}
.hero>*{position:relative}
.crest{width:96px;height:auto;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}
.school{letter-spacing:.18em;font-size:12px;font-weight:700;color:var(--gold);margin-top:8px}
.hero h1{margin:2px 0 0;font-size:30px;line-height:1.15;font-weight:800}
.hero-sub{opacity:.92;font-size:15px}
.by{display:inline-block;margin-top:10px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);padding:4px 14px;border-radius:99px;font-size:13px}
.stats{display:flex;justify-content:center;gap:10px;margin-top:16px}
.stats div{background:rgba(255,255,255,.12);border-radius:12px;padding:8px 14px;min-width:86px}
.stats b{display:block;font-size:22px;color:var(--gold)} .stats span{font-size:11px;opacity:.9;text-transform:uppercase;letter-spacing:.05em}
h2.sec{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 4px 10px}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:620px){.grid{grid-template-columns:1fr 1fr}}
.grid.two{grid-template-columns:1fr 1fr}
.scard{position:relative;text-align:left;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:16px;padding:16px 16px 14px 74px;min-height:104px;box-shadow:0 2px 8px rgba(20,33,61,.06);transition:transform .12s}
.scard:active,.pcard:active,.ycard:active,.btn:active,.opt:active{transform:scale(.98)}
.sicon{position:absolute;left:14px;top:18px;width:46px;height:46px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:24px}
.sicon.big{position:static;flex:0 0 56px;width:56px;height:56px;font-size:28px}
.snum{display:block;font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--accent)}
.stitle{display:block;font-weight:700;font-size:17px;line-height:1.25;margin:2px 0 6px}
.smeta{font-size:12.5px;color:var(--muted)}
.tag{background:var(--accent);color:#fff;border-radius:6px;padding:1px 7px;font-weight:700;font-size:11px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:0 2px 8px rgba(20,33,61,.06)}
.pcard b{font-size:14.5px;line-height:1.2} .pcard small{color:var(--muted);font-size:12px}
.picon{font-size:26px;width:46px;height:46px;border-radius:50%;background:var(--soft);display:grid;place-items:center;margin-bottom:4px}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:99px;padding:2px 9px;margin-top:4px;vertical-align:middle}
.badge.good{background:#dcfce7;color:#166534}.badge.mid{background:#fef3c7;color:#92400e}.badge.low{background:#fee2e2;color:#991b1b}.badge.muted{background:var(--soft);color:var(--muted)}
/* bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--navy);color:#fff;border-bottom:4px solid var(--accent);box-shadow:0 2px 10px rgba(0,0,0,.18)}
.bar-t{flex:1;min-width:0}.bar-title{font-weight:800;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar-sub{font-size:12px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back,.home{background:rgba(255,255,255,.14);border:0;color:#fff;width:40px;height:40px;border-radius:12px;font-size:26px;line-height:1;display:grid;place-items:center}
.home{font-size:20px}
.crest-s{width:34px;height:auto}
/* strand */
.intro{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.intro h2{margin:2px 0 0;font-size:20px;line-height:1.25}
.subcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(20,33,61,.05)}
.subhead{display:flex;gap:12px;align-items:flex-start}
.subnum{flex:0 0 auto;background:var(--soft);color:var(--accent);font-weight:800;border-radius:10px;padding:6px 10px;font-size:15px}
.subtitle{font-weight:700;font-size:17px;line-height:1.3}.submeta{font-size:12.5px;color:var(--muted);margin-top:2px}
.btnrow{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}.btnrow .btn{flex:1}
.btn{border:0;background:var(--accent);color:#fff;font-weight:700;padding:13px 16px;border-radius:12px;font-size:15px;min-height:48px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.btn.ghost{background:var(--soft);color:var(--accent);box-shadow:none;border:1px solid var(--line)}
.btn.dark{background:var(--navy)}
.btn.wide{display:block;width:100%;margin:14px 0}
/* notes */
.toc{display:flex;flex-direction:column;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.toc a{color:var(--accent);text-decoration:none;font-weight:600;font-size:14.5px;padding:5px 0;border-bottom:1px dashed var(--line)}.toc a:last-child{border:0}
.note{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0;scroll-margin-top:76px;overflow:hidden}
.note h3{display:flex;gap:10px;align-items:center;margin:0 0 10px;font-size:18px;line-height:1.3;color:var(--accent)}
.note h3 span{flex:0 0 28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:14px}
.note p,.note li{font-size:15.5px}.note ul,.note ol{padding-left:20px;margin:8px 0}.note li{margin:5px 0}
.note table{width:100%;border-collapse:collapse;font-size:13.5px;margin:10px 0}
.note th{background:var(--accent);color:#fff;text-align:left;padding:7px 6px;font-size:12.5px}
.note td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.note tr:nth-child(even) td{background:var(--soft)}
.key,.tip,.ex{border-radius:12px;padding:12px 14px;margin:10px 0;font-size:15px}
.key{background:var(--key);border-left:5px solid #2563eb}
.tip{background:var(--tipbg);border-left:5px solid #f59e0b}
.ex{background:var(--exbg);border-left:5px solid #16a34a}
.ex table{display:table;font-size:13px}
.src{display:inline-block;font-size:11px;font-weight:700;color:var(--muted);background:var(--soft);border-radius:6px;padding:0 6px}
.pill{font-size:12px;font-weight:700;border-radius:6px;padding:1px 6px}.pill.up{background:#dcfce7;color:#166534}.pill.dn{background:#fee2e2;color:#991b1b}
.fig{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin:12px 0;padding:10px;background:var(--soft);border-radius:12px;color:var(--ink);overflow-x:auto}
.fig .cap{flex-basis:100%;text-align:center;font-size:12.5px;color:var(--muted);margin-top:-4px}
.dg{max-width:100%;height:auto;color:var(--ink)}
.rx{display:flex;flex-wrap:nowrap;overflow-x:auto;max-width:100%;align-items:center;justify-content:center;gap:4px}
.rx .dg{max-height:84px;width:auto;flex:0 0 auto}
.rx-plus{font-size:20px;font-weight:700;padding:0 2px}
.rx-arrow{display:flex;flex-direction:column;align-items:center;font-size:24px;line-height:1;padding:0 4px}.rx-arrow small{font-size:11px;min-height:12px;color:var(--muted)}
.map{font-size:14px;line-height:2;text-align:center}
.done{text-align:center;background:var(--card);border:2px dashed var(--accent);border-radius:16px;padding:18px;margin-top:20px}
.done p{margin:6px 0 0;color:var(--muted)}
/* setup */
.setup{text-align:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 18px}
.setup h2{margin:6px 0 2px;font-size:21px}.setup-ic{width:60px;height:60px;margin:0 auto;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:28px}
.hint{font-size:14px;color:var(--muted);margin:14px 0}
.choices{display:flex;flex-direction:column;gap:10px}
/* quiz */
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.prog{flex:1;height:8px;background:var(--line);border-radius:9px;overflow:hidden}.prog i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .3s}
.score{font-weight:800;font-size:13px;color:var(--accent);white-space:nowrap}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 3px 12px rgba(20,33,61,.07)}
.qmeta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{font-size:11.5px;font-weight:700;background:var(--soft);color:var(--accent);border-radius:99px;padding:3px 10px}
.chip.src{background:var(--srcbg);color:var(--srcfg)}
.qtext{font-size:17.5px;font-weight:600;line-height:1.45}.qtext.sm{font-size:15.5px}
.qfig{background:#f8fafc;color:#14213d}.qfig .dg{color:#14213d}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;font-size:15.5px;line-height:1.4;min-height:52px}
.opt .L{flex:0 0 30px;height:30px;border-radius:50%;background:var(--soft);color:var(--accent);font-weight:800;display:grid;place-items:center;font-size:14px}
.opt.right{border-color:var(--good);background:#f0fdf4;color:#14532d}.opt.right .L{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:#fef2f2;color:#7f1d1d}.opt.wrong .L{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.explain{margin-top:14px;border-radius:14px;padding:12px 14px}.explain p{margin:6px 0 0;font-size:15px}
.explain.ok{background:#f0fdf4;border:1px solid #86efac;color:#14532d}.explain.no{background:#fef2f2;border:1px solid #fca5a5;color:#7f1d1d}
/* results */
.result{text-align:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 16px}
.result h2{font-size:18px;margin:10px 0}
.review{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.ans{border-radius:10px;padding:8px 10px;margin-top:8px;font-size:14.5px;font-weight:600}.ans.ok{background:#dcfce7;color:#14532d}.ans.no{background:#fee2e2;color:#7f1d1d}
.years{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.ycard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 6px;display:flex;flex-direction:column;align-items:center}
.ycard b{font-size:22px;color:var(--hl)}.ycard small{color:var(--muted);font-size:12px}
.flist{display:flex;flex-direction:column;gap:10px}
.frow{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.frow b{display:block;color:var(--hl);margin-bottom:6px}
.frow div{display:flex;flex-wrap:wrap;gap:6px}.frow span{background:var(--soft);border-radius:8px;padding:4px 9px;font-size:14px}
.foot{text-align:center;font-size:12px;color:var(--muted);padding:22px 16px 34px}

.solcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:2px solid var(--gold);border-radius:16px;padding:12px 14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(20,33,61,.06)}
.solcard>span:nth-child(2){flex:1;min-width:0}.solcard b{display:block;font-size:15.5px}.solcard small{color:var(--muted);font-size:12.5px}.solcard .picon{margin:0;color:var(--good);font-weight:800}
.solcard .arrow{font-size:28px;color:var(--muted)}
.soltools{display:flex;gap:10px}.soltools .btn{flex:1}
.pq{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.pqq{font-size:15.5px;font-weight:600;line-height:1.45;margin-top:8px}
.showsol{width:100%;margin-top:10px;min-height:42px;padding:9px}
.showsol .s2,.pq.open .showsol .s1{display:none}.pq.open .showsol .s2{display:inline}
.sol{display:none;margin-top:10px;border-left:5px solid var(--good);background:var(--exbg);border-radius:12px;padding:10px 14px;font-size:15px;overflow-x:auto}
.pq.open .sol{display:block}
.solh{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--good);margin-bottom:4px}
.sol p{margin:6px 0}.sol ul,.sol ol{padding-left:20px;margin:6px 0}.sol li{margin:4px 0}
.sol table{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}.sol th{background:var(--navy);color:#fff;text-align:left;padding:6px}.sol td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
.final{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:8px 0;font-weight:700;color:var(--ink)}
</style></head>

<script>/* ===== Diagram engine: all drawings are vector SVG generated offline ===== */
var D = (function () {
  var INK = 'currentColor';

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

  // Render a chemical label with subscript digits / superscript charges (after ^)
  function label(t, x, y, size, anchor, extra) {
    size = size || 15; anchor = anchor || 'middle';
    var main = t, sup = '';
    var k = t.indexOf('^');
    if (k >= 0) { main = t.slice(0, k); sup = t.slice(k + 1); }
    var out = '<text x="' + x + '" y="' + y + '" font-size="' + size + '" text-anchor="' + anchor + '" dominant-baseline="central" fill="' + INK + '" ' + (extra || '') + '>';
    var parts = main.match(/[A-Za-z()\[\]'’]+|[0-9]+|[^A-Za-z0-9()\[\]]+/g) || [];
    var prevLetter = false, down = 0;
    parts.forEach(function (p) {
      if (/^[0-9]+$/.test(p) && prevLetter) {
        out += '<tspan font-size="' + (size * 0.7) + '" dy="' + (4 - down) + '">' + p + '</tspan>'; down = 4;
      } else { out += '<tspan dy="' + (-down) + '">' + esc(p) + '</tspan>'; down = 0; }
      prevLetter = /[A-Za-z)\]]$/.test(p);
    });
    if (sup) out += '<tspan font-size="' + (size * 0.7) + '" dy="' + (-6 - down) + '">' + esc(sup) + '</tspan>';
    return out + '</text>';
  }
  function labelWidth(t) {
    var m = t.replace(/\^.*/, ''), w = 0;
    for (var i = 0; i < m.length; i++) w += /[0-9]/.test(m[i]) ? 6 : (/[il|']/.test(m[i]) ? 5 : 10);
    return w + (t.indexOf('^') >= 0 ? 7 : 0);
  }
  function svg(w, h, body, cls) {
    return '<svg class="dg ' + (cls || '') + '" viewBox="0 0 ' + w + ' ' + h + '" width="' + w + '" height="' + h + '" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">' + body + '</svg>';
  }
  function line(x1, y1, x2, y2, w, col, dash) {
    return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + (col || INK) + '" stroke-width="' + (w || 1.6) + '"' + (dash ? ' stroke-dasharray="' + dash + '"' : '') + ' stroke-linecap="round"/>';
  }
  function arrowHead(x, y, ang, col, s) {
    s = s || 8;
    var a1 = ang + 2.6, a2 = ang - 2.6;
    return '<polygon points="' + x + ',' + y + ' ' + (x + s * Math.cos(a1)) + ',' + (y + s * Math.sin(a1)) + ' ' + (x + s * Math.cos(a2)) + ',' + (y + s * Math.sin(a2)) + '" fill="' + (col || INK) + '"/>';
  }
  function arrow(x1, y1, x2, y2, col, w) {
    var ang = Math.atan2(y2 - y1, x2 - x1);
    return line(x1, y1, x2 - 5 * Math.cos(ang), y2 - 5 * Math.sin(ang), w || 1.6, col) + arrowHead(x2, y2, ang, col);
  }
  function txt(t, x, y, size, anchor, col, weight) {
    return '<text x="' + x + '" y="' + y + '" font-size="' + (size || 12) + '" text-anchor="' + (anchor || 'middle') + '" fill="' + (col || INK) + '"' + (weight ? ' font-weight="' + weight + '"' : '') + ' dominant-baseline="central">' + esc(t) + '</text>';
  }

  /* ---------- Displayed (structural) formula from a token grid ----------
     rows: array of strings, tokens separated by single spaces.
     bond tokens: - = ≡ | ‖ ; empty: .  ; atom: anything else; prefix * = circle it */
  var HB = { '-': 1, '=': 1, '≡': 1 }, VB = { '|': 1, '‖': 1 };
  function sf(rows, opts) {
    opts = opts || {};
    var g = rows.map(function (r) { return r.split(' '); });
    var nc = 0; g.forEach(function (r) { nc = Math.max(nc, r.length); });
    var cw = [], i, j;
    for (j = 0; j < nc; j++) {
      var w = 8;
      g.forEach(function (r) {
        var t = r[j]; if (!t || t === '.') return;
        if (HB[t]) w = Math.max(w, 22);
        else if (VB[t]) w = Math.max(w, 10);
        else w = Math.max(w, labelWidth(t.replace('*', '')) + 4);
      });
      cw.push(w);
    }
    var cx = [], x = 10;
    for (j = 0; j < nc; j++) { cx.push(x + cw[j] / 2); x += cw[j]; }
    var W = x + 10;
    var rh = g.map(function (r) {
      var atom = r.some(function (t) { return t && t !== '.' && !HB[t] && !VB[t]; });
      return atom ? 26 : 18;
    });
    var ry = [], y = 8;
    rh.forEach(function (h) { ry.push(y + h / 2); y += h; });

      var t = g[i][j]; if (!t || t === '.') continue;
      if (HB[t]) {
        var x1 = cx[j - 1] + half(i, j - 1), x2 = cx[j + 1] - half(i, j + 1), yy = ry[i];
        if (t === '-') b += line(x1, yy, x2, yy);
        if (t === '=') b += line(x1, yy - 2.5, x2, yy - 2.5) + line(x1, yy + 2.5, x2, yy + 2.5);
        if (t === '≡') b += line(x1, yy - 4, x2, yy - 4) + line(x1, yy, x2, yy) + line(x1, yy + 4, x2, yy + 4);
      } else if (VB[t]) {
        var y1 = ry[i - 1] + 9, y2 = ry[i + 1] - 9, xx = cx[j];
        if (t === '|') b += line(xx, y1, xx, y2);
        else b += line(xx - 2.5, y1, xx - 2.5, y2) + line(xx + 2.5, y1, xx + 2.5, y2);
      } else {
        var circ = t.charAt(0) === '*'; if (circ) t = t.slice(1);
        b += label(t, cx[j], ry[i], 15);
        if (circ) b += '<ellipse cx="' + cx[j] + '" cy="' + ry[i] + '" rx="' + (labelWidth(t) / 2 + 9) + '" ry="15" fill="none" stroke="#d9480f" stroke-width="1.8" stroke-dasharray="4 3"/>';
      }
    }
    if (opts.raw) return { w: W, h: H, body: b };
    return svg(W, H, b);
  }

  /* ---------- Titration curves (computed) ---------- */
  function titrWeak() {
    var pts = [], Ka = 1.8e-5, Va = 25, C = 0.1;
    for (var v = 0; v <= 50; v += 0.25) {

      if (v === 0) pH = -Math.log10(Math.sqrt(Ka * C));
      else if (nb < na - 1e-9) pH = -Math.log10(Ka) + Math.log10(nb / (na - nb));
      else if (Math.abs(nb - na) < 1e-9) { var Kb = 1e-14 / Ka, c = na / Vt; pH = 14 + Math.log10(Math.sqrt(Kb * c)); }
      else pH = 14 + Math.log10((nb - na) / Vt);
      pts.push([v, Math.min(pH, 13)]);
    }
    return pts;
  }
  function titrStrong() {
    var pts = [];

      if (nb < na - 1e-9) pH = -Math.log10((na - nb) / Vt);
      else if (Math.abs(nb - na) < 1e-9) pH = 7;
      else pH = 14 + Math.log10((nb - na) / Vt);
      pts.push([v, pH]);
    }
    return pts;

  /* ---------- Half-life / decay curve ---------- */
  function decay(t12, unit, N0) {
    var pts = []; N0 = N0 || 100;

      ann: [function (X, Y) { return line(X(0), Y(N0 / 2), X(t12), Y(N0 / 2), 1.2, '#1d4ed8', '4 3') + line(X(t12), Y(N0 / 2), X(t12), Y(0), 1.2, '#1d4ed8', '4 3') + txt('t½', X(t12) + 8, Y(N0 / 2) - 10, 11, 'start', '#1d4ed8', '700'); }] });
  }
  function concTime() {
    var pts = []; for (var t = 0; t <= 200; t += 5) pts.push([t, 0.8 * Math.pow(0.5, t / 50)]);

/* Reaction row helper: items are SVG/HTML strings or {arrow:'reagent'} or '+' */
function RX(items) {
  return '<div class="rx">' + items.map(function (it) {

    Q('The shape of sulfuryl chloride (SO₂Cl₂), with S bonded to 2 O and 2 Cl and no lone pairs on S, is', ['tetrahedral', 'square planar', 'trigonal pyramidal', 'see-saw'], 'Four bonding regions and no lone pairs on the central S → tetrahedral.', '2017 Q1.4a'),

/* ---------- 1.2 Nuclear Chemistry ---------- */
APP.subs['1.2'] = {

    ['Key definitions', `
<div class="key"><b>Radioactivity</b> – the spontaneous emission of radiation (α, β or γ) from <b>unstable atomic nuclei</b> as they decay to become more stable.</div>

<div class="key"><b>Nuclear fusion</b> – two <b>light nuclei combine</b> to form a heavier nucleus, releasing a very large amount of energy. e.g. ²H + ³H → ⁴He + ¹n (needs extremely high temperature and pressure, as in the Sun).</div>

/* ---------- 1.3 Transition Metals ---------- */

<tr><td>Mn</td><td>[Ar] 3d⁵ 4s²</td><td>Zn</td><td>[Ar] 3d¹⁰ 4s²</td></tr></table>
<p>Ions lose <b>4s first</b>: Cu²⁺ = [Ar] 3d⁹ &nbsp;•&nbsp; Fe²⁺ = [Ar] 3d⁶ &nbsp;•&nbsp; Fe³⁺ = [Ar] 3d⁵ &nbsp;•&nbsp; Zn²⁺ = [Ar] 3d¹⁰.</p>
<p><b>Variable oxidation states</b> occur because the 4s and 3d energies are close, so different numbers of electrons can be lost. The maximum oxidation state rises to <b>Mn (+7)</b> (all 4s + 3d electrons) and then falls. Fe³⁺ (d⁵, half-full) is more stable than Fe²⁺.</p>`],
    ['Complex ions and ligands', `
<div class="key"><b>Complex ion</b> – a central metal ion surrounded by <b>ligands</b> joined by <b>dative (coordinate) bonds</b>.<br><b>Ligand</b> – a molecule or ion with a <b>lone pair</b> that it donates to the metal ion (H₂O, NH₃, OH⁻, Cl⁻, SCN⁻).<br><b>Coordination number</b> – number of dative bonds to the central ion.</div>
<p>Transition metals form complexes because their ions are <b>small with a high charge</b> and have <b>empty d (and 4s, 4p) orbitals</b> that can accept lone pairs.</p>
<table><tr><th>Complex</th><th>Name</th><th>CN / shape</th><th>Colour</th></tr>
<tr><td>[Ag(NH₃)₂]⁺</td><td>diamminesilver(I)</td><td>2 / linear</td><td>colourless</td></tr>
<tr><td>[Cu(NH₃)₄]²⁺</td><td>tetraamminecopper(II)</td><td>4 / square planar</td><td>deep blue</td></tr>
<tr><td>[Zn(NH₃)₄]²⁺</td><td>tetraamminezinc(II)</td><td>4 / tetrahedral</td><td>colourless</td></tr>
<tr><td>[Zn(OH)₄]²⁻</td><td>tetrahydroxozincate(II)</td><td>4 / tetrahedral</td><td>colourless</td></tr>
<tr><td>[CuCl₄]²⁻</td><td>tetrachlorocuprate(II)</td><td>4 / tetrahedral</td><td>yellow-green</td></tr>
<tr><td>[FeSCN]²⁺</td><td>thiocyanatoiron(III)</td><td>–</td><td>blood red</td></tr>
<tr><td>[Cu(H₂O)₆]²⁺</td><td>hexaaquacopper(II)</td><td>6 / octahedral</td><td>light blue</td></tr></table>
<div class="tip"><b>Naming:</b> number prefix (di, tetra, hexa) + ligand (ammine, aqua, chloro, hydroxo, thiocyanato) + metal + (oxidation state). If the complex is an <b>anion</b>, the metal ends in <b>-ate</b> (cuprate, zincate, ferrate). Oxidation state = charge of complex − sum of ligand charges, e.g. [CuCl₄]²⁻: x + 4(−1) = −2 → x = +2.</div>`],
    ['Formation reactions and observations', `
<ul><li><b>Cu²⁺ + NH₃:</b> a few drops → <b>light blue precipitate</b> Cu(OH)₂; excess → <b>deep blue solution</b>.<br>Cu²⁺(aq) + 2OH⁻(aq) → Cu(OH)₂(s)<br>Cu(OH)₂(s) + 4NH₃(aq) → [Cu(NH₃)₄]²⁺(aq) + 2OH⁻(aq)</li>
<li><b>Zn²⁺:</b> white precipitate Zn(OH)₂ that dissolves in excess NH₃ or NaOH → colourless solution.<br>Zn²⁺ + 4NH₃ → [Zn(NH₃)₄]²⁺ &nbsp;•&nbsp; Zn(OH)₂ + 2OH⁻ → [Zn(OH)₄]²⁻</li>
<li><b>Ag⁺:</b> brown precipitate (Ag₂O) dissolves in excess NH₃ → colourless solution.<br>Ag⁺ + 2NH₃ → [Ag(NH₃)₂]⁺ (Tollens' reagent)</li>
<li><b>Cu²⁺ + conc. HCl:</b> blue → yellow-green. [Cu(H₂O)₆]²⁺ + 4Cl⁻ ⇌ [CuCl₄]²⁻ + 6H₂O (ligand exchange)</li>
<li><b>Fe³⁺ + SCN⁻:</b> blood-red solution. Fe³⁺ + SCN⁻ → [FeSCN]²⁺</li>
<li><b>Fe²⁺ + NaOH/NH₃:</b> green precipitate Fe(OH)₂ that turns brown in air (oxidised to Fe(OH)₃).</li></ul>`],
    ['Why are transition metal ions coloured?', `
<ol><li>The ion has a <b>partially filled d sub-shell</b> (e.g. Cu²⁺ = 3d⁹).</li>
<li>Ligands approaching the ion <b>split the five d orbitals</b> into two groups of different energy.</li>
<li>An electron absorbs light of a certain energy (ΔE = hf) to jump to the higher d level.</li>
<li>The <b>remaining (complementary) colour is transmitted/reflected</b> and seen. [Cu(H₂O)₆]²⁺ absorbs orange-red light so appears blue.</li></ol>
<div class="fig">${D.dsplit()}${D.colourWheel()}</div>
<p>Zn²⁺ (d¹⁰), Sc³⁺ (d⁰) and Cu⁺ (d¹⁰) are <b>colourless</b> – no d–d transition possible. Colour depends on the metal, its oxidation state, the ligand and the coordination number.</p>`],
    ['Catalysis and biological importance', `
<p>Transition metals are good <b>catalysts</b> because they (1) have <b>variable oxidation states</b> to pass electrons back and forth and (2) use their <b>d orbitals to adsorb reactant molecules</b> onto their surface, weakening bonds and lowering activation energy.</p>
<div class="fig">${D.haber()}</div>
<ul><li>Fe – Haber process (NH₃) &nbsp;•&nbsp; V₂O₅ – Contact process (H₂SO₄) &nbsp;•&nbsp; Ni – hydrogenation of oils (margarine) &nbsp;•&nbsp; Pt/Rh – catalytic converters</li>
<li><b>Haemoglobin</b> – Fe²⁺ at the centre of a haem (porphyrin) ring, bonded to 4 N atoms + 1 histidine N. O₂ binds reversibly by a <b>dative bond</b> to the 6th position → carries O₂ in blood. CO binds more strongly → CO poisoning.</li>
<li>Chlorophyll (Mg²⁺), vitamin B₁₂ (Co), cisplatin (Pt²⁺, anticancer drug).</li></ul>`]

  qs: [
    Q('The configuration of Fe is [Ar] 3d⁶ 4s². What is the configuration of Fe²⁺?', ['[Ar] 3d⁶', '[Ar] 3d⁴ 4s²', '[Ar] 3d⁵ 4s¹', '[Ar] 3d⁶ 4s²'], 'Transition metal ions lose the 4s electrons first: Fe²⁺ = [Ar] 3d⁶.', '2025 Q1.3a'),
    Q('What is the configuration of Fe³⁺?', ['[Ar] 3d⁵', '[Ar] 3d³ 4s²', '[Ar] 3d⁶', '[Ar] 3d⁴ 4s¹'], 'Remove both 4s electrons and one 3d electron: [Ar] 3d⁵ (a stable half-filled d sub-shell).', '2025 Q1.3a'),
    Q('[Cu(H₂O)₆]²⁺ is light blue in solution because', ['the ligands split the partly filled 3d orbitals; the ion absorbs orange-red light and transmits blue', 'Cu²⁺ has a full 3d sub-shell which reflects blue light', 'water molecules are blue', 'electrons are lost from the 4s orbital when light is absorbed'], 'Cu²⁺ is 3d⁹. Ligand splitting allows d–d transitions; the absorbed colour is complementary to the blue colour seen.', '2025 Q1.3b', D.dsplit()),

  notes: [
    ['About this strand', `
<div class="key">Strand 2 is assessed by <b>Internal Assessment (IA Task 1 – research report)</b>, not in the final exam. You choose a chemistry-related issue in society and write a structured, referenced report. These notes summarise what the report needs and give examples of issues often linked to past exam questions.</div>`],
    ['What your research report must include', `
<ol><li><b>Identify the issue</b> – a chemistry-related issue, development or discovery with social relevance (e.g. plastic pollution in Kiribati).</li>
<li><b>Collect information</b> – scientific sources <i>and</i> community perspectives (interviews, surveys).</li>
<li><b>Historical background</b> – how the discovery/technology developed and how scientific knowledge changed over time.</li>
<li><b>Chemical principles</b> – explain the chemistry, with correct formulae and balanced equations.</li>
<li><b>Impacts</b> – social, environmental and economic effects.</li>
<li><b>Analyse data / case studies</b> – judge reliability and validity of sources.</li>
<li><b>Evaluate</b> – risks, benefits and ethics from different stakeholders' points of view.</li>
<li><b>Manage risks</b> – laws/regulation, education, community action.</li>
<li><b>Recommend solutions</b> – evidence-based future directions.</li>
<li><b>Reference</b> sources accurately (peer-reviewed where possible).</li></ol>`],
    ['Example issues (with the chemistry)', `
<div class="ex"><b>CFCs and the ozone layer</b> <span class="src">SPFSC 2017</span><br>CFCs (e.g. CCl₃F "Freon-11", CCl₂F₂ "Freon-12") were used as refrigerants, aerosol propellants and foam blowing agents because they are <b>non-toxic, non-flammable and unreactive</b>. They form by substitution of methane/ethane, e.g. CCl₄ + HF → CCl₃F + HCl (SbCl₅ catalyst). In the stratosphere UV light breaks the C–Cl bond: CCl₂F₂ → •CCl₂F + Cl•. The Cl radical destroys ozone in a chain reaction: Cl• + O₃ → ClO• + O₂; ClO• + O → Cl• + O₂. Result: ozone hole, more UV-B, skin cancer. Solution: <b>Montreal Protocol (1987)</b> phased out CFCs; replaced by HFCs (but these are greenhouse gases).</div>
<div class="ex"><b>Plastic pollution</b> <span class="src">SPFSC 2023</span><br>Poly(alkenes) such as polythene and PVC are addition polymers with strong C–C and C–H bonds: chemically inert and <b>non-biodegradable</b>, so they persist for hundreds of years, harm marine life and form microplastics. Burning releases toxic gases (HCl, dioxins from PVC). Solutions: reduce/reuse/recycle, ban single-use bags, use <b>biodegradable polymers</b> such as poly(lactic acid) – polyesters whose ester links can be hydrolysed by water and microorganisms.</div>
<div class="ex"><b>Climate change and ocean acidification</b><br>CO₂ from burning fossil fuels traps heat (enhanced greenhouse effect) → sea-level rise (a serious threat to low-lying atolls like Kiribati). CO₂ also dissolves in the ocean: CO₂ + H₂O ⇌ H₂CO₃ ⇌ H⁺ + HCO₃⁻, lowering pH and dissolving coral (CaCO₃) reefs.</div>
<div class="ex"><b>Fertilisers (Haber process)</b><br>N₂ + 3H₂ ⇌ 2NH₃ allowed food production to grow, but excess fertiliser run-off causes <b>eutrophication</b> (algal blooms, low oxygen) in lagoons.</div>
<div class="ex"><b>Water treatment</b><br>Chlorine kills bacteria (Cl₂ + H₂O → HOCl + HCl); alum (Al₂(SO₄)₃) flocculates particles; desalination and rain-water tanks are important on atolls.</div>
<div class="ex"><b>Nuclear testing in the Pacific</b><br>Kiritimati (Christmas Island), Bikini Atoll and Moruroa were used for nuclear tests; radioactive isotopes (Cs-137, Sr-90) contaminated the environment and affected people's health.</div>`]

<table><tr><th>Type</th><th>What happens</th><th>Example</th></tr>

<tr><td>Addition</td><td>atoms add across C=C or C=O; one product</td><td>CH₂=CH₂ + Br₂ → CH₂BrCH₂Br</td></tr>

<p>Mechanism types: <b>nucleophilic substitution</b> (haloalkanes), <b>electrophilic addition</b> (alkenes), <b>electrophilic substitution</b> (benzene), <b>nucleophilic addition</b> (C=O of aldehydes/ketones), <b>radical substitution</b> (alkanes + Cl₂ in UV).</p>`],

    ['Haloalkanes', `

<div class="key">Substrand 3.3 is assessed by an <b>Internal Assessment practical investigation</b> in organic chemistry (e.g. comparing rates of hydrolysis of haloalkanes, identifying an unknown carbonyl compound, making an ester).</div>
<ol><li><b>Problem / aim</b> – a clear question to investigate.</li>
<li><b>Hypothesis</b> – a testable prediction with a reason: "If …, then …, because …".</li>
<li><b>Variables</b> – independent (what you change), dependent (what you measure), controlled (kept the same: temperature, volumes, concentrations, time).</li>
<li><b>Method</b> – numbered steps, equipment, safety (fume cupboard for volatile organics; no flames near ethanol; gloves and goggles for concentrated acids).</li>
<li><b>Results</b> – tables with units and headings, repeats and averages, graphs.</li>
<li><b>Analysis</b> – trends, calculations, equations; compare with published data.</li>
<li><b>Evaluation</b> – reliability (repeat results agree), validity (fair test, measures what it should), accuracy (close to true value); sources of error and improvements.</li>
<li><b>Conclusion</b> – answer the aim; accept/reject hypothesis; real-life applications.</li></ol>`],

APP.subs['4.1'] = {
  notes: [
    ['Enthalpy change, exothermic and endothermic', `
<div class="key"><b>Enthalpy change (ΔH)</b> – the heat energy change of a reaction at constant pressure (kJ mol⁻¹).<br><b>Exothermic</b>: heat released to surroundings, ΔH <b>negative</b>, temperature rises (combustion, neutralisation, respiration).<br><b>Endothermic</b>: heat absorbed, ΔH <b>positive</b>, temperature falls (thermal decomposition, melting, evaporation, photosynthesis).</div>
<div class="fig">${D.profile(true)}${D.profile(false)}</div>
<p><b>Bond breaking is endothermic</b> (needs energy); <b>bond forming is exothermic</b> (releases energy). If more energy is released forming new bonds than is used breaking old bonds, the reaction is exothermic.</p>
<p><b>Bond energy (bond enthalpy)</b> – the energy needed to break one mole of a covalent bond in gaseous molecules. It is <b>always positive</b>; stronger bonds have larger bond energies.</p>
<p><b>Thermochemical equation</b> – balanced equation with <b>states</b> and <b>ΔH</b>: MgCO₃(s) → MgO(s) + CO₂(g) ΔH = +118 kJ mol⁻¹.</p>`],
    ['Named standard enthalpy changes (298 K, 100 kPa, 1 mol/L)', `

<tr><td>ΔfH°</td><td>formation</td><td>1 mol of compound formed from its elements in standard states: H₂(g) + ½O₂(g) → H₂O(l). ΔfH° of an element = 0.</td></tr>
<tr><td>ΔcH°</td><td>combustion</td><td>1 mol of substance burnt completely in O₂: CH₄ + 2O₂ → CO₂ + 2H₂O. Always negative.</td></tr>
<tr><td>ΔrH°</td><td>reaction</td><td>for the equation as written</td></tr>
<tr><td>ΔfusH</td><td>fusion</td><td>solid → liquid: H₂O(s) → H₂O(l)</td></tr>
<tr><td>ΔvapH</td><td>vaporisation</td><td>liquid → gas: C₂H₅OH(l) → C₂H₅OH(g) ΔH = +42.3 kJ mol⁻¹</td></tr>
<tr><td>ΔatH</td><td>atomisation</td><td>1 mol of gaseous atoms formed from the element: Na(s) → Na(g)</td></tr>
<tr><td>ΔᵢH</td><td>(first) ionisation</td><td>Na(g) → Na⁺(g) + e⁻; general X(g) → Xⁿ⁺(g) + ne⁻</td></tr>
<tr><td>ΔeaH</td><td>electron affinity</td><td>Cl(g) + e⁻ → Cl⁻(g)</td></tr>
<tr><td>ΔlattH</td><td>lattice energy</td><td>energy to separate 1 mol of ionic solid into gaseous ions: NaCl(s) → Na⁺(g) + Cl⁻(g) (positive). The reverse (formation of lattice) is negative.</td></tr>

    ['Calorimetry: q = mcΔT', `
<div class="key">q = m × c × ΔT &nbsp; (J) &nbsp;&nbsp;&nbsp; ΔH = −q ÷ n &nbsp; (kJ mol⁻¹)<br>m = mass of solution/water (g), c = specific heat capacity (J g⁻¹ °C⁻¹; water 4.18), ΔT = temperature change.<br><b>Heat capacity</b> = energy to raise a whole object by 1 °C; <b>specific heat capacity</b> = energy to raise 1 g by 1 °C.</div>

  notes: [
    ['Redox basics', `
<div class="key"><b>Oxidation</b> = loss of electrons (oxidation number increases). <b>Reduction</b> = gain of electrons (oxidation number decreases). <b>OIL RIG</b>.<br><b>Oxidising agent (oxidant)</b> – is reduced, takes electrons. <b>Reducing agent (reductant)</b> – is oxidised, gives electrons.</div>
<p><b>Ion terms:</b> anion = negative ion (moves to the anode); cation = positive ion (moves to the cathode).</p>
<p><b>Balancing half-equations in acid:</b> (1) balance atoms other than O and H; (2) add H₂O to balance O; (3) add H⁺ to balance H; (4) add e⁻ to balance charge. (In base, then add OH⁻ to both sides to remove H⁺.)</p>
<div class="ex">MnO₄⁻ + 8H⁺ + 5e⁻ → Mn²⁺ + 4H₂O &nbsp;•&nbsp; Fe²⁺ → Fe³⁺ + e⁻ (×5)<br>Overall: MnO₄⁻ + 8H⁺ + 5Fe²⁺ → Mn²⁺ + 5Fe³⁺ + 4H₂O</div>`],

<li><b>Standard electrode (reduction) potential E°</b> – the voltage of a half-cell compared with the <b>standard hydrogen electrode</b> under standard conditions: <b>1 mol/L ions, 298 K (25 °C), 1 atm (100 kPa) for gases</b>.</li>

    ['Galvanic (voltaic) cells', `

/* ===================== STRAND 5: AQUEOUS EQUILIBRIUM SYSTEMS ===================== */
APP.subs['5.1'] = {
  notes: [
    ['Reversible reactions and equilibrium', `
<div class="key"><b>Reversible reaction</b> – can go in both directions (shown by ⇌). <b>Irreversible</b> – goes one way only (→), e.g. combustion.<br><b>Dynamic equilibrium</b> (closed system): the <b>forward and reverse rates are equal</b> and the <b>concentrations stay constant</b> – the reactions have not stopped.</div>
<p><b>Equilibrium constant expression:</b> for aA + bB ⇌ cC + dD, &nbsp; <b>Kc = [C]ᶜ[D]ᵈ / [A]ᵃ[B]ᵇ</b> (products over reactants, powers = coefficients). Leave out pure solids and liquids.</p>
<div class="ex">2N₂O₅(g) ⇌ 4NO₂(g) + O₂(g) &nbsp;→&nbsp; K = [NO₂]⁴[O₂] / [N₂O₅]²<br>S(g) + O₂(g) ⇌ SO₂(g) &nbsp;→&nbsp; Kc = [SO₂] / [S][O₂]</div>
<table><tr><th>Value of K</th><th>Meaning</th></tr>
<tr><td>very large (e.g. 2.2 × 10⁵⁹)</td><td>equilibrium lies far to the right – reaction essentially complete, mostly products</td></tr>
<tr><td>≈ 1</td><td>similar amounts of reactants and products</td></tr>
<tr><td>very small</td><td>lies to the left – mostly reactants</td></tr></table>
<p>K depends <b>only on temperature</b> – not on concentration, pressure or a catalyst.</p>
<div class="ex"><b>SPFSC 2022:</b> CO + Cl₂ ⇌ COCl₂, Kc = 1.23 × 10³; [CO] = 0.012, [Cl₂] = 0.025. [COCl₂] = Kc[CO][Cl₂] = 1.23×10³ × 0.012 × 0.025 = <b>0.369 mol/L</b>.</div>
<div class="ex"><b>ICE method:</b> write Initial, Change (using mole ratio and x), Equilibrium concentrations, substitute into Kc and solve for x.</div>`],
    ['Le Chatelier’s principle', `
<div class="key">If a system at equilibrium is disturbed, the equilibrium position shifts to <b>oppose the change</b>.</div>
<table><tr><th>Change</th><th>Shift</th><th>K changes?</th></tr>
<tr><td>add reactant / remove product</td><td>to the right</td><td>no</td></tr>
<tr><td>increase pressure</td><td>towards fewer moles of gas</td><td>no</td></tr>
<tr><td>increase temperature</td><td>in the endothermic direction</td><td><b>yes</b></td></tr>
<tr><td>catalyst</td><td>no shift – equilibrium reached faster</td><td>no</td></tr></table>
<div class="ex"><b>Haber process:</b> N₂ + 3H₂ ⇌ 2NH₃, ΔH = −92 kJ/mol. High pressure (4 → 2 mol gas) and low temperature favour NH₃, but low T is too slow, so a <b>compromise</b> ~450 °C, ~200 atm and an <b>iron catalyst</b> is used; NH₃ is removed by cooling (liquefied) and unreacted gases recycled. Raising T <b>decreases K</b> (exothermic reaction).</div>`],
    ['Acids and bases', `
<div class="key"><b>Brønsted–Lowry acid</b> = proton (H⁺) donor; <b>base</b> = proton acceptor. Each acid has a <b>conjugate base</b> (acid minus H⁺) and each base a <b>conjugate acid</b>.<br>HCl + H₂O → Cl⁻ + H₃O⁺ : HCl acid / Cl⁻ conjugate base; H₂O base / H₃O⁺ conjugate acid.</div>
<ul><li><b>Strong acid</b> – completely ionised (HCl, HNO₃, H₂SO₄, HBr, HI). <b>Weak acid</b> – partially ionised (CH₃COOH, HCOOH, HF, HNO₂, HCN, H₂CO₃).</li>
<li><b>Monoprotic</b> – donates one H⁺ per molecule (CH₃COOH is a weak monoprotic acid); diprotic e.g. H₂SO₄.</li>
<li><b>Electrolytes:</b> strong (completely dissociates into ions, conducts well – KNO₃, NaCl, HCl); weak (partly ionised, conducts poorly – CH₃COOH, NH₃); <b>non-electrolyte</b> (no ions, does not conduct – glucose, ethanol).</li>
<li>For equal concentrations, a strong acid has a <b>lower pH and higher conductivity</b> than a weak acid, because it produces more ions.</li></ul>
<p>Naming: HNO₂ nitrous acid; HF hydrofluoric acid; HCOOH methanoic (formic) acid; HOCl hypochlorous acid; HCN hydrocyanic acid.</p>`],
    ['pH, Kw, Ka and pKa', `
<div class="key">pH = −log[H₃O⁺] &nbsp; [H₃O⁺] = 10⁻ᵖᴴ &nbsp; Kw = [H₃O⁺][OH⁻] = 1.0 × 10⁻¹⁴ at 25 °C &nbsp; pH + pOH = 14</div>
<div class="key">For HA + H₂O ⇌ A⁻ + H₃O⁺: &nbsp; <b>Ka = [A⁻][H₃O⁺] / [HA]</b> &nbsp;&nbsp; <b>pKa = −log Ka</b>, Ka = 10⁻ᵖᴷᵃ<br><b>Larger Ka / smaller pKa → stronger acid</b> (dissociates more). Ka is not changed by concentration – only by temperature.</div>
<div class="ex"><b>Ranking (SPFSC 2023):</b> pKa CH₃COOH 4.76, HOCl 7.53, HCN 9.40 → strength HCN &lt; HOCl &lt; CH₃COOH.</div>
<div class="key"><b>Weak acid pH</b> (assume [HA] ≈ c): [H₃O⁺] = √(Ka × c) = [A⁻]<br><b>Weak base:</b> [OH⁻] = √(Kb × c), Kb = Kw/Ka</div>
<div class="ex"><b>SPFSC 2022:</b> vinegar 0.667 mol/L CH₃COOH, Ka = 1.8×10⁻⁵. [H₃O⁺] = √(1.8×10⁻⁵ × 0.667) = 3.46×10⁻³ → <b>pH = 2.46</b>.</div>
<div class="ex"><b>SPFSC 2025:</b> 0.1 M HNO₂, Ka = 4.5×10⁻⁴: [H₃O⁺] = [NO₂⁻] = √(4.5×10⁻⁵) = <b>6.7×10⁻³ mol/L</b>; [HNO₂] ≈ 0.093 mol/L.</div>
<p><b>Salts:</b> salt of weak acid + strong base (CH₃COONa) → basic; strong acid + weak base (NH₄Cl) → acidic; strong + strong (NaCl) → neutral (pH 7).</p>`],
    ['Buffer solutions', `
<div class="key">A <b>buffer</b> is a solution that <b>resists changes in pH</b> when small amounts of acid or base are added (or on dilution). It contains a <b>weak acid and its conjugate base</b> (CH₃COOH / CH₃COO⁻) or a <b>weak base and its conjugate acid</b> (NH₃ / NH₄⁺) in similar amounts.</div>

  notes: [
    ['Solubility and Ksp', `
<div class="key"><b>Solubility</b> – the maximum amount of solute that dissolves in a given amount of solvent at a particular temperature to form a <b>saturated solution</b> (g/L, g/100 g water or mol/L). e.g. 359 g of NaCl dissolves in 1 L of water at 25 °C.</div>
<div class="key"><b>Solubility product (Ksp)</b> – the equilibrium constant for a sparingly soluble ionic solid in equilibrium with its ions in a saturated solution (the product of the ion concentrations, each raised to the power of its coefficient).</div>
<table><tr><th>Type</th><th>Dissociation</th><th>Ksp expression</th><th>Ksp in terms of s</th></tr>
<tr><td>AB (AgCl, CaSO₄, BaSO₄)</td><td>CaSO₄(s) ⇌ Ca²⁺ + SO₄²⁻</td><td>[Ca²⁺][SO₄²⁻]</td><td>s² → s = √Ksp</td></tr>
<tr><td>AB₂ (PbCl₂, BaF₂, Mg(OH)₂, PbI₂)</td><td>PbCl₂(s) ⇌ Pb²⁺ + 2Cl⁻</td><td>[Pb²⁺][Cl⁻]²</td><td>s(2s)² = 4s³</td></tr>
<tr><td>A₂B (Ag₂CrO₄)</td><td>Ag₂CrO₄ ⇌ 2Ag⁺ + CrO₄²⁻</td><td>[Ag⁺]²[CrO₄²⁻]</td><td>4s³</td></tr></table>
<div class="ex"><b>SPFSC 2022:</b> CaSO₄, Ksp = 2.4×10⁻⁵ → s = √(2.4×10⁻⁵) = <b>4.9×10⁻³ mol/L</b><br><b>SPFSC 2024:</b> BaF₂, Ksp = 1.84×10⁻⁷ → 4s³ = 1.84×10⁻⁷, s = ∛(4.6×10⁻⁸) = <b>3.6×10⁻³ mol/L</b><br><b>SPFSC 2020:</b> PbCl₂, Ksp = 1.7×10⁻⁵ → s = ∛(4.25×10⁻⁶) = <b>1.6×10⁻² mol/L</b></div>
<p>Smaller Ksp (for salts of the same type) → less soluble.</p>`],
    ['Ionic product: will a precipitate form?', `

<div class="ex"><b>SPFSC 2023:</b> 10.0 mL 2.0×10⁻⁴ M Na₂SO₄ + 100.0 mL 3.2×10⁻⁴ M BaCl₂ (total 110.0 mL).<br>[Ba²⁺] = 3.2×10⁻⁴ × 100/110 = 2.91×10⁻⁴ M; [SO₄²⁻] = 2.0×10⁻⁴ × 10/110 = 1.82×10⁻⁵ M<br>IP = 5.3×10⁻⁹ &gt; Ksp (1.08×10⁻¹⁰) → <b>BaSO₄ precipitates</b>.</div>
<div class="ex"><b>SPFSC 2019 (correct method):</b> 20 mL 0.02 M CaCl₂ + 20 mL 0.04 M Na₂SO₄ → [Ca²⁺] = 0.01 M, [SO₄²⁻] = 0.02 M. IP = 0.01 × 0.02 = <b>2×10⁻⁴</b> (multiply, don't add!) &gt; 2.4×10⁻⁵ → precipitate forms.</div>`],
    ['Factors affecting solubility', `
<ul><li><b>Common ion effect</b> – a salt is <b>less soluble</b> in a solution that already contains one of its ions. Adding Na₂SO₄ to saturated CaSO₄ increases [SO₄²⁻], so equilibrium shifts left (Le Chatelier) and CaSO₄ precipitates. PbI₂ is less soluble in Pb(NO₃)₂(aq) than in Ba(NO₃)₂(aq); PbCl₂ less soluble in NaCl(aq) than in water.</li>
<li><b>Temperature</b> – if dissolving is <b>endothermic</b> (most solids, e.g. KCl), raising T shifts equilibrium right → solubility <b>increases</b>. If exothermic, solubility decreases with T.</li>
<li><b>Gases</b> – solubility <b>decreases</b> when temperature increases or pressure decreases (warm fizzy drinks go flat; warm lagoon water holds less O₂).</li>
<li><b>pH</b> – hydroxides and carbonates dissolve better in acid (H⁺ removes OH⁻/CO₃²⁻).</li>
<li><b>Nature of solute and solvent</b> – "like dissolves like"; balance between lattice energy and hydration energy.</li></ul>
