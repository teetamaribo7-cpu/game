function quizPool(key) {
  if (key === 'mixed') return allQs();
  if (/^y20\d\d$/.test(key)) return allQs().filter(function (q) { return yearOf(q) === key.slice(1); });
  return APP.subs[key] ? APP.subs[key].qs.map(function (q) { q.sub = key; return q; }) : [];
}
function quizTitle(key) {
  if (key === 'mixed') return 'Mixed Exam Practice';
  if (/^y20\d\d$/.test(key)) return 'SPFSC ' + key.slice(1) + ' Questions';
  return key + ' ' + APP.subName[key];
}
function setupPage(key) {
  var pool = quizPool(key); if (!pool.length) return home();
  var col = APP.subStrand[key] ? APP.subStrand[key].col : '#1e3a8a';
  var past = pool.filter(function (q) { return yearOf(q); }).length;
  var html = header('Quiz', quizTitle(key), true, col) + '<main class="wrap" style="--accent:' + col + '"><div class="setup">';
  html += '<div class="setup-ic">✎</div><h2>' + quizTitle(key) + '</h2><p class="muted">' + pool.length + ' questions available • ' + past + ' from SPFSC past papers</p>' + bestBadge(key);
  html += '<p class="hint">Choose an answer to see instantly if it is right, with a full explanation. Your best score is saved on this phone.</p><div class="choices">';
  var opts = key === 'mixed' ? [20, 40] : [10, 20];
  opts.forEach(function (n) { if (n < pool.length) html += '<button class="btn" onclick="startQuiz(\'' + key + '\',' + n + ')">' + n + ' questions</button>'; });
  html += '<button class="btn dark" onclick="startQuiz(\'' + key + '\',' + pool.length + ')">All ' + pool.length + ' questions</button></div>';
  if (APP.subs[key]) html += '<button class="btn ghost wide" onclick="go(\'#/n/' + key + '\')">📖 Read the notes first</button>';
  return html + '</div></main>';
}

function solPage(y) {
  var rows = SOL[y]; if (!rows) return solYearsPage();
  var n = rows.filter(function (r) { return r[0] !== '#'; }).length;
  var html = header('SPFSC ' + y + ' Solutions', n + ' questions with worked answers', true) + '<main class="wrap solpage">';
  html += '<div class="soltools"><button class="btn ghost" onclick="document.querySelectorAll(\'.pq\').forEach(function(e){e.classList.add(\'open\')})">Show all solutions</button><button class="btn ghost" onclick="document.querySelectorAll(\'.pq\').forEach(function(e){e.classList.remove(\'open\')})">Hide all</button></div>';
  html += '<button class="btn wide" onclick="go(\'#/setup/y' + y + '\')">✎ Practise ' + y + ' as a multiple-choice quiz</button>';
  rows.forEach(function (r) {
    if (r[0] === '#') { html += '<h2 class="sec">' + r[1] + '</h2>'; return; }
    html += '<div class="pq"><div class="pqh"><span class="chip">Q' + r[0] + '</span></div><div class="pqq">' + h(r[1]) + '</div>' + (r[3] ? '<div class="fig qfig">' + r[3] + '</div>' : '') +
      '<button class="btn ghost showsol" onclick="this.parentNode.classList.toggle(\'open\')"><span class="s1">Show solution ▾</span><span class="s2">Hide solution ▴</span></button><div class="sol"><div class="solh">Solution</div>' + r[2] + '</div></div>';
  });
  return html + '</main>' + footer();
}

function yearsPage() {
  var qs = allQs(), years = {};
  qs.forEach(function (q) { var y = yearOf(q); if (y) years[y] = (years[y] || 0) + 1; });
  var html = header('Past Papers', 'Questions grouped by SPFSC exam year', true) + '<main class="wrap"><p class="muted center">Every question below is taken from, or based on, that year’s SPFSC Chemistry paper and re-written as multiple choice.</p><button class="solcard" onclick="go(\'#/sol\')"><span class="picon">✓</span><span><b>Full worked solutions</b><small>See the original written questions with model answers</small></span><span class="arrow">›</span></button><div class="years">';
  Object.keys(years).sort().reverse().forEach(function (y) {
    html += '<button class="ycard" onclick="go(\'#/setup/y' + y + '\')"><b>' + y + '</b><small>' + years[y] + ' questions</small>' + bestBadge('y' + y) + '</button>';
  });
  return html + '</div></main>' + footer();
}

/* ---------- quiz engine ---------- */
var QZ = null;
function startQuiz(key, n) {
  var pool = shuffle(quizPool(key)).slice(0, n);
  QZ = { key: key, items: pool.map(function (q) { var order = shuffle([0, 1, 2, 3]); return { q: q, order: order, pick: null }; }), i: 0, score: 0 };
  go('#/play/' + key);
}
function playPage() {
  if (!QZ) return home();
  var it = QZ.items[QZ.i], q = it.q, n = QZ.items.length;
  var col = APP.subStrand[q.sub] ? APP.subStrand[q.sub].col : '#1e3a8a';
  var html = header(quizTitle(QZ.key), 'Question ' + (QZ.i + 1) + ' of ' + n, true, col) + '<main class="wrap quiz" style="--accent:' + col + '">';
  html += '<div class="qtop"><div class="prog"><i style="width:' + ((QZ.i) / n * 100) + '%"></i></div><span class="score">Score ' + QZ.score + '</span></div>';
  html += '<div class="qcard"><div class="qmeta"><span class="chip">Q' + (QZ.i + 1) + '</span>' + (q.s ? '<span class="chip src">' + (yearOf(q) && !/^Based/.test(q.s) ? 'SPFSC ' : '') + h(q.s) + '</span>' : '') + (QZ.key.length > 3 || /^y/.test(QZ.key) ? '<span class="chip">' + q.sub + '</span>' : '') + '</div>';
  html += '<div class="qtext">' + h(q.q) + '</div>' + (q.d ? '<div class="fig qfig">' + q.d + '</div>' : '') + '<div class="opts">';
  it.order.forEach(function (oi, pos) {
    var cls = 'opt';
    if (it.pick !== null) { if (oi === 0) cls += ' right'; else if (oi === it.pick) cls += ' wrong'; else cls += ' dim'; }
    html += '<button class="' + cls + '" ' + (it.pick !== null ? 'disabled' : '') + ' onclick="answer(' + oi + ')"><span class="L">' + 'ABCD'[pos] + '</span><span>' + h(q.o[oi]) + '</span></button>';
  });
  html += '</div>';
  if (it.pick !== null) {
    var ok = it.pick === 0;
    html += '<div class="explain ' + (ok ? 'ok' : 'no') + '"><b>' + (ok ? '✔ Correct!' : '✘ Not quite – the answer is ' + 'ABCD'[it.order.indexOf(0)] + '.') + '</b><p>' + h(q.e) + '</p></div>';
    html += '<button class="btn wide" onclick="nextQ()">' + (QZ.i + 1 < n ? 'Next question ›' : 'See my results ›') + '</button>';
  }
  return html + '</div></main>';
}
function answer(oi) {
  var it = QZ.items[QZ.i]; if (it.pick !== null) return;
  it.pick = oi; if (oi === 0) QZ.score++;
  render(); var e = $('.explain'); if (e) e.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
function nextQ() {
  if (QZ.i + 1 < QZ.items.length) { QZ.i++; render(); window.scrollTo(0, 0); }
  else { QZ.done = true; var pct = Math.round(QZ.score / QZ.items.length * 100); STORE.setBest(QZ.key, pct); history.replaceState(null, '', '#/result'); render(); window.scrollTo(0, 0); }
}
function resultPage() {
  if (!QZ || !QZ.done) return home();
  var n = QZ.items.length, pct = Math.round(QZ.score / n * 100);
  var msg = pct >= 80 ? 'Excellent work! You are exam ready on this topic.' : pct >= 50 ? 'Good effort – review the questions you missed and try again.' : 'Keep going! Read the notes again, then retry the quiz.';
  var R = 54, C = 2 * Math.PI * R;
  var html = header('Results', quizTitle(QZ.key), false) + '<main class="wrap"><div class="result">';
  html += '<svg width="140" height="140" viewBox="0 0 140 140"><circle cx="70" cy="70" r="' + R + '" fill="none" stroke="var(--line)" stroke-width="12"/><circle cx="70" cy="70" r="' + R + '" fill="none" stroke="' + (pct >= 80 ? '#16a34a' : pct >= 50 ? '#d97706' : '#dc2626') + '" stroke-width="12" stroke-linecap="round" stroke-dasharray="' + (C * pct / 100) + ' ' + C + '" transform="rotate(-90 70 70)"/><text x="70" y="66" text-anchor="middle" font-size="30" font-weight="800" fill="currentColor">' + pct + '%</text><text x="70" y="92" text-anchor="middle" font-size="13" fill="currentColor">' + QZ.score + ' / ' + n + '</text></svg>';
  html += '<h2>' + msg + '</h2><div class="btnrow"><button class="btn" onclick="startQuiz(\'' + QZ.key + '\',' + n + ')">↻ Try again</button>' + (APP.subs[QZ.key] ? '<button class="btn ghost" onclick="go(\'#/n/' + QZ.key + '\')">📖 Notes</button>' : '') + '<button class="btn ghost" onclick="go(\'#/\')">⌂ Home</button></div></div>';
  var wrong = QZ.items.filter(function (it) { return it.pick !== 0; });
  if (wrong.length) {
    html += '<h2 class="sec">Review your mistakes (' + wrong.length + ')</h2>';
    wrong.forEach(function (it) {
      html += '<div class="review"><div class="qmeta">' + (it.q.s ? '<span class="chip src">' + h(it.q.s) + '</span>' : '') + '<span class="chip">' + it.q.sub + '</span></div><div class="qtext sm">' + h(it.q.q) + '</div>' + (it.q.d ? '<div class="fig qfig">' + it.q.d + '</div>' : '') +
        '<div class="ans no">Your answer: ' + h(it.q.o[it.pick]) + '</div><div class="ans ok">Correct: ' + h(it.q.o[0]) + '</div><p class="muted">' + h(it.q.e) + '</p></div>';
    });
  } else html += '<p class="center">🎉 Perfect score – no mistakes to review!</p>';
  return html + '</main>' + footer();
}

function formulasPage() {
  var rows = [
    ['Atomic structure', 'Max electrons in shell = 2n² • s 2, p 6, d 10 • Order: 1s 2s 2p 3s 3p 4s 3d 4p • Cr [Ar]3d⁵4s¹, Cu [Ar]3d¹⁰4s¹ • Ions lose 4s before 3d'],
    ['Nuclear', 'α = ⁴₂He, β = ⁰₋₁e, γ = 0 • Remaining = initial × (½)ⁿ, n = t ÷ t½'],
    ['Heat', 'q = mcΔT • ΔH = −q ÷ n • c(water) = 4.18 J g⁻¹ °C⁻¹'],
    ['Hess’s law', 'ΔrH = ΣΔfH(products) − ΣΔfH(reactants) • ΔH = Σ bonds broken − Σ bonds formed • ΔfH = ΣΔcH(reactants) − ΣΔcH(products)'],
    ['Born–Haber', 'ΔfH = ΔatH(metal) + ΔatH(non-metal) + IE + EA + ΔlattH(formation)'],
    ['Kinetics', 'rate = k[A]ᵐ[B]ⁿ • overall order = m + n • first order: k = 0.693 ÷ t½'],
    ['Electrochemistry', 'E°cell = E°(cathode) − E°(anode) • Q = I × t • n(e⁻) = Q ÷ 96 500 • F = 96 500 C mol⁻¹ • Cell notation: anode | ion ‖ ion | cathode'],
    ['Equilibrium', 'aA + bB ⇌ cC + dD: Kc = [C]ᶜ[D]ᵈ ÷ [A]ᵃ[B]ᵇ (leave out solids and liquids)'],
    ['Acids & bases', 'pH = −log[H₃O⁺] • [H₃O⁺] = 10⁻ᵖᴴ • Kw = [H₃O⁺][OH⁻] = 1.0×10⁻¹⁴ • pH + pOH = 14 • pKa = −log Ka • pKa + pKb = 14'],
    ['Weak acid', '[H₃O⁺] = √(Ka × c) • Ka = [A⁻][H₃O⁺] ÷ [HA]'],
    ['Buffer', 'pH = pKa + log([A⁻] ÷ [HA]) • at half-equivalence pH = pKa'],
    ['Solubility', 'AB: Ksp = s² • AB₂ / A₂B: Ksp = 4s³ • IP > Ksp → precipitate'],
    ['Moles', 'n = m ÷ M • c = n ÷ V(L) • C₁V₁ = C₂V₂ (dilution)']
  ];
  var html = header('Formula & Data Sheet', 'Key equations for the SPFSC exam', true) + '<main class="wrap"><div class="flist">';
  rows.forEach(function (r) { html += '<div class="frow"><b>' + r[0] + '</b><div>' + r[1].split(' • ').map(function (x) { return '<span>' + x + '</span>'; }).join('') + '</div></div>'; });
  html += '</div><h2 class="sec">Useful E° values (V)</h2><div class="flist"><div class="frow"><div>' +
    ['Mg²⁺/Mg −2.37', 'Al³⁺/Al −1.66', 'Zn²⁺/Zn −0.76', 'Fe²⁺/Fe −0.44', 'Ni²⁺/Ni −0.25', 'Pb²⁺/Pb −0.13', 'H⁺/H₂ 0.00', 'Cu²⁺/Cu +0.34', 'Ag⁺/Ag +0.80', 'Cl₂/Cl⁻ +1.36'].map(function (x) { return '<span>' + x + '</span>'; }).join('') + '</div></div></div>';
  return html + '</main>' + footer();
}

function aboutPage() {
  return header('How to use', 'Getting the most from this app', true) + '<main class="wrap"><div class="note">' +
    '<h3><span>1</span>Read the notes</h3><p>Each strand is split into the topics (sub-strands) of the <b>SPFSC Chemistry 2026 syllabus</b>. Notes are short and focus on what the exam asks, with worked examples from real past papers and labelled diagrams.</p>' +
    '<h3><span>2</span>Take the quiz</h3><p>All questions are <b>multiple choice</b>. Most come from <b>SPFSC past papers 2017–2025</b> (the year and question number are shown on each question), re-written so you can practise them on your phone. Some extra questions cover syllabus points not yet examined.</p>' +
    '<h3><span>3</span>Learn from mistakes</h3><p>After every answer you see a full explanation. At the end, review every question you got wrong. Your best score is saved on this phone.</p>' +
    '<h3><span>4</span>Practise like the exam</h3><p>Use <b>Mixed Exam Practice</b> and <b>Past Papers by Year</b> in the final weeks before the exam.</p>' +
    '<p class="muted">Works fully offline – no internet or data needed.</p>' +
    '<button class="btn ghost wide" id="rst" onclick="if(this.dataset.c){STORE.reset();go(\'#/\')}else{this.dataset.c=1;this.textContent=\'Tap again to clear all saved scores\'}">Reset my saved scores</button></div></main>' + footer();
}

/* ---------- router ---------- */
function render() {
  var r = location.hash.replace(/^#\/?/, '').split('/'), html;
  switch (r[0]) {
    case 's': html = strandPage(r[1]); break;
    case 'n': html = notesPage(r[1]); break;
    case 'setup': html = setupPage(r[1]); break;
    case 'play': html = playPage(); break;
    case 'result': html = resultPage(); break;
    case 'years': html = yearsPage(); break;
    case 'sol': html = r[1] ? solPage(r[1]) : solYearsPage(); break;
    case 'formulas': html = formulasPage(); break;
    case 'about': html = aboutPage(); break;
    default: html = home();
  }
  $('#app').innerHTML = html;
}
var lastHash = null;
window.addEventListener('hashchange', function () { render(); if (!/^#\/play/.test(location.hash)) window.scrollTo(0, 0); });
window.addEventListener('DOMContentLoaded', render);
</script>
</body></html>
