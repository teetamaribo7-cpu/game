<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#062a40">
<meta name="description" content="Te Wa – a Kiribati canoe fishing game for 1 to 4 players. Works offline on any phone.">
<title>Te Wa – Kiribati Canoe Fishing</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800;900&display=swap">
<style>
  /* Layout: full-bleed ocean canvas; HUD and menus float on it as dark glass panels */
  :root {
    --deep: #062a40; --panel: rgba(5, 28, 44, .82); --edge: rgba(255, 255, 255, .13);
    --sand: #ffe7b3; --sun: #ffc23d; --coral: #e8553d; --lagoon: #3fc1c9; --text: #f4f8fa; --muted: #9fb8c6;
    --display: 'Lilita One', 'Arial Rounded MT Bold', 'Trebuchet MS', sans-serif;
    --body: 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--deep); color: var(--text); font-family: var(--body);
    overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* HUD */
  #hud { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-start;
    gap: 8px; padding: calc(env(safe-area-inset-top, 0px) + 10px) 12px 0; pointer-events: none; }
  #chips { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
  .chip { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--edge);
    border-radius: 999px; padding: 5px 12px 5px 6px; font-weight: 800; font-size: 15px; backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px); }
  .chip .dot { width: 22px; height: 22px; border-radius: 50%; background: var(--c); box-shadow: inset 0 -3px 0 rgba(0,0,0,.25); }
  .chip .nm { max-width: 9ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-weight: 700; }
  .chip .sc { font-variant-numeric: tabular-nums; min-width: 2.2ch; }
  .chip .hooks { display: flex; gap: 1px; color: var(--sand); }
  .chip .hooks svg { width: 10px; height: 15px; }
  .chip .hooks svg.lost { opacity: .22; }
  .hud-right { display: flex; gap: 6px; align-items: center; pointer-events: auto; }
  .timer { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--edge);
    border-radius: 999px; padding: 6px 12px; font-weight: 900; font-variant-numeric: tabular-nums; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .sunbar { width: 64px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.15); overflow: hidden; }
  .sunbar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--coral), var(--sun)); transform-origin: left; }
  .ibtn { width: 38px; height: 38px; border-radius: 50%; background: var(--panel); border: 1px solid var(--edge);
    display: grid; place-items: center; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .ibtn svg { width: 18px; height: 18px; }

  /* Screens */
  .screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
    background: radial-gradient(ellipse at center, rgba(3, 20, 32, .35), rgba(3, 20, 32, .75)); }
  .panel { width: 100%; max-width: 440px; max-height: 100%; overflow-y: auto; background: var(--panel);
    border: 1px solid var(--edge); border-radius: 22px; padding: 22px; backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px); box-shadow: 0 24px 60px rgba(0, 0, 0, .45); display: flex; flex-direction: column; gap: 14px; }
  .panel > * { flex-shrink: 0; }
  .brand { display: flex; flex-direction: column; gap: 2px; }
  .brand h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(52px, 14vw, 72px); line-height: .95;
    color: var(--sand); letter-spacing: .02em; text-shadow: 0 3px 0 #b8542f, 0 8px 24px rgba(0,0,0,.35); }
  .brand p { margin: 0; color: var(--muted); font-weight: 700; }
  h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 30px; color: var(--sand); text-wrap: balance; letter-spacing: .01em; }
  .greet { margin: 0; line-height: 1.45; }
  .modes { display: flex; flex-direction: column; gap: 8px; }
  .mode { display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 12px; text-align: left;
    background: rgba(255,255,255,.06); border: 1px solid var(--edge); border-radius: 16px; padding: 12px 14px; transition: background .15s, transform .1s; }
  .mode:hover { background: rgba(255,255,255,.11); }
  .mode:active { transform: scale(.98); }
  .mode.primary { background: linear-gradient(180deg, #f26b4f, #d9452c); border-color: rgba(255,255,255,.25); }
  .mode .ic { width: 44px; height: 44px; border-radius: 12px; background: rgba(0,0,0,.2); display: grid; place-items: center; }
  .mode .ic svg { width: 28px; height: 28px; }
  .mode b { display: block; font-size: 18px; font-weight: 900; }
  .mode small { display: block; color: rgba(255,255,255,.72); font-size: 13px; font-weight: 600; margin-top: 1px; }
  .mode .arrow { opacity: .6; font-size: 20px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row > * { flex: 1 1 150px; min-width: 0; }
  .btn { padding: 12px 14px; border-radius: 12px; background: rgba(255,255,255,.08); border: 1px solid var(--edge); font-weight: 800; }
  .btn:hover { background: rgba(255,255,255,.14); }
  .btn.primary { background: linear-gradient(180deg, #f26b4f, #d9452c); border-color: rgba(255,255,255,.25); font-size: 19px; padding: 14px; }
  .seg { display: flex; background: rgba(0,0,0,.25); border-radius: 12px; padding: 3px; gap: 3px; }
  .seg button { flex: 1; min-width: 0; padding: 8px 6px; border-radius: 9px; font-weight: 800; color: var(--muted); background: transparent; }
  .seg button[aria-pressed="true"] { background: var(--lagoon); color: #042030; }
  .meta { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-weight: 700; font-size: 14px; }
  .meta b { color: var(--sun); font-size: 18px; font-variant-numeric: tabular-nums; }
  .label { font-size: 12px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 800; }
  .names { display: flex; flex-direction: column; gap: 8px; }
  .name-row { display: flex; align-items: center; gap: 10px; }
  .name-row i { flex: 0 0 26px; height: 26px; border-radius: 50%; background: var(--c); }
  .name-row input { flex: 1; min-width: 0; font: inherit; font-weight: 700; color: var(--text); background: rgba(0,0,0,.25);
    border: 1px solid var(--edge); border-radius: 10px; padding: 10px 12px; }
  .how { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; line-height: 1.4; }
  .species { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  .species div { background: rgba(255,255,255,.06); border-radius: 10px; padding: 8px 10px; font-size: 13px; }
  .species b { display: block; font-size: 14px; }
  .species span { color: var(--muted); }
  .keys { font-size: 13px; color: var(--muted); line-height: 1.5; }
  .big { font-family: var(--display); font-size: 64px; line-height: 1; color: var(--sun); text-align: center; }
  .stats { display: flex; justify-content: center; gap: 24px; color: var(--muted); font-weight: 700; }
  .stats b { color: var(--text); font-size: 20px; display: block; text-align: center; font-variant-numeric: tabular-nums; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); text-align: right; padding: 4px 6px; font-weight: 800; }
  th:first-child, td:first-child { text-align: left; }
  td { padding: 8px 6px; border-top: 1px solid var(--edge); text-align: right; font-weight: 700; }
  td .who { display: flex; align-items: center; gap: 8px; min-width: 0; }
  td .who i { flex: 0 0 14px; height: 14px; border-radius: 50%; background: var(--c); }
  td .who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  tr.win td { color: var(--sun); }
  .catch { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .catch span { background: rgba(255,255,255,.07); border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 700; }
  .fact { background: rgba(63, 193, 201, .12); border: 1px solid rgba(63, 193, 201, .3); border-radius: 12px; padding: 10px 12px; font-size: 14px; line-height: 1.45; }
  .fact b { color: var(--lagoon); display: block; font-size: 11px; letter-spacing: .09em; text-transform: uppercase; margin-bottom: 2px; }
  .badge { align-self: center; background: var(--sun); color: #3a2400; font-weight: 900; border-radius: 999px; padding: 4px 12px; font-size: 14px; }
  .answers { display: grid; gap: 8px; }
  .ans { text-align: left; padding: 12px 14px; border-radius: 12px; background: rgba(255,255,255,.07); border: 1px solid var(--edge); font-weight: 800; font-size: 16px; }
  .ans:hover:not(:disabled) { background: rgba(255,255,255,.13); }
  .ans:disabled { cursor: default; }
  .ans.right { background: rgba(53,179,107,.35); border-color: #35b36b; }
  .ans.wrong { background: rgba(232,85,61,.35); border-color: var(--coral); }
  .q { font-size: 24px; line-height: 1.2; }
  .fact.ok { background: rgba(53,179,107,.14); border-color: rgba(53,179,107,.5); }
  .fact.ok b { color: #6fe0a0; }
  .fact.bad { background: rgba(232,85,61,.14); border-color: rgba(232,85,61,.5); }
  .fact.bad b { color: #ff9a8a; }
  .who-chip { display: inline-flex; gap: 6px; align-items: center; font-weight: 800; }
  .who-chip i { width: 12px; height: 12px; border-radius: 50%; background: var(--c); }
  #cardArt { width: 100%; height: 150px; border-radius: 14px; display: block; }
  .sub { margin: -8px 0 0; color: var(--muted); font-weight: 700; }
  .facts { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; line-height: 1.45; }
  .book { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; }
  .book button { background: rgba(255,255,255,.06); border: 1px solid var(--edge); border-radius: 12px; padding: 8px;
    display: flex; flex-direction: column; gap: 2px; align-items: center; min-width: 0; }
  .book button:hover { background: rgba(255,255,255,.12); }
  .book canvas { width: 100%; height: 60px; }
  .book b { font-size: 14px; }
  .book small { color: var(--muted); font-size: 12px; font-weight: 700; }
  .book button.locked { opacity: .5; }
  .progress { height: 8px; border-radius: 4px; background: rgba(255,255,255,.12); overflow: hidden; }
  .progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--lagoon), #6fe0a0); }
  .coin { display: inline-block; width: 16px; height: 16px; border-radius: 50%; flex: 0 0 auto; vertical-align: -3px;
    background: radial-gradient(circle at 35% 30%, #fff6c2 0 18%, #ffd23d 40%, #c98a0b 100%); box-shadow: inset 0 0 0 2px #b77a06; }
  .coins { display: inline-flex; align-items: center; gap: 6px; color: var(--sun); font-variant-numeric: tabular-nums; font-weight: 900; }
  .chip .cn { display: inline-flex; align-items: center; gap: 4px; color: var(--sun); font-variant-numeric: tabular-nums; }
  .row.three > * { flex-basis: 96px; }
  .coinline { text-align: center; font-weight: 800; color: var(--sun); }
  #shopPreview { width: 100%; height: 150px; border-radius: 14px; }
  .shop { display: flex; flex-direction: column; gap: 6px; }
  .item { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; text-align: left; padding: 10px 12px;
    border-radius: 12px; background: rgba(255,255,255,.06); border: 1px solid var(--edge); }
  .item:hover { background: rgba(255,255,255,.11); }
  .item b { display: block; font-size: 15px; }
  .item small { display: block; color: var(--muted); font-size: 12px; font-weight: 700; }
  .item .tag { font-weight: 900; font-size: 13px; padding: 5px 10px; border-radius: 999px; background: rgba(0,0,0,.25); display: inline-flex; gap: 5px; align-items: center; white-space: nowrap; }
  .item.on { border-color: var(--lagoon); background: rgba(63,193,201,.14); }
  .item.on .tag { background: var(--lagoon); color: #042030; }
  .item.poor .tag { color: var(--muted); }
  .item .swatch { display: inline-block; width: 22px; height: 22px; border-radius: 6px; vertical-align: middle; margin-right: 8px; background: var(--sw); }
  .shake { animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  @media (prefers-reduced-motion: reduce) { .mode { transition: none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" hidden>
  <div id="chips"></div>
  <div class="hud-right">
    <div class="timer"><span class="sunbar"><i id="sunFill"></i></span><span id="timeTxt">90</span></div>
    <button class="ibtn" id="muteBtn" aria-label="Sound on or off"></button>
    <button class="ibtn" id="pauseBtn" aria-label="Pause"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg></button>
  </div>
</div>

<div class="screen" id="menu">
  <div class="panel">
    <div class="brand"><h1>Te Wa</h1><p data-t="tagline"></p></div>
    <p class="greet" data-t="greet"></p>
    <div class="modes">
      <button class="mode primary" data-mode="solo">
        <span class="ic"><svg viewBox="0 0 32 32"><path d="M4 22h24l-3 4H7z" fill="#fff"/><path d="M15 21V5l9 14z" fill="#fff"/></svg></span>
        <span><b data-t="solo"></b><small data-t="soloSub"></small></span><span class="arrow">›</span></button>
      <button class="mode" data-mode="versus">
        <span class="ic"><svg viewBox="0 0 32 32"><path d="M2 22h13l-2 3H4z" fill="#e8553d"/><path d="M8 21V9l5 10z" fill="#e8553d"/><path d="M17 22h13l-2 3h-9z" fill="#4c9be8"/><path d="M23 21V9l5 10z" fill="#4c9be8"/></svg></span>
        <span><b data-t="versus"></b><small data-t="versusSub"></small></span><span class="arrow">›</span></button>
      <button class="mode" data-mode="turns">
        <span class="ic"><svg viewBox="0 0 32 32"><rect x="10" y="4" width="12" height="24" rx="3" fill="none" stroke="#fff" stroke-width="2.4"/><path d="M3 12l4-3v6zM29 20l-4 3v-6z" fill="#ffc23d"/></svg></span>
        <span><b data-t="turns"></b><small data-t="turnsSub"></small></span><span class="arrow">›</span></button>
    </div>
    <div class="meta"><span data-t="best"></span><b id="bestScore">0</b></div>
    <div class="meta"><span data-t="wallet"></span><b class="coins"><i class="coin"></i><span id="walletMenu">0</span></b></div>
    <div class="row three">
      <button class="btn" id="shopBtn" data-t="shopBtn"></button>
      <button class="btn" id="bookBtn" data-t="bookBtn"></button>
      <button class="btn" id="howBtn" data-t="howBtn"></button>
    </div>
    <button class="btn primary" id="installBtn" hidden data-t="install"></button>
    <div class="row">
      <div class="seg" role="group" aria-label="Age level">
        <button data-level="junior" data-t="junior"></button><button data-level="senior" data-t="senior"></button>
      </div>
      <div class="seg" role="group" aria-label="Language">
        <button data-lang="ki">Kiribati</button><button data-lang="en">English</button>
      </div>
    </div>
  </div>
</div>

<div class="screen" id="how" hidden>
  <div class="panel">
    <h2 data-t="howTitle"></h2>
    <ol class="how" id="howList"></ol>
    <div class="species" id="speciesList"></div>
    <div class="keys" id="keysTxt"></div>
    <button class="btn primary" data-back data-t="gotIt"></button>
  </div>
</div>

<div class="screen" id="setup" hidden>
  <div class="panel">
    <h2 id="setupTitle"></h2>
    <div id="countWrap">
      <div class="label" data-t="players"></div>
      <div class="seg" id="countSeg" style="margin-top:6px">
        <button data-n="2">2</button><button data-n="3">3</button><button data-n="4">4</button>
      </div>
    </div>
    <div class="label" data-t="names"></div>
    <div class="names" id="nameList"></div>
    <div class="keys" id="setupHint"></div>
    <button class="btn primary" id="setupGo" data-t="start"></button>
    <button class="btn" data-back data-t="back"></button>
  </div>
</div>

<div class="screen" id="paused" hidden>
  <div class="panel">
    <h2 data-t="paused"></h2>
    <button class="btn primary" id="resumeBtn" data-t="resume"></button>
    <button class="btn" id="quitBtn" data-t="quit"></button>
  </div>
</div>

<div class="screen" id="turnEnd" hidden>
  <div class="panel">
    <h2 id="teTitle"></h2>
    <div class="big" id="teScore">0</div>
    <div class="catch" id="teCatch"></div>
    <div class="fact" id="teNext"></div>
    <button class="btn primary" id="teGo" data-t="ready"></button>
  </div>
</div>

<div class="screen" id="quiz" hidden>
  <div class="panel">
    <div class="meta"><span class="label" id="qLabel"></span><span class="who-chip" id="qWho"></span></div>
    <div class="progress"><i id="qBar"></i></div>
    <h2 class="q" id="qText"></h2>
    <div class="answers" id="qAnswers"></div>
    <div class="fact" id="qWhy" hidden><b id="qVerdict"></b><span id="qWhyTxt"></span></div>
    <button class="btn primary" id="qNext" hidden></button>
  </div>
</div>

<div class="screen" id="card" hidden>
  <div class="panel">
    <div class="label" id="cardLabel"></div>
    <canvas id="cardArt"></canvas>
    <h2 id="cardName"></h2>
    <p class="sub" id="cardEn"></p>
    <ul class="facts" id="cardFacts"></ul>
    <button class="btn primary" id="cardGo"></button>
  </div>
</div>

<div class="screen" id="book" hidden>
  <div class="panel">
    <h2 data-t="bookTitle"></h2>
    <p class="sub" id="bookCount" style="margin:0"></p>
    <div class="book" id="bookGrid"></div>
    <button class="btn primary" id="practiceBtn" data-t="practice"></button>
    <button class="btn" data-back data-t="back"></button>
  </div>
</div>

<div class="screen" id="groundPick" hidden>
  <div class="panel">
    <h2 data-t="groundTitle"></h2>
    <p class="sub" id="gearLine" style="margin:0"></p>
    <div class="shop" id="groundList"></div>
    <div class="meta"><span data-t="wallet"></span><b class="coins"><i class="coin"></i><span id="walletGround">0</span></b></div>
    <button class="btn" data-back data-t="back"></button>
  </div>
</div>

<div class="screen" id="market" hidden>
  <div class="panel">
    <h2 data-t="marketTitle"></h2>
    <p class="sub" id="marketWho" style="margin:0"></p>
    <p class="greet" data-t="marketIntro"></p>
    <table id="marketTable"><thead><tr><th data-t="catchCol"></th><th>kg</th><th>× price</th><th>= coins</th></tr></thead><tbody></tbody></table>
    <div class="meta"><span data-t="total"></span><b class="coins"><i class="coin"></i><span id="marketTotal">0</span></b></div>
    <p class="keys" style="margin:0" data-t="marketTip"></p>
    <button class="btn primary" id="sellBtn" data-t="sell"></button>
  </div>
</div>

<div class="screen" id="shop" hidden>
  <div class="panel">
    <div class="meta"><h2 data-t="shopTitle"></h2><b class="coins"><i class="coin"></i><span id="walletShop">0</span></b></div>
    <canvas id="shopPreview"></canvas>
    <div class="label" data-t="rods"></div>
    <div class="shop" id="rodList"></div>
    <div class="label" data-t="boats"></div>
    <div class="shop" id="boatList"></div>
    <div class="label" data-t="motors"></div>
    <div class="shop" id="motorList"></div>
    <div class="label" data-t="upgrades"></div>
    <div class="shop" id="upList"></div>
    <div class="label" data-t="sails"></div>
    <div class="shop" id="sailList"></div>
    <p class="keys" style="margin:0" data-t="shopNote"></p>
    <button class="btn" data-back data-t="back"></button>
  </div>
</div>

<div class="screen" id="installHelp" hidden>
  <div class="panel">
    <h2 data-t="installTitle"></h2>
    <p class="greet" data-t="installIntro"></p>
    <ol class="how">
      <li data-t="installEdge"></li>
      <li data-t="installChrome"></li>
      <li data-t="installAndroid"></li>
      <li data-t="installIphone"></li>
    </ol>
    <p class="keys" style="margin:0" data-t="installNote"></p>
    <button class="btn" data-back data-t="back"></button>
  </div>
</div>

<div class="screen" id="results" hidden>
  <div class="panel">
    <h2 id="resTitle"></h2>
    <div id="resSolo">
      <div class="big" id="resScore">0</div>
      <div class="stats"><span><b id="resFish">0</b><span data-t="fish"></span></span><span><b id="resKg">0</b>kg</span><span><b id="resQuiz">0</b><span data-t="quiz"></span></span></div>

function updatePlayer(p, dt) {

}

function updateFish(dt) {
  if (state === 'play') {
    const vs = mode === 'versus' ? 1.4 : 1;
    G.spawnT -= dt;
    const catchable = G.fish.filter(f => !f.sp.hazard && !f.sp.trash).length;
    if (G.spawnT <= 0 && catchable < 14 * vs) { spawnFish(pickSpecies()); G.spawnT = rand(0.6, 1.3) / vs; }
    G.sharkT -= dt; if (G.sharkT <= 0) { spawnFish('bakoa'); G.sharkT = rand(8, 12) / vs - (G.t / G.time) * 3; }
    G.turtleT -= dt; if (G.turtleT <= 0) { spawnFish('on'); G.turtleT = rand(14, 22); }
    G.trashT -= dt; if (G.trashT <= 0) { spawnFish('plastic'); G.trashT = rand(7, 12); }
    G.coinT -= dt; if (G.coinT <= 0 && G.coins.length < 10) { spawnCoin(); G.coinT = rand(2.5, 4.5); }
  }
  for (const f of G.fish) {
    if (f.hooked) { f.phase += dt * 10; continue; }
    const sp = f.sp;
    f.x += f.dir * f.speed * (1 + f.flee) * dt;
    f.flee = Math.max(0, f.flee - dt * 0.8);
    f.phase += dt * (sp.trash ? 1.4 : sp.kind === 'turtle' ? 2 : 4 + f.speed / 40);
    f.bob = Math.sin(f.phase * 0.5) * (sp.trash ? 5 : 8) * U;
    if (state !== 'play') continue;
    // Sharks drift towards lines that are in the water.
    if (sp.kind === 'shark') for (const p of G.players) {
      const L = p.line, dx = (hookX(p) - f.x) * f.dir;
      if (L.state !== 'idle' && dx > 0 && dx < 260 * U) f.d += clamp(L.y / DEPTH - f.d, -1, 1) * 0.35 * dt;
    }
    for (const p of G.players) checkHook(p, f);
  }
  G.fish = G.fish.filter(f => f.hooked || (f.x > -200 * U && f.x < W + 200 * U));
  for (const c of G.coins) { c.x += c.dir * c.speed * dt; c.phase += dt * 2.5; }
  G.coins = G.coins.filter(c => !c.taken && c.x > -40 * U && c.x < W + 40 * U);
}

function hits(f, hx, hy) {
  const r = Math.max(f.r, 12 * U), h = f.sp.kind === 'turtle' ? 0.5 : f.sp.h || 0.6;
  const dx = (hx - f.x) / r, dy = (hy - fishY(f)) / (r * h + 7 * U);
  return dx * dx + dy * dy < 1;
}
function checkHook(p, f) {
  const L = p.line; if (L.state === 'idle') return;
  const hx = hookX(p), hy = SEA + L.y;
  if (L.fish) {
    // Sharks steal a fish that is being reeled in.
    if (f.sp.kind === 'shark' && hits(f, L.fish.x, fishY(L.fish))) {
      G.fish = G.fish.filter(x => x !== L.fish); L.fish = null; sfx.cut();
      splash(hx, hy, 10, 0.4); popup(p.boat.x, SEA - 95 * U, t('stolen'), '#ff9a8a');
    }
    return;
  }
  if (!hits(f, hx, hy)) return;
  if (f.flee > 0 && f.sp.kind === 'fish') return;
  if (f.sp.kind === 'shark') {
    p.hooks--; L.state = 'up'; L.y = Math.min(L.y, 30 * U); sfx.cut();
    splash(hx, hy, 8, 0.3); popup(p.boat.x, SEA - 95 * U, t('lineCut'), '#ff9a8a'); discover('bakoa');
  } else if (f.sp.kind === 'turtle') {
    if (f.flee > 0) return;
    p.score = Math.max(0, p.score - 5); L.state = 'up'; f.flee = 2.5; sfx.turtle();
    popup(p.boat.x, SEA - 95 * U, t('turtle'), '#9fe3ff'); discover('on');
  } else {
    if (f.kg > rodMax()) {
      L.state = 'up'; f.flee = 2; sfx.cut(); splash(hx, hy, 8, 0.4);
      popup(p.boat.x, SEA - 95 * U, t('tooHeavy', { kg: f.kg, max: rodMax() }), '#ffb38a');
      return;
    }
    f.hooked = true; L.fish = f; L.state = 'up'; sfx.bite();
  }
}

function separateBoats() {
  const [a, b] = G.players, min = 110 * U, d = b.boat.x - a.boat.x;
  if (Math.abs(d) < min) {
    const push = (min - Math.abs(d)) / 2 * Math.sign(d || 1);
    a.boat.x = clamp(a.boat.x - push, boatHalf(), W - boatHalf());
    b.boat.x = clamp(b.boat.x + push, boatHalf(), W - boatHalf());
  }
}

function updateAmbient(dt) {
  for (const c of world.clouds) { c.x += c.v * U * dt; if (c.x > W + 120 * c.s) c.x = -120 * c.s; }
  const bd = G.bird; bd.t -= dt;
  if (bd.t <= 0) { bd.x += 70 * U * dt; if (bd.x > W * 0.4) discover('eitei'); bd.y = SEA * 0.28 + Math.sin(G.t * 0.9) * 12 * U;
    if (bd.x > W + 120) { bd.x = -120; bd.t = rand(9, 18); } }
  const tn = G.terns; tn.t -= dt;
  if (tn.t <= 0) { tn.x -= 55 * U * dt; if (tn.x < -150) { tn.x = W + 150; tn.t = rand(12, 22); } }
}

// ============ Drawing: scene ============
function drawSky(k, tm) {
  const g = ctx.createLinearGradient(0, 0, 0, SEA);
  g.addColorStop(0, ramp(PAL.skyTop, k)); g.addColorStop(1, ramp(PAL.skyLow, k));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, SEA + 4);

  // Sun: its path across the sky is the round timer.
  const sr = Math.max(16, SEA * 0.085);
  const sx = W * (0.1 + 0.8 * k), sy = SEA - SEA * 0.74 * Math.sin(Math.PI * (0.3 + 0.7 * k)) + sr * 0.2;
  const sc = ramp(PAL.sun, k);
  const glow = ctx.createRadialGradient(sx, sy, sr * 0.5, sx, sy, sr * 6);
  glow.addColorStop(0, rampA(PAL.sun, k, 0.55)); glow.addColorStop(1, rampA(PAL.sun, k, 0));
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, SEA);
  ctx.fillStyle = sc; ctx.beginPath(); ctx.arc(sx, sy, sr, 0, 7); ctx.fill();
  G_sun.x = sx; G_sun.y = sy; G_sun.c = sc;

  for (const c of world.clouds) drawCloud(c.x, c.y, c.s, k);
  if (ground !== 'ocean' || !G) for (const is of world.isles) drawFarIsle(is, k);
  if (ground === 'lagoon' || !G) drawNearIsle(world.near, k, tm);
}
const G_sun = { x: 0, y: 0, c: '#fff' };

function drawCloud(x, y, s, k) {
  const parts = [[0, 0, 26], [24, -8, 22], [48, 0, 24], [22, 6, 24], [-20, 6, 16], [68, 6, 14]];
  ctx.fillStyle = rampA(['#9fb7c8', '#9fb7c8', '#a0607a'], k, 0.35);
  ctx.beginPath(); for (const [dx, dy, r] of parts) { ctx.moveTo(x + (dx + r) * s, y + (dy + 5) * s); ctx.arc(x + dx * s, y + (dy + 5) * s, r * s, 0, 7); } ctx.fill();
  ctx.fillStyle = rampA(PAL.cloud, k, 0.92);
  ctx.beginPath(); for (const [dx, dy, r] of parts) { ctx.moveTo(x + (dx + r) * s, y + dy * s); ctx.arc(x + dx * s, y + dy * s, r * s, 0, 7); } ctx.fill();
}

function drawFarIsle(is, k) {
  const col = ramp(PAL.isle, k);
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.ellipse(is.x, SEA + 1, is.w / 2, 7 * U, 0, Math.PI, 0); ctx.fill();
  for (let i = 0; i < is.palms; i++) {
    const px = is.x - is.w * 0.35 + i * (is.w * 0.7 / Math.max(1, is.palms - 1)), h = (18 + (i % 2) * 6) * U;
    ctx.strokeStyle = col; ctx.lineWidth = 1.6 * U;
    ctx.beginPath(); ctx.moveTo(px, SEA - 4 * U); ctx.quadraticCurveTo(px + 2 * U, SEA - h / 2, px + (i % 2 ? 3 : -2) * U, SEA - h); ctx.stroke();
    const tx = px + (i % 2 ? 3 : -2) * U, ty = SEA - h;
    for (let a = 0; a < 6; a++) { const ang = Math.PI + a * Math.PI / 5; ctx.beginPath(); ctx.moveTo(tx, ty); ctx.quadraticCurveTo(tx + Math.cos(ang) * 6 * U, ty - 3 * U, tx + Math.cos(ang) * 10 * U, ty + Math.abs(Math.sin(ang)) * 2 * U + 4 * U); ctx.stroke(); }
  }
}

function drawNearIsle(n, k, tm) {
  // Sand bank
  const sand = ctx.createLinearGradient(0, SEA - 14 * U, 0, SEA + 4);
  sand.addColorStop(0, mix('#f4e3b5', '#e7b98a', k)); sand.addColorStop(1, mix('#d9c08a', '#b98a64', k));
  ctx.fillStyle = sand; ctx.beginPath(); ctx.ellipse(n.x, SEA + 4, n.w / 2, 16 * U, 0, Math.PI, 0); ctx.fill();
  // Low scrub
  ctx.fillStyle = mix('#3f8a4a', '#3a5a40', k);
  ctx.beginPath(); ctx.ellipse(n.x - n.w * 0.08, SEA - 8 * U, n.w * 0.3, 7 * U, 0, Math.PI, 0); ctx.fill();
  const heights = [62, 78, 54, 70];
  for (let i = 0; i < 4; i++) drawPalm(n.x - n.w * 0.32 + i * n.w * 0.2, SEA - 8 * U, heights[i] * U, tm + i * 1.3, k, i % 2 ? 1 : -1);
}

function drawPalm(x, y, h, tm, k, lean) {
  const sway = Math.sin(tm * 0.9) * 2.5 * U, tx = x + lean * h * 0.18 + sway, ty = y - h;
  const trunk = ctx.createLinearGradient(x - 4 * U, 0, x + 4 * U, 0);
  trunk.addColorStop(0, mix('#8a6a45', '#5e4230', k)); trunk.addColorStop(1, mix('#5f4529', '#3d2a1e', k));
  ctx.strokeStyle = trunk; ctx.lineWidth = 4.5 * U; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + lean * h * 0.02, y - h * 0.55, tx, ty); ctx.stroke();
  ctx.strokeStyle = mix('#4d3a24', '#33251a', k); ctx.lineWidth = 1 * U;
  for (let i = 1; i < 7; i++) { const q = i / 7, px = x + (tx - x) * q * q, py = y + (ty - y) * q; ctx.beginPath(); ctx.moveTo(px - 2.5 * U, py); ctx.lineTo(px + 2.5 * U, py - 1 * U); ctx.stroke(); }
  // Fronds
  const leaf = mix('#2f8a3e', '#2d5a36', k), leafDark = mix('#236b30', '#22452a', k);
  for (let a = 0; a < 8; a++) {
    const ang = -Math.PI + a * Math.PI / 7 + Math.sin(tm * 1.2 + a) * 0.05, len = (26 + (a % 3) * 5) * U;
    const ex = tx + Math.cos(ang) * len, ey = ty + Math.sin(ang) * len * 0.35 + len * 0.45;
    ctx.strokeStyle = a % 2 ? leaf : leafDark; ctx.lineWidth = 2 * U;
    ctx.beginPath(); ctx.moveTo(tx, ty); ctx.quadraticCurveTo(tx + Math.cos(ang) * len * 0.6, ty - 10 * U, ex, ey); ctx.stroke();
    ctx.lineWidth = 1 * U;
    for (let j = 2; j < 8; j++) {
      const q = j / 8, qx = tx + (Math.cos(ang) * len * 0.6) * 2 * q * (1 - q) + (ex - tx) * q * q, qy = ty + (-10 * U) * 2 * q * (1 - q) + (ey - ty) * q * q;
      ctx.beginPath(); ctx.moveTo(qx, qy); ctx.lineTo(qx + Math.cos(ang + 0.9) * 6 * U * (1 - q * 0.5), qy + 6 * U); ctx.stroke();
    }
  }
  ctx.fillStyle = mix('#6b4a22', '#43301a', k);
  for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(tx - 3 * U + i * 3 * U, ty + 3 * U, 2.6 * U, 0, 7); ctx.fill(); }
}

function drawWater(k, tm) {
  const g = ctx.createLinearGradient(0, SEA, 0, H);
  g.addColorStop(0, ramp(PAL.seaTop, k)); g.addColorStop(0.35, ramp(PAL.seaMid, k)); g.addColorStop(1, ramp(PAL.seaDeep, k));
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W + 8; x += 8) ctx.lineTo(x, waveY(x, tm));
  ctx.lineTo(W, H); ctx.closePath(); ctx.fill();

  // Sun rays through the water
  const rg = ctx.createLinearGradient(0, SEA, 0, SEA + DEPTH * 0.85);
  rg.addColorStop(0, `rgba(255,255,255,${0.09 * (1 - k * 0.6)})`); rg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = rg;
  for (let i = 0; i < 6; i++) {
    const x = ((i + 0.5) * W / 5 + Math.sin(tm * 0.25 + i * 1.7) * 30 * U + (G_sun.x - W / 2) * 0.2);
    const w = (18 + (i % 3) * 14) * U, lean = (G_sun.x - W / 2) * -0.25;
    ctx.beginPath(); ctx.moveTo(x - w / 2, SEA); ctx.lineTo(x + w / 2, SEA); ctx.lineTo(x + w * 1.4 + lean, SEA + DEPTH * 0.85); ctx.lineTo(x - w * 1.4 + lean, SEA + DEPTH * 0.85); ctx.fill();
  }
  // Caustic shimmer
  ctx.strokeStyle = `rgba(255,255,255,${0.07 * (1 - k * 0.5)})`; ctx.lineWidth = 1.5 * U;
  for (let row = 0; row < 4; row++) {
    const base = SEA + (14 + row * 18) * U;
    ctx.beginPath();
    for (let x = 0; x <= W; x += 10) {
      const y = base + Math.sin(x * 0.05 / U + tm * (1.2 + row * 0.3) + row) * 3 * U + Math.sin(x * 0.013 / U - tm) * 4 * U;
      x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  // Floating specks
  ctx.fillStyle = 'rgba(220,245,255,.25)';
  for (const m of world.motes) {
    const y = SEA + DEPTH * m.d + Math.sin(tm * 0.5 + m.ph) * 6 * U, x = (m.x + tm * 4 * U * m.s) % W;
    ctx.fillRect(x, y, m.s * U, m.s * U);
  }
}

function drawSeabed(k, tm) {
  // Sand
  const sg = ctx.createLinearGradient(0, H - 40 * U, 0, H);
  sg.addColorStop(0, mix('#d8c79b', '#8a7a62', k)); sg.addColorStop(1, mix('#b9a275', '#5f5344', k));
  ctx.fillStyle = sg; ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W + 10; x += 10) ctx.lineTo(x, groundY(x));
  ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
  // Ripples
  ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 1 * U;
  for (let x = 12 * U; x < W; x += 26 * U) { const y = groundY(x) + 8 * U; ctx.beginPath(); ctx.moveTo(x - 8 * U, y); ctx.quadraticCurveTo(x, y - 3 * U, x + 8 * U, y); ctx.stroke(); }
  for (const r of world.rocks) {
    const y = groundY(r.x) + 3 * U, rg = ctx.createLinearGradient(0, y - r.h, 0, y);
    rg.addColorStop(0, '#6f7a7d'); rg.addColorStop(1, '#3f4749');
    ctx.fillStyle = rg; ctx.beginPath(); ctx.ellipse(r.x, y, r.w / 2, r.h, 0, Math.PI, 0); ctx.fill();
  }
  for (const c of world.corals) drawCoral(c, tm);
  for (const gr of world.grass) {
    const y = groundY(gr.x) + 2 * U;
    for (let i = 0; i < gr.n; i++) {
      const bx = gr.x + (i - gr.n / 2) * 3 * U, h = gr.h * (0.7 + (i % 3) * 0.15), sw = Math.sin(tm * 1.3 + gr.ph + i * 0.5) * 7 * U;
      ctx.strokeStyle = i % 2 ? '#3f8f5a' : '#2f7449'; ctx.lineWidth = 2.4 * U; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(bx, y); ctx.quadraticCurveTo(bx + sw * 0.3, y - h * 0.5, bx + sw, y - h); ctx.stroke();
    }
  }
}

function drawCoral(c, tm) {
  const y = groundY(c.x) + 3 * U, s = c.s;
  if (c.type === 'brain') {
    const g = ctx.createRadialGradient(c.x - 4 * s, y - 12 * s, 2, c.x, y - 6 * s, 20 * s);
    g.addColorStop(0, mix(c.c, '#ffffff', 0.3)); g.addColorStop(1, mix(c.c, '#000000', 0.35));
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(c.x, y, 18 * s, 14 * s, 0, Math.PI, 0); ctx.fill();
    ctx.strokeStyle = mixA(c.c, '#000000', 0.45, 0.6); ctx.lineWidth = 1.2 * U;
    for (let i = 1; i < 4; i++) { ctx.beginPath(); ctx.ellipse(c.x, y, 18 * s * i / 4, 14 * s * i / 4, 0, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); }
  } else if (c.type === 'fan') {
    const R = rng(c.seed);
    ctx.strokeStyle = mixA(c.c, '#000000', 0.1, 0.85); ctx.lineWidth = 1.1 * U;
    for (let i = 0; i < 14; i++) {
      const a = -Math.PI / 2 + (i / 13 - 0.5) * 1.6 + Math.sin(tm * 0.8) * 0.03, len = (26 + R() * 12) * s;
      ctx.beginPath(); ctx.moveTo(c.x, y); ctx.quadraticCurveTo(c.x + Math.cos(a) * len * 0.5 + (R() - 0.5) * 6 * s, y + Math.sin(a) * len * 0.5, c.x + Math.cos(a) * len, y + Math.sin(a) * len); ctx.stroke();
    }
  } else {
    const R = rng(c.seed);
    ctx.strokeStyle = c.c; ctx.lineCap = 'round';
    const branch = (x, yy, ang, len, w, depth) => {
      const ex = x + Math.cos(ang) * len, ey = yy + Math.sin(ang) * len;
      ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x, yy); ctx.lineTo(ex, ey); ctx.stroke();
      if (depth > 0) { branch(ex, ey, ang - 0.45 - R() * 0.3, len * 0.72, w * 0.72, depth - 1); branch(ex, ey, ang + 0.45 + R() * 0.3, len * 0.72, w * 0.72, depth - 1); }
      else { ctx.fillStyle = mix(c.c, '#ffffff', 0.35); ctx.beginPath(); ctx.arc(ex, ey, w * 0.6, 0, 7); ctx.fill(); }
    };
    branch(c.x, y, -Math.PI / 2, 14 * s, 5 * s, 3);
  }
}

function drawSurface(k, tm) {
  ctx.strokeStyle = `rgba(255,255,255,${0.55 - k * 0.2})`; ctx.lineWidth = 1.6 * U;
  ctx.beginPath(); for (let x = 0; x <= W + 8; x += 8) { const y = waveY(x, tm); x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); } ctx.stroke();
  // Sun glitter on the surface
  const gx = G_sun.x;
  ctx.fillStyle = rampA(['#ffffff', '#fff6d0', '#ffb070'], k, 0.55);
  for (let i = 0; i < 12; i++) {
    const w = (22 - i) * U * (0.6 + 0.4 * Math.sin(tm * 3 + i * 2.1)), x = gx + Math.sin(i * 7.3 + tm * 0.7) * 18 * U;
    ctx.fillRect(x - w / 2, waveY(x, tm) + 3 * U + i * i * 0.45 * U, w, 1.4 * U);
  }
}

function drawFog(k) {
  const g = ctx.createLinearGradient(0, SEA, 0, H);
  const deep = ['#021a2a', '#021a2a', '#0a0a24'];
  g.addColorStop(0, rampA(deep, k, 0)); g.addColorStop(0.35, rampA(deep, k, 0.08)); g.addColorStop(1, rampA(deep, k, 0.45 + k * 0.15));
  ctx.fillStyle = g; ctx.fillRect(0, SEA, W, DEPTH);
}

// ============ Drawing: creatures ============
function drawCreature(f) {
  const sp = f.sp, y = fishY(f);
  ctx.save(); ctx.translate(f.x, y);
  if (f.hooked) ctx.rotate(-Math.PI / 2 + Math.sin(f.phase * 1.3) * 0.35);
  else { if (f.dir < 0) ctx.scale(-1, 1); ctx.rotate(Math.sin(f.phase) * 0.05); }
  if (sp.kind === 'turtle') drawTurtle(f.r, f.phase);
  else if (sp.kind === 'trash') drawTrash(f);
  else drawFishShape(sp, f.r, Math.sin(f.phase * (f.hooked ? 2.5 : 1.7)) * f.r * 0.12);
  ctx.restore();
}

function drawFishShape(sp, r, wag) {
  const h = sp.h * r, shark = sp.kind === 'shark';
  // Far pectoral wing (flying fish)
  if (sp.wings) {
    ctx.fillStyle = 'rgba(150,200,235,.55)';
    ctx.beginPath(); ctx.moveTo(r * 0.3, -h * 0.1); ctx.quadraticCurveTo(-r * 0.1, -h * 3.2 - wag, -r * 0.75, -h * 2.4 - wag); ctx.lineTo(-r * 0.1, -h * 0.2); ctx.fill();
  }
  // Tail
  ctx.fillStyle = sp.fin; ctx.beginPath();
  if (shark) {
    ctx.moveTo(-r * 0.82, -h * 0.25);
    ctx.quadraticCurveTo(-r * 1.05, -h * 1.1 + wag, -r * 1.38, -h * 2.1 + wag);
    ctx.quadraticCurveTo(-r * 1.18, -h * 0.5 + wag, -r * 1.12, h * 0.05 + wag * 0.5);
    ctx.quadraticCurveTo(-r * 1.2, h * 0.6 + wag, -r * 1.25, h * 1.05 + wag);
    ctx.quadraticCurveTo(-r * 1.0, h * 0.4, -r * 0.82, h * 0.2);
  } else {
    ctx.moveTo(-r * 0.76, 0);
    ctx.quadraticCurveTo(-r * 1.0, -h * 0.55 + wag, -r * 1.32, -h * 1.35 + wag);
    ctx.quadraticCurveTo(-r * 1.1, wag * 0.6, -r * 1.32, h * 1.35 + wag);
    ctx.quadraticCurveTo(-r * 1.0, h * 0.55 + wag, -r * 0.76, 0);
  }
  ctx.fill();
  if (shark) { ctx.fillStyle = '#1c2226'; ctx.beginPath(); ctx.moveTo(-r * 1.38, -h * 2.1 + wag); ctx.lineTo(-r * 1.26, -h * 1.45 + wag); ctx.lineTo(-r * 1.2, -h * 1.6 + wag); ctx.fill(); }
  // Dorsal fin
  ctx.fillStyle = sp.fin; ctx.beginPath();
  if (shark) { ctx.moveTo(r * 0.12, -h * 0.85); ctx.quadraticCurveTo(-r * 0.05, -h * 1.8, -r * 0.2, -h * 2.3); ctx.quadraticCurveTo(-r * 0.25, -h * 1.3, -r * 0.42, -h * 0.75); }
  else { ctx.moveTo(r * 0.25, -h * 0.9); ctx.quadraticCurveTo(0, -h * 1.7, -r * 0.28, -h * 1.45); ctx.lineTo(-r * 0.35, -h * 0.7); }
  ctx.fill();

function endRound(reason) {

  for (const p of G.players) p.quiz = 0;
  const n = mode === 'versus' ? 4 : 3;

  const ps = G.players;
  if (mode === 'turns') {
    const p = ps[0], r = roster[turnIndex];
    Object.assign(r, { score: p.score, kg: p.kg, count: p.count, caught: p.caught, quiz: p.quiz });

function showResults(list, reason) {
  const solo = mode === 'solo';
  $('resSolo').hidden = !solo; $('resTable').hidden = solo; $('resBest').hidden = true;
  const all = {};
  for (const p of list) for (const id in p.caught) all[id] = (all[id] || 0) + p.caught[id];
  if (solo) {
    const p = list[0];
    $('resTitle').textContent = t(reason);
    $('resScore').textContent = p.score; $('resFish').textContent = p.count; $('resKg').textContent = p.kg.toFixed(1);
    $('resQuiz').textContent = `${p.quiz}/3`;
    if (p.score > best) { best = p.score; store.set('tewa-best', best); $('resBest').hidden = false; }
    catchChips($('resCatch'), p.caught);

    const tie = ranked.length > 1 && ranked[0].score === ranked[1].score;
    $('resTitle').textContent = tie ? t('draw') : t('wins', { name: ranked[0].name });
    const tb = $('resTable').querySelector('tbody'); tb.textContent = '';
    ranked.forEach((p, i) => {
      const tr = document.createElement('tr'); if (i === 0 && !tie) tr.className = 'win';
      const who = document.createElement('td'), w = document.createElement('div'), dot = document.createElement('i'), nm = document.createElement('span');
      w.className = 'who'; w.style.setProperty('--c', p.color); nm.textContent = `${i + 1}. ${p.name}`; w.append(dot, nm); who.append(w);

function paintCreature(c, id, tm, locked) {

  const w = c.width / DPR, h = c.height / DPR;
  ctx = c.getContext('2d'); ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const g = ctx.createLinearGradient(0, 0, 0, h);

  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);

  ctx.save(); ctx.translate(w / 2, h / 2);
  if (locked) ctx.filter = 'brightness(0) opacity(0.45)';
  const size = Math.min(w * 0.3, h * 0.42);

  else if (id === 'on') { ctx.translate(-size * 0.1, 0); drawTurtle(size, tm * 3); }
  else if (id === 'plastic') { drawTrash({ r: size * 0.5, phase: tm, variant: 1 }); }

    b.textContent = open ? BOOK[id].name : '?'; sm.textContent = open ? BOOK[id].en : t('locked');
    btn.append(c, b, sm); grid.appendChild(btn);
    if (open) btn.onclick = () => openCard(id, false); else btn.disabled = true;
    btn._paint = () => { sizeCanvas(c); paintCreature(c, id, 1, !open); };
  }
  $('bookCount').textContent = t('bookCount', { n: found, total: BOOK_ORDER.length });
  show('book');
  grid.querySelectorAll('button').forEach(b => b._paint());
}
$('bookBtn').onclick = openBook;

// ============ Quiz ============
let asked = new Set();
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const num = x => String(Math.round(x * 10) / 10);

function mathQuestion() {
  const junior = [
    () => { const a = ri(2, 7), b = ri(1, 6); return { q: `You catch ${a} milkfish and ${b} skipjack. How many fish is that?`, n: a + b, why: `${a} + ${b} = ${a + b}` }; },
    () => { const a = ri(1, 2); return { q: `You have 3 hooks. A shark cuts ${a} of your lines. How many hooks are left?`, n: 3 - a, why: `3 − ${a} = ${3 - a}` }; },
    () => { const a = ri(7, 12), b = ri(2, 6); return { q: `There are ${a} fish in a school. ${b} swim away. How many are left?`, n: a - b, why: `${a} − ${b} = ${a - b}` }; },
    () => { const kg = ri(2, 5); return { q: `Milkfish sells for 2 coins per kg. How many coins for a ${kg} kg milkfish?`, n: kg * 2, why: `${kg} × 2 = ${kg * 2} coins` }; },
    () => { const a = ri(2, 5); return { q: `Each plastic bottle you clean up gives 3 points. You clean up ${a} bottles. How many points is that?`, n: a * 3, why: `${a} × 3 = ${a * 3}` }; },
  ];
  const senior = [
    () => { const n = ri(2, 5), w = ri(2, 7); return { q: `You catch ${n} skipjack. Each one weighs ${w} kg. What is the total weight in kg?`, n: n * w, why: `${n} × ${w} = ${n * w} kg` }; },
    () => { const k = ri(2, 8); return { q: `A skipjack scores 6 points plus 3 points for every kg. How many points is a ${k} kg skipjack worth?`, n: 6 + 3 * k, why: `6 + 3 × ${k} = ${6 + 3 * k}` }; },
    () => { const a = ri(11, 29) / 10, b = ri(11, 29) / 10, s = Math.round((a + b) * 10) / 10; return { q: `One milkfish weighs ${a} kg and another weighs ${b} kg. What is their total weight in kg?`, n: s, dec: true, why: `${a} + ${b} = ${num(s)} kg` }; },
    () => { const sc = ri(20, 60), tt = ri(1, 3); return { q: `Your score is ${sc}. You hook ${tt} turtle${tt > 1 ? 's' : ''} and lose 5 points each time. What is your score now?`, n: sc - 5 * tt, why: `${sc} − 5 × ${tt} = ${sc - 5 * tt}` }; },
    () => ({ q: 'A round of Te Wa lasts 90 seconds. How many minutes is that?', n: 1.5, dec: true, why: '90 ÷ 60 = 1.5 minutes' }),
    () => { const kg = ri(3, 9), pr = ri(2, 4); return { q: `At the market, fish sells for ${pr} coins per kg. How many coins do you get for ${kg} kg?`, n: kg * pr, why: `${kg} × ${pr} = ${kg * pr} coins` }; },
    () => { const sale = ri(30, 80), fuel = pick([6, 10]); return { q: `You sell your catch for ${sale} coins. Fuel for the outboard motor cost ${fuel} coins. What is your profit?`, n: sale - fuel, why: `${sale} − ${fuel} = ${sale - fuel} coins profit` }; },
  ];
  const m = pick(level === 'senior' ? senior : junior)();
  const step = m.dec ? 0.5 : m.n >= 20 ? 3 : 1;
  const opts = new Set([num(m.n)]);
  for (const o of [1, -1, 2, -2, 3, -3, 4]) { if (opts.size >= 4) break; const v = m.n + o * step; if (v >= 0) opts.add(num(v)); }
  return { q: m.q, a: [...opts], why: m.why };
}
function buildQuestions(n) {
  const bank = QUIZ.filter(q => level === 'senior' || q.level !== 'senior');
  let pool = bank.filter(q => !asked.has(q.q));
  if (pool.length < n) { asked.clear(); pool = bank.slice(); }
  const out = [mathQuestion()];
  while (out.length < n && pool.length) { const q = pool.splice(Math.floor(Math.random() * pool.length), 1)[0]; asked.add(q.q); out.push(q); }
  return out.sort(() => Math.random() - 0.5);
}

function runQuiz(players, n, practice, done) {
  const qs = buildQuestions(n); let i = 0, correct = 0;
  const next = () => {
    if (i >= qs.length) {
      if (!practice) return done();
      $('qLabel').textContent = ''; $('qWho').textContent = ''; $('qAnswers').textContent = ''; $('qWhy').hidden = true;
      $('qBar').style.width = '100%';
      $('qText').textContent = t('practiceDone', { c: correct, n: qs.length });
      $('qNext').hidden = false; $('qNext').textContent = t('backToBook'); $('qNext').onclick = openBook;
      return;
    }
    const q = qs[i], p = players[i % players.length];
    $('qLabel').textContent = t(practice ? 'practiceQuiz' : 'bonusQuiz', { i: i + 1, n: qs.length });
    const who = $('qWho'); who.textContent = '';
    if (players.length > 1) { const dot = document.createElement('i'); who.style.setProperty('--c', p.color); who.append(dot, t('answerFor', { name: p.name })); }
    $('qBar').style.width = `${(i / qs.length) * 100}%`;
    $('qText').textContent = q.q;
    $('qWhy').hidden = true; $('qNext').hidden = true;
    const box = $('qAnswers'); box.textContent = '';
    const answers = q.a.slice().sort(() => Math.random() - 0.5);
    for (const a of answers) {
      const b = document.createElement('button'); b.className = 'ans'; b.textContent = a;
      b.onclick = () => {
        const ok = a === q.a[0];
        box.querySelectorAll('button').forEach(x => { x.disabled = true; if (x.textContent === q.a[0]) x.classList.add('right'); });
        if (ok) { correct++; if (!practice) { p.score += 10; p.quiz = (p.quiz || 0) + 1; addCoins(2, p); } tone(660, 0.1, 'triangle', 0.1); tone(990, 0.18, 'triangle', 0.1, 0, 0.1); }
        else { b.classList.add('wrong'); tone(220, 0.25, 'sine', 0.1); }
        const why = $('qWhy'); why.hidden = false; why.className = 'fact ' + (ok ? 'ok' : 'bad');
        $('qVerdict').textContent = ok ? t(practice ? 'rightPractice' : 'right') : t('wrong', { a: q.a[0] });
        $('qWhyTxt').textContent = q.why || '';
        i++;
        $('qNext').hidden = false; $('qNext').textContent = i >= qs.length && !practice ? t('finish') : t('next');
        $('qNext').onclick = next; $('qNext').focus();
      };
      box.appendChild(b);
    }
    show('quiz');
  };
  next();
}
$('practiceBtn').onclick = () => runQuiz([{ name: '', color: PLAYER_COLORS[0] }], 5, true, openBook);

// ============ Fish market ============
function openMarket(players, done) {
  const tb = $('marketTable').querySelector('tbody'); tb.textContent = '';
  let total = 0;
  const addRow = (cells, cls) => { const tr = document.createElement('tr'); if (cls) tr.className = cls; for (const c of cells) { const td = document.createElement('td'); td.textContent = c; tr.append(td); } tb.appendChild(tr); };
  for (const p of players) {
    for (const id of CATCHABLE) {
      const kg = Math.round((p.kgBy[id] || 0) * 10) / 10; if (!kg) continue;
      const coins = Math.round(kg * PRICE[id]); total += coins;
      addRow([(players.length > 1 ? p.name + ': ' : '') + fishName(id) + ' × ' + p.caught[id], kg, PRICE[id], coins]);
    }
  }
  if (!tb.children.length) addRow([t('nothingToSell'), '', '', '0']);
  const fuel = G && G.fuelPaid || 0;
  if (fuel) addRow([t('fuelLine') + ' (' + t('fuel', { n: fuel }).toLowerCase() + ')', '', '', '−' + fuel]);
  $('marketWho').textContent = GROUNDS[ground].name + (players.length === 1 && mode !== 'solo' ? ' · ' + players[0].name : '');
  $('marketTotal').textContent = total;
  const btn = $('sellBtn'); btn.textContent = t('sell'); btn.disabled = false;
  btn.onclick = () => {
    btn.disabled = true;
    const each = players.length ? Math.floor(total / players.length) : 0;
    if (total) { addCoins(total); for (const p of players) p.coins = (p.coins || 0) + each; }
    btn.textContent = t('sold', { n: total });
    if (total) { [0, 0.08, 0.16, 0.24].forEach(d => tone(1320 + d * 2000, 0.08, 'square', 0.04, 0, d)); }
    setTimeout(done, total ? 900 : 200);
  };
  show('market');
}

// ============ Shop ============
let shopOpen = false;
function openShop() {
  shopOpen = true; renderShop(); show('shop'); sizeCanvas($('shopPreview'));
}
function renderShop() {
  showWallet();
  for (const [boxId, type] of [['rodList', 'rod'], ['boatList', 'boat'], ['motorList', 'motor'], ['upList', 'upgrade'], ['sailList', 'sail']]) {
    const box = $(boxId); box.textContent = '';
    for (const it of SHOP.filter(x => x.type === type)) {
      const b = document.createElement('button'), info = document.createElement('span'), nm = document.createElement('b'), ds = document.createElement('small'), tag = document.createElement('span');
      b.className = 'item'; tag.className = 'tag';
      if (it.sw) { const sw = document.createElement('i'); sw.className = 'swatch'; sw.style.setProperty('--sw', it.sw); nm.append(sw); }
      nm.append(it.name); ds.textContent = it.desc; info.append(nm, ds);
      const have = !!owned[it.id];
      if (type === 'sail' && equipped === it.id) { b.classList.add('on'); tag.textContent = t('using'); }
      else if (have) tag.textContent = type === 'sail' ? t('use') : t('owned');
      else if (it.req && !owned[it.req]) { tag.textContent = t('needItem', { item: SHOP.find(x => x.id === it.req).name }); b.classList.add('poor'); }
      else { const ci = document.createElement('i'); ci.className = 'coin'; tag.append(ci, String(it.price)); if (wallet < it.price) b.classList.add('poor'); }
      b.append(info, tag);
      b.onclick = () => {
        if (have) { if (type === 'sail') { equipped = it.id; saveWallet(); renderShop(); } return; }
        if (it.req && !owned[it.req]) { b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); tone(220, 0.2, 'sine', 0.08); return; }
        if (wallet < it.price) {
          tag.textContent = t('need', { n: it.price - wallet }); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
          tone(220, 0.2, 'sine', 0.08); return;
        }
        wallet -= it.price; owned[it.id] = true; if (type === 'sail') equipped = it.id;
        saveWallet(); renderShop();
        tone(880, 0.1, 'triangle', 0.1); tone(1320, 0.18, 'triangle', 0.1, 0, 0.1);
      };
      box.appendChild(b);
    }
  }
}
function paintShopPreview(tm) {
  const c = $('shopPreview'), w = c.width / DPR, h = c.height / DPR;
  const main = ctx, mU = U, mSEA = SEA;
  ctx = c.getContext('2d'); ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#6fb8e8'); g.addColorStop(0.72, '#cdeefb'); g.addColorStop(0.72, '#23adc6'); g.addColorStop(1, '#0d6589');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  U = Math.min(1.2, h / 120); SEA = h * 0.78;
  drawCanoe({ color: PLAYER_COLORS[0], sail: equipped, boatType: boatType(), motor: motor(), boat: { x: w / 2 - 20 * U, vx: 0 }, bend: 0 }, tm, 0.2, false);
  ctx = main; U = mU; SEA = mSEA;
}
$('shopBtn').onclick = openShop;
document.querySelectorAll('[data-back]').forEach(b => b.addEventListener('click', () => { shopOpen = false; $('bestScore').textContent = best; showWallet(); }));

// ============ Main loop ============
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000 || 0); last = now;
  const tm = now / 1000;
  if (G && (state === 'play' || state === 'countdown')) { update(dt); if (G && (state === 'play' || state === 'countdown')) updateHud(); }
  else if (!G) { for (const c of world.clouds) c.x = (c.x + c.v * U * dt) % (W + 200); menuBoat.boat.x = W * 0.3 + Math.sin(tm * 0.3) * W * 0.12; }
  draw(tm);
  if (cardView) paintCreature($('cardArt'), cardView.id, tm, false);
  if (shopOpen) paintShopPreview(tm);
  requestAnimationFrame(loop);
}

resize(); applyLang(); applyLevel(); showWallet(); $('bestScore').textContent = best;
requestAnimationFrame(loop);

// Install button: uses the browser's install prompt when it offers one, otherwise shows step-by-step help.
let installEvt = null;
const isInstalled = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const inFrame = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (!isInstalled()) $('installBtn').hidden = false; });
window.addEventListener('appinstalled', () => { installEvt = null; $('installBtn').hidden = true; });
if (!isInstalled() && !inFrame && location.protocol.startsWith('http')) $('installBtn').hidden = false;
$('installBtn').onclick = async () => {
  if (installEvt) {
    installEvt.prompt();
    try { const r = await installEvt.userChoice; if (r.outcome === 'accepted') $('installBtn').hidden = true; } catch (e) {}
    installEvt = null;
  } else show('installHelp');
};

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
